<script>
/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
let chaos=.5, entropy=.4;
let eegActive=false;
let scene,camera,renderer,shaderMat,mesh,particles,liquidWeb,videoTex;
let prevFrame=null;

const vs={
  tx:innerWidth/2, ty:innerHeight/2,
  cx:innerWidth/2, cy:innerHeight/2,
  lastSwitch:Date.now(), trans:1, tTrans:1,
  interacting:false, subMode:0, modeCount:0, phase:1,
};

/* ── AI state ──────────────────────────────────────────── */
const ai={
  phase:'init',        // init → warming → generating → revealing → idle → loop
  warmupDone:false,
  blendNow:0,
  blendTarget:0,
  revealCanvas:null,
  revealCtx:null,
  revealImg:null,
  revealAlpha:0,
  revealAlphaTarget:0,
  generating:false,
  lastGen:0,
  loopTimer:null,
  countdownStart:0,
  countdownLen:0,
};

/* ── Countdown ring ─────────────────────────────────── */
const ringArc=document.getElementById('ring-arc');
const ringDiv=document.getElementById('ai-ring');
const RING_CIRC=125.6;

function setRing(t01){
  const off=RING_CIRC*(1-t01);
  ringArc.setAttribute('stroke-dashoffset',off.toFixed(1));
}

/* ── AI Canvas reveal overlay ──────────────────────── */
function initAICanvas(){
  const cv=document.getElementById('ai-canvas');
  cv.width=innerWidth; cv.height=innerHeight;
  ai.revealCanvas=cv;
  ai.revealCtx=cv.getContext('2d');
}
window.addEventListener('resize',()=>{
  if(ai.revealCanvas){ai.revealCanvas.width=innerWidth;ai.revealCanvas.height=innerHeight;}
});

/* ── Draw AI image onto reveal canvas (cover-fit + glitch) */
let revealGlitchT=0;
function drawReveal(){
  if(!ai.revealImg||!ai.revealCtx) return;
  const cv=ai.revealCanvas,ctx=ai.revealCtx;
  const iw=ai.revealImg.naturalWidth||512,ih=ai.revealImg.naturalHeight||512;
  const scale=Math.max(cv.width/iw,cv.height/ih);
  const dw=iw*scale,dh=ih*scale;
  const dx=(cv.width-dw)/2,dy=(cv.height-dh)/2;

  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();
  ctx.globalAlpha=1;

  // Slight RGB channel split for glitch feel
  const gAmt=(Math.random()-.5)*4*(chaos+.2);
  if(Math.random()<.12){
    ctx.globalCompositeOperation='screen';
    ctx.filter='url(#none)';
    // R channel
    ctx.globalAlpha=.7;
    ctx.drawImage(ai.revealImg,dx+gAmt,dy,dw,dh);
    ctx.globalAlpha=.7;
    ctx.drawImage(ai.revealImg,dx-gAmt,dy,dw,dh);
    ctx.globalCompositeOperation='source-over';
  }
  ctx.globalAlpha=1;
  ctx.filter='saturate(.7) contrast(1.05)';
  ctx.drawImage(ai.revealImg,dx,dy,dw,dh);
  ctx.filter='none';
  ctx.restore();

  // scanline overlay
  ctx.save();
  ctx.globalAlpha=0.04+entropy*.04;
  for(let y=0;y<cv.height;y+=3){
    ctx.fillStyle='#000';
    ctx.fillRect(0,y,cv.width,1);
  }
  ctx.restore();

  // vignette
  const vg=ctx.createRadialGradient(cv.width/2,cv.height/2,cv.height*.25,cv.width/2,cv.height/2,cv.height*.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.72)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,cv.width,cv.height);
}

/* ═══════════════════════════════════════════════════════════
   PROMPT BUILDER  (6 modes × 2 variants)
═══════════════════════════════════════════════════════════ */
const PROMPTS=[
  ["biometric face scan art, cyan phosphorescent neural network, machine vision portrait, dark void, glowing contour lines of a human face, cinematic",
   "AI perceiving human presence, face dissolved in cyan data streams, surveillance art, dark background"],
  ["wireframe human portrait, pure white edge-detection lines on black, algorithmic face topology, circuit board identity, fine art photography",
   "canny edge portrait, machine archaeology of the self, structural lines only, technical sublime"],
  ["photographic negative portrait, X-ray face, inverted reality, ghost identity, solarized noir, cinematic dark",
   "AI seeing inverse of existence, negative exposure self-portrait, spectral presence in darkness"],
  ["bilateral symmetry face portrait, sacred geometry human, Rorschach identity mandala, mirror reflection art, symmetrical dark beauty",
   "observer observing observer, fractal self, infinite reflection portrait, the eye gazing back"],
  ["mosaic pixelated face, low resolution surveillance portrait, 8bit pixel art identity, censored by squares, digital impressionism",
   "AI assembling a human from fragments, pixel archaeology, consciousness at minimum resolution"],
  ["chromatic aberration portrait, RGB channel split face, prism eye seeing a soul, glitch art identity, vaporwave spectral",
   "machine perceiving color dispersion, spectrum split self, optical error as revelation"],
];

function buildPrompt(){
  const pool=PROMPTS[vs.subMode]||PROMPTS[0];
  const base=pool[Math.floor(Math.random()*pool.length)];
  const cw=chaos>.7?'extreme fragmentation distortion,':chaos>.4?'subtle displacement organic,':'crystalline precise minimal,';
  const ew=entropy>.7?'dissolution entropy chaos,':entropy>.4?'flowing entropic,':'structured ordered,';
  return `${cw}${ew}${base}, 8k masterpiece, no text no watermark`;
}

/* ═══════════════════════════════════════════════════════════
   GENERATE AI IMAGE  (Pollinations.ai — free, no key)
═══════════════════════════════════════════════════════════ */
async function generateAI(){
  if(ai.generating) return;
  ai.generating=true;
  ai.lastGen=Date.now();

  const btn=document.getElementById('btn-ai');
  const led=document.getElementById('ai-led');
  const txt=document.getElementById('ai-txt');
  const prm=document.getElementById('ai-prompt');

  btn.className='ibtn amber';
  led.className='think';
  txt.textContent='AI_GAZE :: 生成中…';

  const prompt=buildPrompt();
  prm.textContent=prompt.length>65?prompt.substring(0,65)+'…':prompt;
  prm.classList.add('show');

  const seed=Math.floor(Math.random()*99999);
  const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=768&height=768&nologo=true&seed=${seed}&model=flux`;

  try{
    const img=new Image();
    img.crossOrigin='anonymous';
    await new Promise((res,rej)=>{
      img.onload=res; img.onerror=rej; img.src=url;
      setTimeout(()=>rej(new Error('timeout')),32000);
    });

    ai.revealImg=img;
    drawReveal();

    // Fade in the overlay
    const revealEl=document.getElementById('ai-reveal');
    const maxOpacity=0.55+chaos*.2;  // 0.55–0.75 depending on chaos
    revealEl.style.opacity=maxOpacity.toFixed(2);

    btn.className='ibtn white';
    led.className='live';
    txt.textContent=`AI_GAZE :: 融入場景`;

    // Start countdown to next generation
    scheduleNextGen();

  }catch(e){
    console.warn('AI gen fail:',e);
    btn.className='ibtn';
    led.className='';
    txt.textContent='AI_GAZE :: 連線中斷，等待重試';
    prm.classList.remove('show');
    setTimeout(()=>scheduleNextGen(),8000);
  }
  ai.generating=false;
}

/* ── Schedule next auto-generation ─────────────────────── */
function scheduleNextGen(){
  if(ai.loopTimer) clearTimeout(ai.loopTimer);
  // interval: 25s at low entropy → 14s at high entropy
  const interval=Math.round(25000-entropy*11000);
  ai.countdownStart=Date.now();
  ai.countdownLen=interval;

  ringDiv.classList.add('show');
  document.getElementById('ai-ring-txt').textContent='AI';

  ai.loopTimer=setTimeout(()=>{
    ringDiv.classList.remove('show');
    // Fade out current reveal, then gen new
    const revealEl=document.getElementById('ai-reveal');
    revealEl.style.transition='opacity 1.2s ease';
    revealEl.style.opacity='0';
    setTimeout(()=>generateAI(),1300);
  },interval);
}

/* ─── Countdown animation (called each frame) ──────────── */
function tickCountdown(){
  if(!ai.countdownStart) return;
  const elapsed=Date.now()-ai.countdownStart;
  const t=Math.min(1,elapsed/ai.countdownLen);
  setRing(t);
}

/* ═══════════════════════════════════════════════════════════
   FIREBASE
═══════════════════════════════════════════════════════════ */
let auth=null;
try{
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth();

/* ═══════════════════════════════════════════════════════════
   EEG
═══════════════════════════════════════════════════════════ */
const MS=0xfe8d,MC='273e0001-4c4d-454d-96be-f03bac821358',ME='273e0004-4c4d-454d-96be-f03bac821358';
let mg=null,eb=[];
function fft(re,im){
  const n=re.length;if(n<=1)return;
  const h=n>>1,rE=[],rO=[],iE=[],iO=[];
  for(let i=0;i<h;i++){rE[i]=re[i*2];iE[i]=im[i*2];rO[i]=re[i*2+1];iO[i]=im[i*2+1];}
  fft(rE,iE);fft(rO,iO);
  for(let k=0;k<h;k++){
    const a=-2*Math.PI*k/n,c=Math.cos(a),s=Math.sin(a);
    const tr=c*rO[k]-s*iO[k],ti=s*rO[k]+c*iO[k];
    re[k]=rE[k]+tr;im[k]=iE[k]+ti;re[k+h]=rE[k]-tr;im[k+h]=iE[k]-ti;
  }
}
function procEEG(v){
  const d=new DataView(v.buffer),dec=[];
  for(let i=2;i<d.byteLength-2;i+=3){
    dec.push(((d.getUint8(i)<<4)|(d.getUint8(i+1)>>4))-2048);
    dec.push((((d.getUint8(i+1)&0x0F)<<8)|d.getUint8(i+2))-2048);
  }
  eb.push(...dec);
  if(eb.length>256){
    const sig=eb.slice(-256),re=[...sig],im=new Array(256).fill(0);
    fft(re,im);
    let aP=0,bP=0;
    const b=hz=>Math.round(hz*256/256);
    for(let i=b(8);i<b(13);i++)aP+=re[i]*re[i]+im[i]*im[i];
    for(let i=b(13);i<b(30);i++)bP+=re[i]*re[i]+im[i]*im[i];
    const tot=aP+bP+1e-6,al=aP/tot,be=bP/tot;
    entropy=.1+al*.9;chaos=.1+be*.9;
    setNeedle('nc',chaos);setNeedle('ne',entropy);
    document.getElementById('eeg').innerHTML=
      '<div style="color:#4ade80;margin-bottom:2px;">&#x2B24; MUSE LIVE</div>'+
      '<div>&#945;_RELAX: '+(al*100).toFixed(0)+'%</div>'+
      '<div>&#946;_FOCUS: '+(be*100).toFixed(0)+'%</div>';
    eb=eb.slice(-256);
  }
}
document.getElementById('btn-e').addEventListener('click',async()=>{
  const cw=document.getElementById('wc'),ew=document.getElementById('we');
  if(eegActive){
    if(mg)mg.disconnect();eegActive=false;
    document.getElementById('btn-e').className='ibtn';
    document.getElementById('eeg').textContent='— 未連線';
    cw.classList.remove('locked');ew.classList.remove('locked');return;
  }
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:[MS]}],optionalServices:[MS]});
    mg=await dev.gatt.connect();
    const svc=await mg.getPrimaryService(MS),ch=await svc.getCharacteristic(ME);
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',e=>procEEG(e.target.value));
    const ctrl=await svc.getCharacteristic(MC),enc=new TextEncoder();
    await ctrl.writeValue(enc.encode('v1\n'));await ctrl.writeValue(enc.encode('p21\n'));await ctrl.writeValue(enc.encode('d\n'));
    eegActive=true;document.getElementById('btn-e').className='ibtn green';
    cw.classList.add('locked');ew.classList.add('locked');
    dev.addEventListener('gattserverdisconnected',()=>{
      eegActive=false;document.getElementById('btn-e').className='ibtn';
      cw.classList.remove('locked');ew.classList.remove('locked');
    });
  }catch(e){console.error('EEG fail',e);}
});

/* ═══════════════════════════════════════════════════════════
   KNOBS
═══════════════════════════════════════════════════════════ */
function setNeedle(id,v){const el=document.getElementById(id);if(el)el.style.transform='rotate('+(v*280-140)+'deg)';}
function mkKnob(kid,nid,get,set){
  const k=document.getElementById(kid);let drag=false,ly=0;
  const s=y=>{if(eegActive)return;drag=true;ly=y;k.classList.add('drag');};
  const m=y=>{if(!drag||eegActive)return;const v=Math.max(0,Math.min(1,get()+(ly-y)*.008));set(v);setNeedle(nid,v);ly=y;};
  const e=()=>{drag=false;k.classList.remove('drag');};
  k.addEventListener('mousedown',ev=>{ev.stopPropagation();s(ev.clientY);});
  window.addEventListener('mousemove',ev=>m(ev.clientY));
  window.addEventListener('mouseup',e);
  k.addEventListener('touchstart',ev=>{ev.stopPropagation();s(ev.touches[0].clientY);},{passive:false});
  window.addEventListener('touchmove',ev=>{if(drag){ev.preventDefault();m(ev.touches[0].clientY);}},{passive:false});
  window.addEventListener('touchend',e);
}
mkKnob('kc','nc',()=>chaos,v=>chaos=v);
mkKnob('ke','ne',()=>entropy,v=>entropy=v);

/* ═══════════════════════════════════════════════════════════
   THREE.JS
═══════════════════════════════════════════════════════════ */
async function initThree(){
  const video=document.getElementById('video');
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:"user"}});
    video.srcObject=s;await video.play();
  }catch(e){console.error('cam fail',e);}

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
  camera.position.z=110;
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  document.getElementById('container').appendChild(renderer.domElement);

  videoTex=new THREE.VideoTexture(video);

  shaderMat=new THREE.ShaderMaterial({
    uniforms:{
      tDiffuse:{value:videoTex},
      phasePair:{value:1},subMode:{value:0},
      time:{value:0},chaos:{value:.5},transition:{value:1.0}
    },
    vertexShader:`
      varying vec2 vUv; uniform float time; uniform float chaos;
      void main(){
        vUv=uv; vec3 pos=position;
        float wave=sin(time*(1.1+chaos*1.5)+(pos.x*.06+pos.y*.06))*(chaos*20.0);
        pos.z+=wave;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.0);
      }
    `,
    fragmentShader:`
      uniform sampler2D tDiffuse;
      uniform int phasePair,subMode;
      uniform float time,chaos,transition;
      varying vec2 vUv;
      void main(){
        vec2 uv=vUv;
        if(chaos>.1){
          float d=distance(uv,vec2(.5));
          uv.x+=sin(d*12.0-time*1.5)*.025*chaos;
          uv.y+=cos(d*12.0-time*1.5)*.025*chaos;
        }
        vec4 fc;
        if(subMode==3) uv.x=abs(uv.x-.5)+.25;
        if(subMode==4){float sz=60.0-(chaos*50.0);uv=floor(uv*sz)/sz;}
        if(subMode==5){
          float sh=.03*chaos;
          fc=vec4(texture2D(tDiffuse,uv+vec2(sh,0.0)).r,
                  texture2D(tDiffuse,uv).g,
                  texture2D(tDiffuse,uv-vec2(sh,0.0)).b,1.0);
        } else fc=texture2D(tDiffuse,uv);
        float luma=dot(fc.rgb,vec3(.299,.587,.114));
        if(subMode==0){
          vec3 col=mix(vec3(.05),vec3(.7,.85,1.0),luma);
          if(luma>.55)col=mix(col,vec3(1.0),(luma-.55)*2.5);
          fc=vec4(col,1.0);
        } else if(subMode==1){
          fc=vec4(vec3(fwidth(luma)*(18.0+chaos*25.0)),1.0);
        } else if(subMode==2){
          fc.rgb=vec3(1.0)-fc.rgb; fc.rgb*=vec3(.9,.95,1.0);
        }
        gl_FragColor=fc*transition;
      }
    `,
    transparent:true
  });

  mesh=new THREE.Mesh(new THREE.PlaneBufferGeometry(235,175,64,64),shaderMat);
  scene.add(mesh);

  particles=new THREE.Group();
  const cols=15,rows=12,pw=230/cols,ph=170/rows;
  const geos=[
    new THREE.TorusKnotBufferGeometry(pw/3.6,.1,32,8),
    new THREE.OctahedronBufferGeometry(pw/2.1,1),
    new THREE.CylinderBufferGeometry(pw/4.5,pw/4.5,ph*.8,8,1),
    new THREE.SphereBufferGeometry(pw/2.2,16,12),
  ];
  const scales=[1.8,1.3,1.0,.5];
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    const p=new THREE.Mesh(geos[Math.floor(Math.random()*geos.length)],shaderMat);
    const sc=scales[Math.floor(Math.random()*scales.length)];
    p.scale.set(sc,sc,sc);
    p.position.set(i*pw-115+pw/2,j*ph-85+ph/2,(Math.random()-.5)*20);
    p.userData={origin:p.position.clone(),v:new THREE.Vector3(),noise:Math.random()*100};
    particles.add(p);
  }
  scene.add(particles);

  liquidWeb=new THREE.LineSegments(
    new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({color:0x444444,transparent:true,opacity:.08})
  );
  scene.add(liquidWeb);

  /* ── Warmup: let base scene run for 6s, then first AI gen ── */
  document.getElementById('ai-txt').textContent='AI_GAZE :: 場景初始化中…';
  setTimeout(()=>{
    document.getElementById('ai-txt').textContent='AI_GAZE :: 開始觀察…';
    generateAI();
  },6000);

  animate();
}

/* ═══════════════════════════════════════════════════════════
   MOTION TRACKING
═══════════════════════════════════════════════════════════ */
const elCur=document.getElementById('cur'),elCrt=document.getElementById('crt');
let tf=0;
function trackMotion(){
  tf++;if(tf%8!==0||vs.interacting)return;
  const v=document.getElementById('video'),c=document.getElementById('mc');
  if(!v||v.readyState<2)return;
  const ctx=c.getContext('2d');
  ctx.drawImage(v,0,0,c.width,c.height);
  const cur=ctx.getImageData(0,0,c.width,c.height);
  if(prevFrame){
    let tx=0,ty=0,cnt=0;
    for(let i=0;i<cur.data.length;i+=4){
      const d=(Math.abs(cur.data[i]-prevFrame.data[i])+Math.abs(cur.data[i+1]-prevFrame.data[i+1])+Math.abs(cur.data[i+2]-prevFrame.data[i+2]))/3;
      if(d>26){const idx=i/4;tx+=idx%c.width;ty+=Math.floor(idx/c.width);cnt++;}
    }
    if(cnt>25){
      let nx=1.0-(tx/cnt/c.width);
      nx=Math.max(0,Math.min(1,(nx-.05)/.9));
      vs.tx=nx*innerWidth;vs.ty=(ty/cnt/c.height)*innerHeight;
      elCur.classList.add('on');
    } else elCur.classList.remove('on');
  }
  if(!prevFrame)prevFrame=new ImageData(cur.width,cur.height);
  prevFrame.data.set(cur.data);
}

/* ═══════════════════════════════════════════════════════════
   MAIN LOOP
═══════════════════════════════════════════════════════════ */
function animate(){
  requestAnimationFrame(animate);
  const t=Date.now()*.001;
  if(!shaderMat)return;

  shaderMat.uniforms.time.value=t;
  shaderMat.uniforms.chaos.value=chaos;
  vs.trans+=(vs.tTrans-vs.trans)*.12;
  shaderMat.uniforms.transition.value=vs.trans;

  // Redraw reveal canvas each frame (subtle animation)
  if(ai.revealImg) drawReveal();

  trackMotion();
  tickCountdown();

  // Update progress bar to show blend
  const revealEl=document.getElementById('ai-reveal');
  const curOp=parseFloat(revealEl.style.opacity||0);
  const maxOp=.55+chaos*.2;
  document.getElementById('ai-prog').style.width=((curOp/maxOp)*100).toFixed(1)+'%';

  elCrt.style.opacity=(0.7+Math.sin(t*50)*.02*entropy).toString();

  vs.cx+=(vs.tx-vs.cx)*.22;vs.cy+=(vs.ty-vs.cy)*.22;
  elCur.style.left=vs.cx+'px';elCur.style.top=vs.cy+'px';

  const ct=8000/(.35+entropy*1.8);
  if(Date.now()-vs.lastSwitch>ct){
    vs.tTrans=.1;
    setTimeout(()=>{
      vs.modeCount=(vs.modeCount+1)%6;vs.subMode=vs.modeCount;
      vs.phase=Math.floor(Math.random()*3)+1;
      shaderMat.uniforms.subMode.value=vs.subMode;
      shaderMat.uniforms.phasePair.value=vs.phase;
      mesh.visible=(vs.phase===1||vs.phase===3);
      particles.visible=(vs.phase===2||vs.phase===3);
      vs.tTrans=1.0;
    },400);
    vs.lastSwitch=Date.now();
  }

  const wm=new THREE.Vector3(
    ((vs.cx/innerWidth)*2-1)*115,
    -((vs.cy/innerHeight)*2-1)*85,10
  );

  if(mesh.visible){
    const arr=mesh.geometry.attributes.position.array;
    for(let i=0;i<arr.length;i+=3){
      const dist=Math.sqrt((arr[i]-wm.x)**2+(arr[i+1]-wm.y)**2);
      const j=(Math.random()-.5)*entropy*2;
      let z=Math.sin(t*1.2+(arr[i]+arr[i+1])*.04)*(4.5+chaos*8)+j;
      if(dist<100)z+=(100-dist)*(.6+chaos*1.8);
      arr[i+2]=z;
    }
    mesh.geometry.attributes.position.needsUpdate=true;
  }

  if(particles.visible){
    const pts=[];
    particles.children.forEach(p=>{
      const ud=p.userData;
      const tg=ud.origin.clone();
      tg.x+=Math.sin(t*(.35+chaos*1.3)+ud.noise)*(42*chaos);
      tg.y+=Math.cos(t*.85*(.35+chaos*1.3)+ud.noise)*(42*chaos);
      const dist=p.position.distanceTo(wm);
      if(dist<88){
        ud.v.add(new THREE.Vector3().subVectors(p.position,wm).normalize().multiplyScalar((1-dist/88)*(3.5+chaos*9)));
        if(Math.random()>.85)pts.push(p.position.x,p.position.y,p.position.z,wm.x,wm.y,wm.z);
      }
      ud.v.add(new THREE.Vector3().subVectors(tg,p.position).multiplyScalar(.025));
      ud.v.multiplyScalar(.86-chaos*.12);
      p.position.add(ud.v);
      p.rotation.x+=ud.v.length()*.07;
    });
    liquidWeb.geometry.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
    liquidWeb.geometry.attributes.position.needsUpdate=true;
  }
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  if(camera&&renderer){
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  }
});

function onTouch(x,y){vs.interacting=true;vs.tx=x;vs.ty=y;}
const cont=document.getElementById('container');
cont.addEventListener('mousedown',e=>onTouch(e.clientX,e.clientY));
cont.addEventListener('mousemove',e=>{if(e.buttons>0)onTouch(e.clientX,e.clientY);});
cont.addEventListener('mouseup',()=>vs.interacting=false);
cont.addEventListener('touchstart',e=>onTouch(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
cont.addEventListener('touchmove',e=>onTouch(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
cont.addEventListener('touchend',()=>vs.interacting=false);

initAICanvas();
initThree();
</script>
