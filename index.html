<script>
/* ═══════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════ */
let chaos=.5,entropy=.4;
let eegActive=false;
let scene,camera,renderer,shaderMat,mesh,particles,liquidWeb,videoTex;
let prevFrame=null;

const vs={
  tx:innerWidth/2,ty:innerHeight/2,cx:innerWidth/2,cy:innerHeight/2,
  lastSwitch:Date.now(),trans:1,tTrans:1,
  interacting:false,subMode:0,modeCount:0,phase:1,
};

/* ═══════════════════════════════════════════════
   AI CANVAS  — the deliberate construction effect
═══════════════════════════════════════════════ */
const aiCv  = document.getElementById('ai-canvas');
const aiCtx = aiCv.getContext('2d');

function resizeAICanvas(){
  aiCv.width=innerWidth; aiCv.height=innerHeight;
}
resizeAICanvas();
window.addEventListener('resize',resizeAICanvas);

/* ── off-screen work canvas for pixel ops ─── */
const offCv  = document.createElement('canvas');
const offCtx = offCv.getContext('2d');

let aiState={
  phase:'idle',   // idle|loading|constructing|settled|fading
  img:null,
  constructT:0,   // 0→1 progress
  constructDur:3800,  // ms to build up
  settleTimer:null,
  loopTimer:null,
  lastGen:0,
};

const LOG_EL  = document.getElementById('ai-log');
const PROG_EL = document.getElementById('ai-prog-inner');
const PROG_OUTER = document.getElementById('ai-prog-outer');
const DOT_EL  = document.getElementById('ai-term-dot');
const TERM_EL = document.getElementById('ai-terminal');
const PROMPT_EL = document.getElementById('ai-prompt-line');

let logLines=[];
function addLog(text,cls=''){
  const s=document.createElement('span');
  s.className='line'+(cls?' '+cls:'');
  s.textContent=text;
  LOG_EL.appendChild(s);
  logLines.push(s);
  if(logLines.length>7){
    logLines[0].classList.add('dim');
    if(logLines.length>10) logLines.shift().remove();
  }
  LOG_EL.scrollTop=LOG_EL.scrollHeight;
}
function setProgress(v){
  PROG_EL.style.width=(v*100).toFixed(1)+'%';
  PROG_OUTER.classList.toggle('active',v>0&&v<1);
}

/* ── DRAW PHASES ──────────────────────────────
   Phase A  (loading):  animated static noise + scan bars
   Phase B  (constructing): pixelated → medium → sharp
   Phase C  (settled):  final image with subtle drift
   Phase D  (fading):   dissolves back to noise, fades out
─────────────────────────────────────────────── */

/* noise helper */
function drawNoise(ctx,w,h,alpha,blockSize){
  const bw=Math.ceil(w/blockSize),bh=Math.ceil(h/blockSize);
  for(let x=0;x<bw;x++) for(let y=0;y<bh;y++){
    const v=Math.random()*255|0;
    ctx.fillStyle=`rgba(${v},${Math.floor(v*.6)},${Math.floor(v*.3)},${alpha})`;
    ctx.fillRect(x*blockSize,y*blockSize,blockSize,blockSize);
  }
}

/* scanline sweep */
function drawScanBar(ctx,w,h,t){
  const y=(t%1)*h;
  const g=ctx.createLinearGradient(0,y-40,0,y+40);
  g.addColorStop(0,'rgba(255,180,0,0)');
  g.addColorStop(.5,'rgba(255,180,0,0.18)');
  g.addColorStop(1,'rgba(255,180,0,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,y-40,w,80);
}

/* pixelated image at given resolution */
function drawPixelated(srcImg,ctx,w,h,res){
  if(!srcImg) return;
  offCv.width=res; offCv.height=res;
  offCtx.drawImage(srcImg,0,0,res,res);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(offCv,0,0,w,h);
  ctx.imageSmoothingEnabled=true;
}

/* scanline pass */
function applyScanlines(ctx,w,h,intensity){
  ctx.save();
  ctx.globalAlpha=intensity;
  for(let y=0;y<h;y+=3){
    ctx.fillStyle='#000';
    ctx.fillRect(0,y,w,1);
  }
  ctx.restore();
}

/* vignette */
function applyVignette(ctx,w,h){
  const vg=ctx.createRadialGradient(w/2,h/2,h*.2,w/2,h/2,h*.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,0.75)');
  ctx.fillStyle=vg;
  ctx.fillRect(0,0,w,h);
}

/* RGB glitch shift */
function applyGlitch(ctx,img,w,h,amt){
  if(!img||amt<.005) return;
  ctx.save();
  ctx.globalCompositeOperation='screen';
  ctx.globalAlpha=.45;
  // R
  ctx.drawImage(img,-amt*w,0,w,h);
  // B
  ctx.globalAlpha=.35;
  ctx.drawImage(img,amt*w,0,w,h);
  ctx.restore();
}

/* horizontal glitch bar tears */
function applyTears(ctx,img,w,h,chaos){
  if(!img) return;
  const n=Math.floor(chaos*6)+1;
  ctx.save();
  for(let i=0;i<n;i++){
    if(Math.random()>.55) continue;
    const sy=Math.random()*h;
    const sh=Math.random()*20+4;
    const dx=(Math.random()-.5)*40*chaos;
    ctx.drawImage(img,0,sy,w,sh,dx,sy,w,sh);
  }
  ctx.restore();
}

/* ── Master render each frame ─────────────────
   Called from Three.js animate()
─────────────────────────────────────────────── */
let frameT=0;
function renderAICanvas(){
  const w=aiCv.width,h=aiCv.height;
  aiCtx.clearRect(0,0,w,h);
  frameT+=.016;

  if(aiState.phase==='loading'){
    /* ── Animated static noise while waiting for Pollinations ── */
    drawNoise(aiCtx,w,h,.55,Math.random()<.3?6:12);
    drawScanBar(aiCtx,w,h,frameT*.5);
    // horizontal glitch bars
    if(Math.random()<.15){
      const y=Math.random()*h, sh=Math.random()*8+2;
      aiCtx.save();
      aiCtx.fillStyle=`rgba(255,${Math.random()*60|0},0,${Math.random()*.4})`;
      aiCtx.fillRect(0,y,w,sh);
      aiCtx.restore();
    }
    setProgress((.5+Math.sin(frameT*3)*.3));
    aiCv.style.opacity='.8';

  } else if(aiState.phase==='constructing'){
    /* ── Progressive build: noise→pixelated→sharp ── */
    const t=Math.min(1,(Date.now()-aiState.constructStart)/aiState.constructDur);
    aiState.constructT=t;
    setProgress(t);

    const w=aiCv.width,h=aiCv.height;

    if(t<.18){
      /* pure noise, image fragments appearing */
      drawNoise(aiCtx,w,h,.5,16);
      if(aiState.img && t>.06){
        aiCtx.save();
        aiCtx.globalAlpha=(t-.06)/.12*0.3;
        drawPixelated(aiState.img,aiCtx,w,h,8);
        aiCtx.restore();
      }
      drawScanBar(aiCtx,w,h,frameT*.9);

    } else if(t<.40){
      /* blocky 16×16 mosaic sweeping in */
      const p=(t-.18)/.22;
      const tileRes=Math.floor(8+p*24);  // 8→32
      drawNoise(aiCtx,w,h,(1-p)*.35,tileRes);
      aiCtx.save();
      aiCtx.globalAlpha=p*.85;
      drawPixelated(aiState.img,aiCtx,w,h,tileRes);
      aiCtx.restore();
      applyGlitch(aiCtx,aiState.img,w,h,(1-p)*.03);
      drawScanBar(aiCtx,w,h,frameT*.7);

    } else if(t<.68){
      /* medium res — image recognisable, still blocky */
      const p=(t-.40)/.28;
      const tileRes=Math.floor(32+p*128);  // 32→160
      aiCtx.save();
      aiCtx.globalAlpha=.88;
      drawPixelated(aiState.img,aiCtx,w,h,tileRes);
      aiCtx.restore();
      applyGlitch(aiCtx,aiState.img,w,h,(1-p)*.018);
      applyTears(aiCtx,aiState.img,w,h,(1-p)*chaos);
      if(Math.random()<.08) drawNoise(aiCtx,w,h,.12,tileRes);
      drawScanBar(aiCtx,w,h,frameT*.5);

    } else {
      /* sharpening to final */
      const p=(t-.68)/.32;
      aiCtx.save();
      aiCtx.globalAlpha=1;
      aiCtx.filter=`saturate(${.5+p*.5}) contrast(${1+p*.08})`;
      aiCtx.drawImage(aiState.img,0,0,w,h);
      aiCtx.filter='none';
      aiCtx.restore();
      // residual glitch decays
      applyGlitch(aiCtx,aiState.img,w,h,(1-p)*.008);
      if(Math.random()<.04*(1-p)) applyTears(aiCtx,aiState.img,w,h,(1-p)*chaos);
      drawScanBar(aiCtx,w,h,frameT*.3*(1-p));
    }

    applyScanlines(aiCtx,w,h,.06);
    applyVignette(aiCtx,w,h);
    aiCv.style.opacity='.85';

    if(t>=1){
      aiState.phase='settled';
      aiState.constructT=1;
      DOT_EL.className='done';
      addLog('> RENDER COMPLETE','done');
      addLog('> OBSERVING…','done');
      setProgress(1);
      scheduleNext();
    }

  } else if(aiState.phase==='settled'){
    /* ── Stable but alive: subtle drift + persistent scan ── */
    aiCtx.save();
    aiCtx.filter='saturate(.65) contrast(1.06)';
    // very slow UV drift via tiny canvas transform
    const drift=Math.sin(frameT*.12)*.003*w;
    aiCtx.drawImage(aiState.img,drift,0,w,h);
    aiCtx.filter='none';
    aiCtx.restore();
    applyGlitch(aiCtx,aiState.img,w,h,.003*chaos);
    if(Math.random()<.04) applyTears(aiCtx,aiState.img,w,h,.015*chaos);
    applyScanlines(aiCtx,w,h,.055);
    applyVignette(aiCtx,w,h);
    aiCv.style.opacity='.82';

  } else if(aiState.phase==='fading'){
    /* ── Dissolve back to noise then out ── */
    const t=Math.min(1,(Date.now()-aiState.fadeStart)/1800);
    aiCtx.save();
    aiCtx.globalAlpha=1-t*.7;
    aiCtx.filter='saturate(.4)';
    aiCtx.drawImage(aiState.img,0,0,w,h);
    aiCtx.filter='none';
    aiCtx.restore();
    drawNoise(aiCtx,w,h,t*.6,Math.random()<.4?6:12);
    applyScanlines(aiCtx,w,h,.08);
    applyVignette(aiCtx,w,h);
    aiCv.style.opacity=((1-t)*.85).toFixed(3);
    if(t>=1){
      aiState.phase='idle';
      aiCv.style.opacity='0';
    }
  }
}

/* ═══════════════════════════════════════════════
   PROMPT BUILDER
═══════════════════════════════════════════════ */
const PROMPTS=[
  ["biometric face scan, cyan phosphorescent neural network portrait, machine vision, dark void, glowing face contours, surveillance art, cinematic",
   "AI perceiving human presence, data portrait face dissolved in cyan light streams, biometric art"],
  ["wireframe human portrait, pure white edge lines on black void, algorithmic face recognition, circuit topology of identity, technical art",
   "machine seeing structural edges of a face, canny detection portrait, dark void background"],
  ["photographic negative portrait, X-ray face vision, inverted identity, ghost image, noir solarized",
   "AI seeing inverse reality, negative exposure self-portrait, spectral presence in darkness"],
  ["bilateral symmetry face portrait, sacred geometry human, Rorschach identity, mirror reflection dark art, symmetrical",
   "observer observing observer, fractal self portrait, infinite reflection, mandala face"],
  ["mosaic pixelated face portrait, surveillance pixels, 8bit digital identity, low resolution human, censored mosaic",
   "AI assembling human from fragments, pixel archaeology, consciousness at minimum resolution, retro digital"],
  ["chromatic aberration face portrait, RGB channel split, prism eye art, glitch vaporwave identity, spectrum split self",
   "machine perceiving color dispersion, optical error as revelation, spectrum split portrait"],
];

function buildPrompt(){
  const pool=PROMPTS[vs.subMode]||PROMPTS[0];
  const base=pool[Math.floor(Math.random()*pool.length)];
  const cw=chaos>.7?'extreme fragmentation distortion,':chaos>.4?'subtle displacement organic,':'crystalline precise minimal,';
  const ew=entropy>.7?'dissolution entropy chaos,':entropy>.4?'flowing entropic,':'structured ordered,';
  return `${cw}${ew}${base}, masterpiece 8k, no text no watermark`;
}

/* ═══════════════════════════════════════════════
   GENERATE  (Pollinations.ai — free, no key)
═══════════════════════════════════════════════ */
let generating=false;

async function generateAI(){
  if(generating) return;
  generating=true;
  aiState.lastGen=Date.now();

  const btn=document.getElementById('btn-ai');
  btn.className='ibtn amber';
  DOT_EL.className='hot';
  TERM_EL.classList.add('show');
  LOG_EL.innerHTML=''; logLines=[];

  addLog('> INIT GENERATIVE_PROCESS');
  addLog('> SAMPLING SCENE STATE…','hot');
  setProgress(0);

  await delay(400);
  const prompt=buildPrompt();
  PROMPT_EL.textContent=prompt.length>90?prompt.substring(0,90)+'…':prompt;
  PROMPT_EL.classList.add('show');
  addLog('> PROMPT ENCODED ['+prompt.split(',').length+' tokens]');

  await delay(300);
  addLog('> DISPATCHING TO MODEL…','hot');

  aiState.phase='loading';
  aiCv.style.opacity='0';
  // fade in canvas
  aiCv.style.transition='opacity .5s';
  await delay(100);
  aiCv.style.opacity='.8';

  const seed=Math.floor(Math.random()*99999);
  const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=768&height=768&nologo=true&seed=${seed}&model=flux`;

  addLog('> DIFFUSION RUNNING…','hot');

  try{
    const img=new Image();
    img.crossOrigin='anonymous';
    await new Promise((res,rej)=>{
      img.onload=res; img.onerror=rej; img.src=url;
      setTimeout(()=>rej(new Error('timeout')),35000);
    });

    addLog('> LATENT DECODED ✓');
    addLog('> CONSTRUCTING VISUAL…','hot');
    await delay(200);

    aiState.img=img;
    aiState.phase='constructing';
    aiState.constructStart=Date.now();
    aiState.constructT=0;

    btn.className='ibtn white';

  }catch(e){
    console.warn('gen fail:',e);
    addLog('> ERROR: CONNECTION LOST','hot');
    aiState.phase='idle';
    aiCv.style.transition='opacity 1s';
    aiCv.style.opacity='0';
    btn.className='ibtn';
    DOT_EL.className='';
    setTimeout(()=>scheduleNext(),6000);
  }
  generating=false;
}

function scheduleNext(){
  if(aiState.loopTimer) clearTimeout(aiState.loopTimer);
  const interval=Math.round(22000-entropy*9000); // 22s→13s
  addLog(`> NEXT OBSERVATION IN ${(interval/1000).toFixed(0)}s`);

  aiState.loopTimer=setTimeout(()=>{
    aiState.phase='fading';
    aiState.fadeStart=Date.now();
    addLog('> DISSOLVING…');
    DOT_EL.className='hot';
    // wait for fade then gen
    setTimeout(()=>generateAI(),1900);
  },interval);
}

function delay(ms){return new Promise(r=>setTimeout(r,ms));}

/* ═══════════════════════════════════════════════
   EEG
═══════════════════════════════════════════════ */
const MS=0xfe8d,MC='273e0001-4c4d-454d-96be-f03bac821358',ME='273e0004-4c4d-454d-96be-f03bac821358';
let mg=null,eb=[];
function fft(re,im){
  const n=re.length;if(n<=1)return;
  const h=n>>1,rE=[],rO=[],iE=[],iO=[];
  for(let i=0;i<h;i++){rE[i]=re[i*2];iE[i]=im[i*2];rO[i]=re[i*2+1];iO[i]=im[i*2+1];}
  fft(rE,iE);fft(rO,iO);
  for(let k=0;k<h;k++){
    const a=-2*Math.PI*k/n,c=Math.cos(a),s=Math.sin(a);
    const tr=c*rO[k]-s*iO[k],ti=s*rO[k]+c*iO[k];
    re[k]=rE[k]+tr;im[k]=iE[k]+ti;re[k+h]=rE[k]-tr;im[k+h]=iE[k]-ti;
  }
}
function procEEG(v){
  const d=new DataView(v.buffer),dec=[];
  for(let i=2;i<d.byteLength-2;i+=3){
    dec.push(((d.getUint8(i)<<4)|(d.getUint8(i+1)>>4))-2048);
    dec.push((((d.getUint8(i+1)&0x0F)<<8)|d.getUint8(i+2))-2048);
  }
  eb.push(...dec);
  if(eb.length>256){
    const sig=eb.slice(-256),re=[...sig],im=new Array(256).fill(0);
    fft(re,im);
    let aP=0,bP=0;
    const b=hz=>Math.round(hz*256/256);
    for(let i=b(8);i<b(13);i++)aP+=re[i]*re[i]+im[i]*im[i];
    for(let i=b(13);i<b(30);i++)bP+=re[i]*re[i]+im[i]*im[i];
    const tot=aP+bP+1e-6,al=aP/tot,be=bP/tot;
    entropy=.1+al*.9;chaos=.1+be*.9;
    setNeedle('nc',chaos);setNeedle('ne',entropy);
    document.getElementById('eeg').innerHTML=
      '<div style="color:#4ade80;margin-bottom:2px;">&#x2B24; MUSE LIVE</div>'+
      '<div>&#945;: '+(al*100).toFixed(0)+'%</div>'+
      '<div>&#946;: '+(be*100).toFixed(0)+'%</div>';
    eb=eb.slice(-256);
  }
}
document.getElementById('btn-e').addEventListener('click',async()=>{
  const cw=document.getElementById('wc'),ew=document.getElementById('we');
  if(eegActive){
    if(mg)mg.disconnect();eegActive=false;
    document.getElementById('btn-e').className='ibtn';
    document.getElementById('eeg').textContent='— 未連線';
    cw.classList.remove('locked');ew.classList.remove('locked');return;
  }
  try{
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:[MS]}],optionalServices:[MS]});
    mg=await dev.gatt.connect();
    const svc=await mg.getPrimaryService(MS),ch=await svc.getCharacteristic(ME);
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',e=>procEEG(e.target.value));
    const ctrl=await svc.getCharacteristic(MC),enc=new TextEncoder();
    await ctrl.writeValue(enc.encode('v1\n'));await ctrl.writeValue(enc.encode('p21\n'));await ctrl.writeValue(enc.encode('d\n'));
    eegActive=true;document.getElementById('btn-e').className='ibtn green';
    cw.classList.add('locked');ew.classList.add('locked');
    dev.addEventListener('gattserverdisconnected',()=>{
      eegActive=false;document.getElementById('btn-e').className='ibtn';
      cw.classList.remove('locked');ew.classList.remove('locked');
    });
  }catch(e){console.error('EEG fail',e);}
});

function setNeedle(id,v){const el=document.getElementById(id);if(el)el.style.transform='rotate('+(v*280-140)+'deg)';}
function mkKnob(kid,nid,get,set){
  const k=document.getElementById(kid);let drag=false,ly=0;
  const s=y=>{if(eegActive)return;drag=true;ly=y;k.classList.add('drag');};
  const m=y=>{if(!drag||eegActive)return;const v=Math.max(0,Math.min(1,get()+(ly-y)*.008));set(v);setNeedle(nid,v);ly=y;};
  const e=()=>{drag=false;k.classList.remove('drag');};
  k.addEventListener('mousedown',ev=>{ev.stopPropagation();s(ev.clientY);});
  window.addEventListener('mousemove',ev=>m(ev.clientY));
  window.addEventListener('mouseup',e);
  k.addEventListener('touchstart',ev=>{ev.stopPropagation();s(ev.touches[0].clientY);},{passive:false});
  window.addEventListener('touchmove',ev=>{if(drag){ev.preventDefault();m(ev.touches[0].clientY);}},{passive:false});
  window.addEventListener('touchend',e);
}
mkKnob('kc','nc',()=>chaos,v=>chaos=v);
mkKnob('ke','ne',()=>entropy,v=>entropy=v);

/* ═══════════════════════════════════════════════
   THREE.JS
═══════════════════════════════════════════════ */
async function initThree(){
  const video=document.getElementById('video');
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:"user"}});
    video.srcObject=s;await video.play();
  }catch(e){console.error('cam fail',e);}

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
  camera.position.z=110;
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  document.getElementById('container').appendChild(renderer.domElement);
  videoTex=new THREE.VideoTexture(video);

  shaderMat=new THREE.ShaderMaterial({
    uniforms:{
      tDiffuse:{value:videoTex},phasePair:{value:1},subMode:{value:0},
      time:{value:0},chaos:{value:.5},transition:{value:1.0}
    },
    vertexShader:`
      varying vec2 vUv;uniform float time,chaos;
      void main(){
        vUv=uv;vec3 pos=position;
        float wave=sin(time*(1.1+chaos*1.5)+(pos.x*.06+pos.y*.06))*(chaos*20.0);
        pos.z+=wave;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.0);
      }`,
    fragmentShader:`
      uniform sampler2D tDiffuse;uniform int subMode;
      uniform float time,chaos,transition;varying vec2 vUv;
      void main(){
        vec2 uv=vUv;
        if(chaos>.1){float d=distance(uv,vec2(.5));uv.x+=sin(d*12.-time*1.5)*.025*chaos;uv.y+=cos(d*12.-time*1.5)*.025*chaos;}
        if(subMode==3)uv.x=abs(uv.x-.5)+.25;
        if(subMode==4){float sz=60.-(chaos*50.);uv=floor(uv*sz)/sz;}
        vec4 fc;
        if(subMode==5){float sh=.03*chaos;fc=vec4(texture2D(tDiffuse,uv+vec2(sh,0)).r,texture2D(tDiffuse,uv).g,texture2D(tDiffuse,uv-vec2(sh,0)).b,1.);}
        else fc=texture2D(tDiffuse,uv);
        float luma=dot(fc.rgb,vec3(.299,.587,.114));
        if(subMode==0){vec3 c=mix(vec3(.05),vec3(.7,.85,1.),luma);if(luma>.55)c=mix(c,vec3(1.),(luma-.55)*2.5);fc=vec4(c,1.);}
        else if(subMode==1){fc=vec4(vec3(fwidth(luma)*(18.+chaos*25.)),1.);}
        else if(subMode==2){fc.rgb=vec3(1.)-fc.rgb;fc.rgb*=vec3(.9,.95,1.);}
        gl_FragColor=fc*transition;
      }`,
    transparent:true
  });

  mesh=new THREE.Mesh(new THREE.PlaneBufferGeometry(235,175,64,64),shaderMat);
  scene.add(mesh);

  particles=new THREE.Group();
  const cols=15,rows=12,pw=230/cols,ph=170/rows;
  const geos=[
    new THREE.TorusKnotBufferGeometry(pw/3.6,.1,32,8),
    new THREE.OctahedronBufferGeometry(pw/2.1,1),
    new THREE.CylinderBufferGeometry(pw/4.5,pw/4.5,ph*.8,8,1),
    new THREE.SphereBufferGeometry(pw/2.2,16,12),
  ];
  const scales=[1.8,1.3,1.0,.5];
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    const p=new THREE.Mesh(geos[Math.floor(Math.random()*geos.length)],shaderMat);
    const sc=scales[Math.floor(Math.random()*scales.length)];
    p.scale.set(sc,sc,sc);
    p.position.set(i*pw-115+pw/2,j*ph-85+ph/2,(Math.random()-.5)*20);
    p.userData={origin:p.position.clone(),v:new THREE.Vector3(),noise:Math.random()*100};
    particles.add(p);
  }
  scene.add(particles);
  liquidWeb=new THREE.LineSegments(new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({color:0x444444,transparent:true,opacity:.08}));
  scene.add(liquidWeb);

  // Warmup: run base scene for 5s, then first AI gen
  addLog('> BASE SCENE INITIALIZED');
  addLog('> WARMING UP…');
  TERM_EL.classList.add('show');
  setTimeout(()=>generateAI(),5000);

  animate();
}

/* ═══════════════════════════════════════════════
   MOTION TRACKING
═══════════════════════════════════════════════ */
const elCur=document.getElementById('cur'),elCrt=document.getElementById('crt');
let tf=0;
function trackMotion(){
  tf++;if(tf%8!==0||vs.interacting)return;
  const v=document.getElementById('video'),c=document.getElementById('mc');
  if(!v||v.readyState<2)return;
  const ctx=c.getContext('2d');
  ctx.drawImage(v,0,0,c.width,c.height);
  const cur=ctx.getImageData(0,0,c.width,c.height);
  if(prevFrame){
    let tx=0,ty=0,cnt=0;
    for(let i=0;i<cur.data.length;i+=4){
      const d=(Math.abs(cur.data[i]-prevFrame.data[i])+Math.abs(cur.data[i+1]-prevFrame.data[i+1])+Math.abs(cur.data[i+2]-prevFrame.data[i+2]))/3;
      if(d>26){const idx=i/4;tx+=idx%c.width;ty+=Math.floor(idx/c.width);cnt++;}
    }
    if(cnt>25){
      let nx=1-(tx/cnt/c.width);
      nx=Math.max(0,Math.min(1,(nx-.05)/.9));
      vs.tx=nx*innerWidth;vs.ty=(ty/cnt/c.height)*innerHeight;
      elCur.classList.add('on');
    }else elCur.classList.remove('on');
  }
  if(!prevFrame)prevFrame=new ImageData(cur.width,cur.height);
  prevFrame.data.set(cur.data);
}

/* ═══════════════════════════════════════════════
   MAIN LOOP
═══════════════════════════════════════════════ */
function animate(){
  requestAnimationFrame(animate);
  const t=Date.now()*.001;
  if(!shaderMat)return;

  shaderMat.uniforms.time.value=t;
  shaderMat.uniforms.chaos.value=chaos;
  vs.trans+=(vs.tTrans-vs.trans)*.12;
  shaderMat.uniforms.transition.value=vs.trans;

  // ← AI canvas render every frame
  if(aiState.phase!=='idle') renderAICanvas();

  trackMotion();
  elCrt.style.opacity=(0.7+Math.sin(t*50)*.02*entropy).toString();
  vs.cx+=(vs.tx-vs.cx)*.22;vs.cy+=(vs.ty-vs.cy)*.22;
  elCur.style.left=vs.cx+'px';elCur.style.top=vs.cy+'px';

  const ct=8000/(.35+entropy*1.8);
  if(Date.now()-vs.lastSwitch>ct){
    vs.tTrans=.1;
    setTimeout(()=>{
      vs.modeCount=(vs.modeCount+1)%6;vs.subMode=vs.modeCount;
      vs.phase=Math.floor(Math.random()*3)+1;
      shaderMat.uniforms.subMode.value=vs.subMode;
      shaderMat.uniforms.phasePair.value=vs.phase;
      mesh.visible=(vs.phase===1||vs.phase===3);
      particles.visible=(vs.phase===2||vs.phase===3);
      vs.tTrans=1.0;
    },400);
    vs.lastSwitch=Date.now();
  }

  const wm=new THREE.Vector3(((vs.cx/innerWidth)*2-1)*115,-((vs.cy/innerHeight)*2-1)*85,10);
  if(mesh.visible){
    const arr=mesh.geometry.attributes.position.array;
    for(let i=0;i<arr.length;i+=3){
      const dist=Math.sqrt((arr[i]-wm.x)**2+(arr[i+1]-wm.y)**2);
      const j=(Math.random()-.5)*entropy*2;
      let z=Math.sin(t*1.2+(arr[i]+arr[i+1])*.04)*(4.5+chaos*8)+j;
      if(dist<100)z+=(100-dist)*(.6+chaos*1.8);
      arr[i+2]=z;
    }
    mesh.geometry.attributes.position.needsUpdate=true;
  }
  if(particles.visible){
    const pts=[];
    particles.children.forEach(p=>{
      const ud=p.userData,tg=ud.origin.clone();
      tg.x+=Math.sin(t*(.35+chaos*1.3)+ud.noise)*(42*chaos);
      tg.y+=Math.cos(t*.85*(.35+chaos*1.3)+ud.noise)*(42*chaos);
      const dist=p.position.distanceTo(wm);
      if(dist<88){
        ud.v.add(new THREE.Vector3().subVectors(p.position,wm).normalize().multiplyScalar((1-dist/88)*(3.5+chaos*9)));
        if(Math.random()>.85)pts.push(p.position.x,p.position.y,p.position.z,wm.x,wm.y,wm.z);
      }
      ud.v.add(new THREE.Vector3().subVectors(tg,p.position).multiplyScalar(.025));
      ud.v.multiplyScalar(.86-chaos*.12);
      p.position.add(ud.v);p.rotation.x+=ud.v.length()*.07;
    });
    liquidWeb.geometry.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
    liquidWeb.geometry.attributes.position.needsUpdate=true;
  }
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  if(camera&&renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
});
function onT(x,y){vs.interacting=true;vs.tx=x;vs.ty=y;}
const cont=document.getElementById('container');
cont.addEventListener('mousedown',e=>onT(e.clientX,e.clientY));
cont.addEventListener('mousemove',e=>{if(e.buttons>0)onT(e.clientX,e.clientY);});
cont.addEventListener('mouseup',()=>vs.interacting=false);
cont.addEventListener('touchstart',e=>onT(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
cont.addEventListener('touchmove', e=>onT(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
cont.addEventListener('touchend',()=>vs.interacting=false);

initThree();
</script>
