<script>
/* ─── State ─────────────────────────────────────────────── */
let chaos = 0.5, entropy = 0.4;
let eegActive = false;
let scene, camera, renderer, shaderMat, mesh, particles, liquidWeb, videoTexture;
let prevFrame = null;

const viewState = {
  targetX: window.innerWidth/2, targetY: window.innerHeight/2,
  currentX: window.innerWidth/2, currentY: window.innerHeight/2,
  lastSwitch: Date.now(), transition: 1, targetTransition: 1,
  isInteracting: false, subMode: 0, modeCounter: 0, phasePair: 1,
};

const aiSt = {
  generating: false,
  texture: null,
  blendTarget: 0.0,
  blendNow: 0.0,
  blendMode: 0,
  lastGen: 0,
  fadeOutTimer: null,
};

/* ─── Prompt builder ─────────────────────────────────────── */
const PROMPT_POOL = [
  // 0 cyan / biometric
  ["biometric scan art face, cyan phosphorescent neural mapping, machine vision portrait, dark background, glowing contour lines",
   "AI perceiving human presence, data portrait, face dissolved in cyan light streams, cybernetic surveillance art"],
  // 1 edge / wireframe
  ["wireframe human portrait, pure white edge lines on black void, algorithmic face detection, circuit topology of identity",
   "canny edge detection portrait, tech art, digital archaeology of a face, structural lines only"],
  // 2 invert / negative
  ["photographic negative portrait, X-ray vision art, inverted identity, liminal self, dark room ghost image",
   "AI seeing inverse of reality, solarized portrait, negative exposure face, spectral presence"],
  // 3 mirror / symmetry
  ["bilateral symmetry portrait, sacred geometry face, Rorschach identity, mirror reflection art, perfect bilateral face",
   "observer observing observer, fractal symmetry portrait, mandala face, infinite recursion self"],
  // 4 pixel / mosaic
  ["mosaic pixelated face, low resolution surveillance portrait, identity censored by pixels, 8bit face reconstruction",
   "AI assembling human from fragments, pixel mosaic portrait, digital impressionism face, 16x16 grid portrait"],
  // 5 chromatic aberration
  ["chromatic aberration portrait, RGB channel split face, prism eye seeing a human, vaporwave glitch art",
   "machine perceiving color fringe, spectrum split portrait, optical error revealing soul, glitch identity"],
];

function buildPrompt() {
  const pool = PROMPT_POOL[viewState.subMode] || PROMPT_POOL[0];
  const base = pool[Math.floor(Math.random() * pool.length)];
  const cWord = chaos > 0.7 ? 'extreme distortion noise fragmented, ' : chaos > 0.4 ? 'subtle displacement organic, ' : 'crystalline precise calm, ';
  const eWord = entropy > 0.7 ? 'high entropy dissolution chaotic, ' : entropy > 0.4 ? 'flowing entropic organic, ' : 'structured ordered minimal, ';
  return `${cWord}${eWord}${base}, cinematic dark, fine art photography, 8k, masterpiece, no text`;
}

function pollinationsURL(prompt) {
  const seed = Math.floor(Math.random() * 99999);
  return `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true&seed=${seed}&model=flux`;
}

/* ─── Generate AI image ──────────────────────────────────── */
async function generateAI() {
  if (aiSt.generating || !shaderMat) return;
  aiSt.generating = true;
  aiSt.lastGen = Date.now();

  const btnAI    = document.getElementById('btn-ai');
  const dot      = document.getElementById('ai-dot');
  const statusEl = document.getElementById('ai-status');
  const promptEl = document.getElementById('ai-prompt-line');
  const thumbW   = document.getElementById('ai-thumb-wrap');
  const thumbImg = document.getElementById('ai-thumb');

  // Clear any pending fade-out
  if (aiSt.fadeOutTimer) { clearTimeout(aiSt.fadeOutTimer); aiSt.fadeOutTimer = null; }

  btnAI.classList.add('active-amber');
  dot.className = 'thinking';
  statusEl.textContent = 'AI_GAZE :: 生成中…';

  const prompt = buildPrompt();
  promptEl.textContent = prompt.length > 70 ? prompt.substring(0,70)+'…' : prompt;
  promptEl.classList.add('show');

  const url = pollinationsURL(prompt);

  try {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = rej;
      img.src = url;
      setTimeout(() => rej(new Error('timeout')), 28000);
    });

    // Thumbnail
    thumbImg.src = img.src;
    thumbW.classList.add('show');

    // Three.js texture
    const tex = new THREE.Texture(img);
    tex.needsUpdate = true;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

    if (aiSt.texture) aiSt.texture.dispose();
    aiSt.texture = tex;

    shaderMat.uniforms.tAI.value        = tex;
    shaderMat.uniforms.aiReady.value    = 1.0;
    shaderMat.uniforms.aiBlendMode.value = viewState.subMode % 4;

    aiSt.blendTarget = 0.32 + chaos * 0.30;

    btnAI.classList.remove('active-amber');
    btnAI.classList.add('active-white');
    dot.className = 'ready';
    statusEl.textContent = `AI_GAZE :: 融入 [BLEND:${(aiSt.blendTarget*100).toFixed(0)}%]`;

    // Fade out after 22s
    aiSt.fadeOutTimer = setTimeout(() => {
      aiSt.blendTarget = 0.0;
      btnAI.classList.remove('active-white');
      dot.className = '';
      statusEl.textContent = 'AI_GAZE :: 待機';
      promptEl.classList.remove('show');
      setTimeout(() => { thumbW.classList.remove('show'); }, 1200);
    }, 22000);

  } catch(e) {
    console.warn('Pollinations fail:', e);
    btnAI.classList.remove('active-amber');
    dot.className = '';
    statusEl.textContent = 'AI_GAZE :: 連線失敗';
    setTimeout(()=>{ statusEl.textContent='AI_GAZE :: 待機'; promptEl.classList.remove('show'); }, 3000);
  }
  aiSt.generating = false;
}

try {

/* ─── EEG ────────────────────────────────────────────────── */
const MUSE_SERVICE='0xfe8d', MUSE_CONTROL='273e0001-4c4d-454d-96be-f03bac821358';
const MUSE_EEG='273e0004-4c4d-454d-96be-f03bac821358';
let museGatt=null, eegBuf=[];

function fft(re,im){
  const n=re.length; if(n<=1)return;
  const h=n>>1, reE=[],reO=[],imE=[],imO=[];
  for(let i=0;i<h;i++){reE[i]=re[i*2];imE[i]=im[i*2];reO[i]=re[i*2+1];imO[i]=im[i*2+1];}
  fft(reE,imE);fft(reO,imO);
  for(let k=0;k<h;k++){
    const a=-2*Math.PI*k/n,c=Math.cos(a),s=Math.sin(a);
    const tr=c*reO[k]-s*imO[k],ti=s*reO[k]+c*imO[k];
    re[k]=reE[k]+tr;im[k]=imE[k]+ti;re[k+h]=reE[k]-tr;im[k+h]=imE[k]-ti;
  }
}
function processEEG(value){
  const data=new DataView(value.buffer),decoded=[];
  for(let i=2;i<data.byteLength-2;i+=3){
    decoded.push(((data.getUint8(i)<<4)|(data.getUint8(i+1)>>4))-2048);
    decoded.push((((data.getUint8(i+1)&0x0F)<<8)|data.getUint8(i+2))-2048);
  }
  eegBuf.push(...decoded);
  if(eegBuf.length>256){
    const sig=eegBuf.slice(-256),re=[...sig],im=new Array(256).fill(0);
    fft(re,im);
    let aP=0,bP=0;
    const b=hz=>Math.round(hz*256/256);
    for(let i=b(8);i<b(13);i++)aP+=re[i]*re[i]+im[i]*im[i];
    for(let i=b(13);i<b(30);i++)bP+=re[i]*re[i]+im[i]*im[i];
    const tot=aP+bP+1e-6,alpha=aP/tot,beta=bP/tot;
    entropy=0.1+alpha*0.9; chaos=0.1+beta*0.9;
    updateNeedle('needle-entropy',entropy); updateNeedle('needle-chaos',chaos);
    document.getElementById('eeg-hud').innerHTML=
      '<div style="color:#4ade80;margin-bottom:2px;">&#x2B24; MUSE LIVE</div>'+
      '<div>&#945;_RELAX: '+(alpha*100).toFixed(0)+'%</div>'+
      '<div>&#946;_FOCUS : '+(beta*100).toFixed(0)+'%</div>';
    eegBuf=eegBuf.slice(-256);
  }
}
document.getElementById('btn-eeg').addEventListener('click',async()=>{
  const cw=document.getElementById('wrap-chaos'),ew=document.getElementById('wrap-entropy');
  if(eegActive){
    if(museGatt)museGatt.disconnect();
    eegActive=false;document.getElementById('btn-eeg').classList.remove('active-green');
    document.getElementById('eeg-hud').textContent='— 未連線';
    cw.classList.remove('locked');ew.classList.remove('locked');return;
  }
  try{
    const device=await navigator.bluetooth.requestDevice({filters:[{services:[MUSE_SERVICE]}],optionalServices:[MUSE_SERVICE]});
    museGatt=await device.gatt.connect();
    const svc=await museGatt.getPrimaryService(MUSE_SERVICE);
    const char=await svc.getCharacteristic(MUSE_EEG);
    await char.startNotifications();
    char.addEventListener('characteristicvaluechanged',e=>processEEG(e.target.value));
    const ctrl=await svc.getCharacteristic(MUSE_CONTROL);
    const enc=new TextEncoder();
    await ctrl.writeValue(enc.encode('v1\n'));await ctrl.writeValue(enc.encode('p21\n'));await ctrl.writeValue(enc.encode('d\n'));
    eegActive=true;document.getElementById('btn-eeg').classList.add('active-green');
    cw.classList.add('locked');ew.classList.add('locked');
    device.addEventListener('gattserverdisconnected',()=>{
      eegActive=false;document.getElementById('btn-eeg').classList.remove('active-green');
      cw.classList.remove('locked');ew.classList.remove('locked');
    });
  }catch(e){console.error('EEG fail',e);}
});

/* ─── AI button ──────────────────────────────────────────── */
document.getElementById('btn-ai').addEventListener('click', () => generateAI());

/* ─── Knobs ──────────────────────────────────────────────── */
function updateNeedle(id,val){const el=document.getElementById(id);if(el)el.style.transform='rotate('+(val*280-140)+'deg)';}
function makeKnob(kid,nid,getter,setter){
  const knob=document.getElementById(kid);let dragging=false,lastY=0;
  const start=y=>{if(eegActive)return;dragging=true;lastY=y;knob.classList.add('dragging');};
  const move=y=>{if(!dragging||eegActive)return;const nv=Math.max(0,Math.min(1,getter()+(lastY-y)*0.008));setter(nv);updateNeedle(nid,nv);lastY=y;};
  const end=()=>{dragging=false;knob.classList.remove('dragging');};
  knob.addEventListener('mousedown',e=>{e.stopPropagation();start(e.clientY);});
  window.addEventListener('mousemove',e=>move(e.clientY));
  window.addEventListener('mouseup',end);
  knob.addEventListener('touchstart',e=>{e.stopPropagation();start(e.touches[0].clientY);},{passive:false});
  window.addEventListener('touchmove',e=>{if(dragging){e.preventDefault();move(e.touches[0].clientY);}},{passive:false});
  window.addEventListener('touchend',end);
}
makeKnob('knob-chaos','needle-chaos',()=>chaos,v=>chaos=v);
makeKnob('knob-entropy','needle-entropy',()=>entropy,v=>entropy=v);

/* ─── Three.js init ──────────────────────────────────────── */
async function initThree(){
  const video=document.getElementById('video');
  try{const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:"user"}});video.srcObject=s;await video.play();}catch(e){console.error('cam fail',e);}

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,1000);
  camera.position.z=110;
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  document.getElementById('container').appendChild(renderer.domElement);

  videoTexture=new THREE.VideoTexture(video);

  // 1×1 black placeholder for tAI
  const bc=document.createElement('canvas'); bc.width=bc.height=1;
  bc.getContext('2d').fillRect(0,0,1,1);
  const blankTex=new THREE.CanvasTexture(bc);

  shaderMat=new THREE.ShaderMaterial({
    uniforms:{
      tDiffuse:{value:videoTexture},
      tAI:{value:blankTex},
      aiReady:{value:0.0},
      aiBlend:{value:0.0},
      aiBlendMode:{value:0},
      phasePair:{value:1},
      subMode:{value:0},
      time:{value:0},
      chaos:{value:0.5},
      transition:{value:1.0}
    },
    vertexShader:`
      varying vec2 vUv; uniform float time; uniform float chaos;
      void main(){
        vUv=uv; vec3 pos=position;
        float wave=sin(time*(1.1+chaos*1.5)+(pos.x*0.06+pos.y*0.06))*(chaos*20.0);
        pos.z+=wave;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(pos,1.0);
      }
    `,
    fragmentShader:`
      uniform sampler2D tDiffuse;
      uniform sampler2D tAI;
      uniform float aiReady;
      uniform float aiBlend;
      uniform int aiBlendMode;
      uniform int phasePair;
      uniform int subMode;
      uniform float time;
      uniform float chaos;
      uniform float transition;
      varying vec2 vUv;

      vec3 blendScreen(vec3 a,vec3 b)    {return 1.0-(1.0-a)*(1.0-b);}
      vec3 blendMultiply(vec3 a,vec3 b)  {return a*b*1.6;}
      vec3 blendOverlay(vec3 a,vec3 b)   {return mix(2.0*a*b,1.0-2.0*(1.0-a)*(1.0-b),step(0.5,a));}
      vec3 blendDifference(vec3 a,vec3 b){return abs(a-b);}

      void main(){
        vec2 uv=vUv;
        if(chaos>0.1){
          float d=distance(uv,vec2(0.5));
          uv.x+=sin(d*12.0-time*1.5)*0.025*chaos;
          uv.y+=cos(d*12.0-time*1.5)*0.025*chaos;
        }
        if(subMode==3) uv.x=abs(uv.x-0.5)+0.25;
        if(subMode==4){float sz=60.0-(chaos*50.0);uv=floor(uv*sz)/sz;}

        // AI texture with subtle independent drift
        vec2 aiUv=vUv;
        aiUv.x+=sin(time*0.17+vUv.y*3.14)*0.01*chaos;
        aiUv.y+=cos(time*0.13+vUv.x*3.14)*0.008*chaos;

        // Sample camera
        vec4 camCol;
        if(subMode==5){
          float sh=0.03*chaos;
          camCol=vec4(texture2D(tDiffuse,uv+vec2(sh,0.0)).r,
                      texture2D(tDiffuse,uv).g,
                      texture2D(tDiffuse,uv-vec2(sh,0.0)).b,1.0);
        } else { camCol=texture2D(tDiffuse,uv); }
        float luma=dot(camCol.rgb,vec3(0.299,0.587,0.114));

        // Color grade camera
        vec4 graded;
        if(subMode==0){
          vec3 col=mix(vec3(0.05),vec3(0.7,0.85,1.0),luma);
          if(luma>0.55) col=mix(col,vec3(1.0),(luma-0.55)*2.5);
          graded=vec4(col,1.0);
        } else if(subMode==1){
          graded=vec4(vec3(fwidth(luma)*(18.0+chaos*25.0)),1.0);
        } else if(subMode==2){
          graded=vec4((1.0-camCol.rgb)*vec3(0.9,0.95,1.0),1.0);
        } else { graded=camCol; }

        // Sample AI
        vec4 aiCol=texture2D(tAI,aiUv);

        // Blend AI into camera using luminance weighting
        vec3 final=graded.rgb;
        if(aiReady>0.5 && aiBlend>0.001){
          float w=(1.0-luma*0.45)*aiBlend;
          vec3 m;
          if(aiBlendMode==0)      m=blendScreen(graded.rgb,aiCol.rgb);
          else if(aiBlendMode==1) m=blendMultiply(graded.rgb,aiCol.rgb);
          else if(aiBlendMode==2) m=blendOverlay(graded.rgb,aiCol.rgb);
          else                    m=blendDifference(graded.rgb,aiCol.rgb);
          final=mix(graded.rgb,m,w);
        }
        gl_FragColor=vec4(final,1.0)*transition;
      }
    `,
    transparent:true
  });

  mesh=new THREE.Mesh(new THREE.PlaneBufferGeometry(235,175,64,64),shaderMat);
  scene.add(mesh);

  particles=new THREE.Group();
  const cols=15,rows=12,pw=230/cols,ph=170/rows;
  const geos=[
    new THREE.TorusKnotBufferGeometry(pw/3.6,0.1,32,8),
    new THREE.OctahedronBufferGeometry(pw/2.1,1),
    new THREE.CylinderBufferGeometry(pw/4.5,pw/4.5,ph*0.8,8,1),
    new THREE.SphereBufferGeometry(pw/2.2,16,12),
  ];
  const sizeScales=[1.8,1.3,1.0,0.5];
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    const geo=geos[Math.floor(Math.random()*geos.length)];
    const p=new THREE.Mesh(geo,shaderMat);
    const sc=sizeScales[Math.floor(Math.random()*sizeScales.length)];
    p.scale.set(sc,sc,sc);
    p.position.set(i*pw-115+pw/2,j*ph-85+ph/2,(Math.random()-.5)*20);
    p.userData={origin:p.position.clone(),v:new THREE.Vector3(),noise:Math.random()*100};
    particles.add(p);
  }
  scene.add(particles);

  liquidWeb=new THREE.LineSegments(
    new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({color:0x444444,transparent:true,opacity:0.08})
  );
  scene.add(liquidWeb);

  // First AI gen after 2s
  setTimeout(()=>generateAI(),2000);
  animate();
}

/* ─── Motion tracking ────────────────────────────────────── */
const elCursor=document.getElementById('cursor-el');
const elCrt=document.getElementById('crt-overlay');
let trackFrame=0;
function updateTracking(){
  trackFrame++;
  if(trackFrame%8!==0||viewState.isInteracting) return;
  const video=document.getElementById('video'),canvas=document.getElementById('motion-canvas');
  if(!video||video.readyState<2) return;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const curr=ctx.getImageData(0,0,canvas.width,canvas.height);
  if(prevFrame){
    let tx=0,ty=0,count=0;
    for(let i=0;i<curr.data.length;i+=4){
      const diff=(Math.abs(curr.data[i]-prevFrame.data[i])+Math.abs(curr.data[i+1]-prevFrame.data[i+1])+Math.abs(curr.data[i+2]-prevFrame.data[i+2]))/3;
      if(diff>26){const idx=i/4;tx+=idx%canvas.width;ty+=Math.floor(idx/canvas.width);count++;}
    }
    if(count>25){
      let nx=1.0-(tx/count/canvas.width);
      nx=Math.max(0,Math.min(1,(nx-0.05)/0.9));
      viewState.targetX=nx*window.innerWidth;
      viewState.targetY=(ty/count/canvas.height)*window.innerHeight;
      elCursor.classList.add('detecting');
    } else { elCursor.classList.remove('detecting'); }
  }
  if(!prevFrame) prevFrame=new ImageData(curr.width,curr.height);
  prevFrame.data.set(curr.data);
}

/* ─── Main loop ──────────────────────────────────────────── */
function animate(){
  requestAnimationFrame(animate);
  const time=Date.now()*0.001;
  if(!shaderMat) return;

  shaderMat.uniforms.time.value=time;
  shaderMat.uniforms.chaos.value=chaos;
  viewState.transition+=(viewState.targetTransition-viewState.transition)*0.12;
  shaderMat.uniforms.transition.value=viewState.transition;

  // Smooth AI blend
  aiSt.blendNow+=(aiSt.blendTarget-aiSt.blendNow)*0.022;
  shaderMat.uniforms.aiBlend.value=aiSt.blendNow;
  const bar=document.getElementById('ai-bar');
  if(bar) bar.style.width=(aiSt.blendNow*100).toFixed(1)+'%';

  updateTracking();
  if(elCrt) elCrt.style.opacity=(0.7+Math.sin(time*50)*0.02*entropy).toString();

  viewState.currentX+=(viewState.targetX-viewState.currentX)*0.22;
  viewState.currentY+=(viewState.targetY-viewState.currentY)*0.22;
  elCursor.style.left=viewState.currentX+'px';
  elCursor.style.top=viewState.currentY+'px';

  const cycleTime=8000/(0.35+entropy*1.8);
  if(Date.now()-viewState.lastSwitch>cycleTime){
    viewState.targetTransition=0.1;
    setTimeout(()=>{
      viewState.modeCounter=(viewState.modeCounter+1)%6;
      viewState.subMode=viewState.modeCounter;
      viewState.phasePair=Math.floor(Math.random()*3)+1;
      shaderMat.uniforms.subMode.value=viewState.subMode;
      shaderMat.uniforms.phasePair.value=viewState.phasePair;
      mesh.visible=(viewState.phasePair===1||viewState.phasePair===3);
      particles.visible=(viewState.phasePair===2||viewState.phasePair===3);
      viewState.targetTransition=1.0;
      // auto AI gen on mode switch, throttled by entropy speed
      const interval=Math.max(14000,24000-entropy*13000);
      if(Date.now()-aiSt.lastGen>interval) generateAI();
    },400);
    viewState.lastSwitch=Date.now();
  }

  const wm=new THREE.Vector3(
    ((viewState.currentX/window.innerWidth)*2-1)*115,
    -((viewState.currentY/window.innerHeight)*2-1)*85,10
  );

  if(mesh.visible){
    const arr=mesh.geometry.attributes.position.array;
    for(let i=0;i<arr.length;i+=3){
      const dist=Math.sqrt((arr[i]-wm.x)**2+(arr[i+1]-wm.y)**2);
      const jitter=(Math.random()-.5)*entropy*2.0;
      let z=Math.sin(time*1.2+(arr[i]+arr[i+1])*0.04)*(4.5+chaos*8.0)+jitter;
      if(dist<100) z+=(100-dist)*(0.6+chaos*1.8);
      arr[i+2]=z;
    }
    mesh.geometry.attributes.position.needsUpdate=true;
  }

  if(particles.visible){
    const pts=[];
    particles.children.forEach(p=>{
      const ud=p.userData;
      let target=ud.origin.clone();
      target.x+=Math.sin(time*(0.35+chaos*1.3)+ud.noise)*(42*chaos);
      target.y+=Math.cos(time*0.85*(0.35+chaos*1.3)+ud.noise)*(42*chaos);
      const dist=p.position.distanceTo(wm);
      if(dist<88){
        ud.v.add(new THREE.Vector3().subVectors(p.position,wm).normalize().multiplyScalar((1-dist/88)*(3.5+chaos*9.0)));
        if(Math.random()>0.85) pts.push(p.position.x,p.position.y,p.position.z,wm.x,wm.y,wm.z);
      }
      ud.v.add(new THREE.Vector3().subVectors(target,p.position).multiplyScalar(0.025));
      ud.v.multiplyScalar(0.86-chaos*0.12);
      p.position.add(ud.v);
      p.rotation.x+=ud.v.length()*0.07;
    });
    liquidWeb.geometry.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
    liquidWeb.geometry.attributes.position.needsUpdate=true;
  }
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  if(camera&&renderer){
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  }
});

function onInteract(cx,cy){viewState.isInteracting=true;viewState.targetX=cx;viewState.targetY=cy;}
const container=document.getElementById('container');
container.addEventListener('mousedown',e=>onInteract(e.clientX,e.clientY));
container.addEventListener('mousemove',e=>{if(e.buttons>0)onInteract(e.clientX,e.clientY);});
container.addEventListener('mouseup',()=>viewState.isInteracting=false);
container.addEventListener('touchstart',e=>onInteract(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
container.addEventListener('touchmove',e=>onInteract(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
container.addEventListener('touchend',()=>viewState.isInteracting=false);

initThree();
</script>
