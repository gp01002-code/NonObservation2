  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#000;overflow:hidden;font-family:'Share Tech Mono',monospace;color:#fff;user-select:none;touch-action:none;}

    /* CRT 層 */
    #crt{pointer-events:none;position:fixed;inset:0;z-index:600;
         background:linear-gradient(rgba(18,16,16,0) 50%,rgba(255,255,255,.01) 50%),
                    linear-gradient(90deg,rgba(255,255,255,.005),rgba(255,255,255,.005));
         background-size:100% 3px,3px 100%;opacity:.8;}

    /* 感應游標 */
    #cur{position:fixed;width:48px;height:48px;border:1px solid rgba(255,255,255,.5);border-radius:50%;
         z-index:700;pointer-events:none;transform:translate(-50%,-50%);
         mix-blend-mode:screen;transition:width .3s,height .3s,border-color .3s;}
    #cur.on{width:65px;height:65px;border-width:2px;border-color:#fff;box-shadow:0 0 20px rgba(255,255,255,.4);}

    /* 電視雜訊層 */
    #noise-cv{position:fixed;inset:0;z-index:45;width:100%;height:100%;pointer-events:none;opacity:0;}

    /* AI 結果圖 */
    #ai-img{
      position:fixed;inset:0;z-index:36;
      width:100%;height:100%;object-fit:cover;
      opacity:0;pointer-events:none;
      filter:saturate(0.12) contrast(1.5) brightness(0.55);
      transition: opacity 1s ease;
    }

    /* ══════════════════════════════════════════════
       左側面板 - 全白色系
    ══════════════════════════════════════════════ */
    #sidebar{
      position:fixed;left:0;top:0;bottom:0;z-index:800;
      display:flex;align-items:stretch;pointer-events:auto;
    }
    #sidebar-panel{
      width:0;overflow:hidden;
      background:rgba(0,0,0,.95);
      border-right:1px solid rgba(255,255,255,.1);

    }
    #sidebar.open #sidebar-panel{width:240px;}

    #sidebar-header{
      padding:20px 16px 12px; font-size:8px; letter-spacing:.4em; color:rgba(255,255,255,.4);

    /* 側欄大圖縮圖 */
    .rec-ai-img{
      width:100%; aspect-ratio:1; object-fit:cover; display:block;
      border:1px solid rgba(255,255,255,.15); filter:saturate(.6) contrast(1.1);
      margin-bottom:8px; transition:filter .3s;
    }
    .rec:hover .rec-ai-img{filter:saturate(1) contrast(1.1);}

    .rec-thumbs{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
    .rec-thumb{width:50px; height:38px; object-fit:cover; border:1px solid rgba(255,255,255,.1); filter:grayscale(1) opacity(0.5);}
    .rec-arrow{font-size:9px; color:rgba(255,255,255,.2);}
    .rec-meta{font-size:7px; color:rgba(255,255,255,.2); letter-spacing:.1em;}

    /* 監控日誌區 */
    #dbg-section{flex-shrink:0; border-top:1px solid rgba(255,255,255,.1); background:rgba(0,0,0,0.5);}
    #dbg-toggle{padding:10px 14px; font-size:7px; letter-spacing:.2em; color:rgba(255,255,255,.3); cursor:pointer; display:flex; align-items:center; gap:8px;}
    #dbg-inner{max-height:120px; overflow-y:auto; transition:max-height .3s;}
    #dbg-inner.closed{max-height:0;}
    #dbg{padding:8px 14px; font-size:8px; line-height:1.6; color:rgba(255,255,255,.4); font-family:monospace;}

    #sidebar-toggle{
      width:22px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:rgba(0,0,0,.8); border-right:1px solid rgba(255,255,255,.08); cursor:pointer; gap:6px;
    }
    .tdot{width:3px; height:3px; border-radius:50%; background:rgba(255,255,255,.3);}
    #sidebar.open .tdot{background:#fff;}
    #toggle-lbl{font-size:8px; letter-spacing:.2em; color:rgba(255,255,255,.3); writing-mode:vertical-rl; transform:rotate(180deg);}

    /* 操作面板 */
    #controls{position:absolute;right:40px;bottom:40px;display:flex;flex-direction:column;align-items:flex-end;gap:30px;z-index:850;pointer-events:auto;}
    .kw{display:flex;flex-direction:column;align-items:center;gap:12px;transition:opacity .5s;}
    .kw.locked{opacity:.25;pointer-events:none;}
    .kl{font-size:9px;color:rgba(255,255,255,.25);letter-spacing:.15em;text-transform:uppercase;}
    .knob{
      width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
      display:flex;align-items:center;justify-content:center;position:relative;
      background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 70%);
      cursor:ns-resize; transition:border-color .3s,transform .3s;
    }
    .knob.drag{border-color:#fff; transform:scale(1.08);}
    .needle{position:absolute;width:2px;height:42%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.5);
            transform-origin:bottom center;bottom:50%;left:calc(50% - 1px);pointer-events:none;}
    
    .ibtn{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.18);cursor:pointer;transition:all .5s;}
    .ibtn.on {background:#fff;box-shadow:0 0 16px rgba(255,255,255,.9);border-color:transparent;}
    .ibtn.pulse{background:rgba(255,255,255,.6);border-color:transparent;animation:pw .7s infinite;}
    @keyframes pw{0%,100%{opacity:1}50%{opacity:.1}}

    #eeg-hud{position:absolute;left:32px;bottom:150px;z-index:500;font-size:10px;line-height:1.8;color:rgba(255,255,255,.2);pointer-events:none;}
    #uid-tag{position:absolute;top:18px;right:32px;font-size:9px;color:rgba(255,255,255,.35);letter-spacing:.2em;display:none;z-index:810;}
  </style>

<div id="crt"></div>

<canvas id="noise-cv"></canvas>
<img id="ai-img" src="" alt=""/>

<div id="sidebar">
  <div id="sidebar-panel">
    <div id="sidebar-header">OBSERVATION_LOG</div>
    <div id="sidebar-scroll"></div>
    <div id="dbg-section">
      <div id="dbg-toggle" onclick="toggleDbg()"><span>▲</span> SYSTEM_LOG</div>
      <div id="dbg-inner"><div id="dbg">IDLE...</div></div>
    </div>
  </div>
  <div id="sidebar-toggle" onclick="toggleSidebar()">
    <div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>

</div>

<div id="controls">
  <div style="display:flex;gap:24px;margin-bottom:8px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
      <span style="font-size:7px;color:rgba(255,255,255,.2);letter-spacing:.25em;">驗證</span>

    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">

<script>
/* ── 核心狀態 ── */
let chaos=.5, entropy=.4, eegActive=false, generating=false;
let scene, camera, renderer, shaderMat, mesh, particles, liquidWeb, videoTex, prevFrame=null;
let sidebarOpen=false, dbgOpen=true;
let historyRecords = [];
const vs={ tx:innerWidth/2, ty:innerHeight/2, cx:innerWidth/2, cy:innerHeight/2, lastSwitch:Date.now(), trans:1, tTrans:1, subMode:0, modeCount:0, interacting:false };

function dbg(m, c="#fff"){
  const el = document.getElementById('dbg');
  const d = document.createElement('div'); d.style.color=c;
  d.textContent = new Date().toLocaleTimeString() + " " + m;
  el.appendChild(d); el.scrollTop = el.scrollHeight;
  if(el.children.length > 15) el.removeChild(el.firstChild);
}

function toggleSidebar(){ sidebarOpen=!sidebarOpen; document.getElementById('sidebar').classList.toggle('open',sidebarOpen); }
function toggleDbg(){ dbgOpen=!dbgOpen; document.getElementById('dbg-inner').classList.toggle('closed',!dbgOpen); }

/* ── 歷史紀錄渲染 ── */
function addRecord(s1, s2, mode, c, e){
  const now = new Date();
  const ts = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
  historyRecords.unshift({ t:ts, s1, s2, mode, c, e });
  if(historyRecords.length > 15) historyRecords.pop();
  renderHistory();
}

function renderHistory(){
  const list = document.getElementById('sidebar-scroll');
  list.innerHTML = '';
  historyRecords.forEach(rec => {
    const div = document.createElement('div');
    div.className = 'rec';
    div.innerHTML = `
      <div class="rec-time">${rec.t} · ${MODE_NAMES[rec.mode] || 'ANALYSIS'}</div>
      <img class="rec-ai-img" src="${rec.s2}" />
      <div class="rec-thumbs">
        <img class="rec-thumb" src="${rec.s1}" />
        <span class="rec-arrow">› AI_RESULT</span>
      </div>
      <div class="rec-meta">C ${rec.c.toFixed(2)} · E ${rec.e.toFixed(2)}</div>
    `;
    div.onclick = () => {
      const el = document.getElementById('ai-img');
      el.style.opacity = '0';
      setTimeout(() => { el.src = rec.s2; el.style.opacity = '0.9'; }, 300);
    };
    list.appendChild(div);
  });
}

/* ── 電視雜訊 ── */
const noiseCv = document.getElementById('noise-cv'), noiseCtx = noiseCv.getContext('2d');
let noisePhase = 'off', noiseBuildStart = 0;
function resizeNoise(){ noiseCv.width=innerWidth; noiseCv.height=innerHeight; }
window.addEventListener('resize', resizeNoise); resizeNoise();

function drawNoise(){
  if(noisePhase==='off') return;
  const w=noiseCv.width, h=noiseCv.height;
  noiseCtx.clearRect(0,0,w,h);
  if(noisePhase==='loading'){
    for(let i=0; i<30; i++){ noiseCtx.fillStyle = `rgba(255,255,255,${Math.random()*0.15})`; noiseCtx.fillRect(0, Math.random()*h, w, 1); }
    noiseCv.style.opacity = '0.7';
  } else if(noisePhase==='fading'){
    const p = Math.max(0, 1 - (Date.now()-noiseBuildStart)/1500);
    if(p <= 0) { noisePhase = 'off'; noiseCv.style.opacity = '0'; return; }
    noiseCv.style.opacity = (p * 0.7).toString();
  }
}

/* ── AI 終極連線修復 ── */
const MODE_NAMES=['BIOMETRIC','WIREFRAME','NEGATIVE','SYMMETRY','PIXEL','CHROMA'];
const PROMPTS=[
  "biometric neural scan glowing face, digital void",
  "wireframe anatomical blueprint, white lines, tech",
  "infrared spectral ghost, inverted phantom soul",
  "divine bilateral symmetry mandala identity",
  "pixelated digital archaeology, data fragments",
  "chromatic aberration prism glitch portrait"
];

async function triggerAI(){
  if(generating) return;
  generating = true;
  document.getElementById('btn-ai').classList.add('pulse');
  dbg("INIT GENERATIVE_PROCESS", "#ff8");

  // 1. 擷取 S1
  const s1Data = renderer.domElement.toDataURL('image/jpeg', 0.5);
  noisePhase = 'loading';

  // 2. Fetch AI Blob
  const base = PROMPTS[vs.subMode] || PROMPTS[0];
  const fullPrompt = `${chaos > 0.7 ? 'distorted chaotic, ' : 'stable, '}${base}, dark style, masterpiece`;
  const seed = Math.floor(Math.random()*999999);
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(fullPrompt)}?width=768&height=768&nologo=true&seed=${seed}`;

  try {
    dbg("FETCHING FROM SERVER...", "#aaa");
    const resp = await fetch(url);
    if(!resp.ok) throw new Error("API_ERROR");
    const blob = await resp.blob();
    const objectURL = URL.createObjectURL(blob);
    
    const imgEl = document.getElementById('ai-img');
    imgEl.src = objectURL;
    await new Promise(r => imgEl.onload = r);
    
    dbg("AI IMAGE RECEIVED ✓", "#0f0");
    noisePhase = 'fading'; noiseBuildStart = Date.now();
    imgEl.style.opacity = '0.9';

    // 3. 真正寫入側欄
    addRecord(s1Data, objectURL, vs.subMode, chaos, entropy);

    setTimeout(() => {
      imgEl.style.opacity = '0';
      document.getElementById('btn-ai').classList.remove('pulse');
      generating = false;
      setTimeout(triggerAI, 20000); // 循環
    }, 15000);

  } catch(e) {
    dbg("CONNECTION FAILED: " + e.message, "#f44");
    generating = false; noisePhase = 'off';
    document.getElementById('btn-ai').classList.remove('pulse');
    setTimeout(triggerAI, 8000);
  }
}

/* ── Three.js & 物理連動 ── */
async function initEngine(){
  const video = document.getElementById('video');
  try {
    const s = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:"user"}});
    video.srcObject = s; await video.play();
  } catch(e) { dbg("CAM_FAIL", "#f44"); }

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000); camera.position.z = 110;
  renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('container').appendChild(renderer.domElement);
  
  videoTex = new THREE.VideoTexture(video);
  shaderMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: videoTex }, subMode: { value: 0 }, time: { value: 0 }, chaos: { value: 0.5 }, transition: { value: 1.0 } },
    vertexShader: `
      varying vec2 vUv; uniform float time, chaos;
      void main() {
        vUv = uv; vec3 p = position;
        p.z += sin(time * 1.1 + (p.x + p.y) * 0.06) * (4.5 + chaos * 16.0);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform int subMode;
      uniform float time, chaos, transition; varying vec2 vUv;
      void main() {
        vec2 uv = vUv;
        if(chaos > 0.1) {
          float d = distance(uv, vec2(0.5));
          uv.x += sin(d * 12.0 - time * 1.5) * 0.025 * chaos;
          uv.y += cos(d * 12.0 - time * 1.5) * 0.025 * chaos;
        }
        if(subMode == 3) uv.x = abs(uv.x - 0.5) + 0.25;
        if(subMode == 4) { float sz = 65.0 - (chaos * 50.0); uv = floor(uv * sz) / sz; }
        vec4 fc;
        if(subMode == 5) {
          float sh = 0.03 * chaos;
          fc = vec4(texture2D(tDiffuse, uv + vec2(sh, 0.0)).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv - vec2(sh, 0.0)).b, 1.0);
        } else fc = texture2D(tDiffuse, uv);
        float l = dot(fc.rgb, vec3(0.299, 0.587, 0.114));
        if(subMode == 0) fc.rgb = mix(vec3(0.05), vec3(0.7, 0.85, 1.0), l);
        else if(subMode == 1) fc = vec4(vec3(fwidth(l) * (18.0 + chaos * 25.0)), 1.0);
        else if(subMode == 2) { fc.rgb = vec3(1.0) - fc.rgb; fc.rgb *= vec3(0.9, 0.95, 1.0); }
        gl_FragColor = fc * transition;
      }
    `,
    transparent: true
  });

  mesh = new THREE.Mesh(new THREE.PlaneBufferGeometry(235, 175, 128, 128), shaderMat);
  scene.add(mesh);

  particles = new THREE.Group();
  const geos = [new THREE.TorusKnotBufferGeometry(5,0.1,32,8), new THREE.OctahedronBufferGeometry(8,1), new THREE.SphereBufferGeometry(8,16,12)];
  const scales = [1.8, 1.3, 1.0, 0.5];
  for(let i=0; i<80; i++){
    const p = new THREE.Mesh(geos[i % 3], shaderMat);
    const s = scales[Math.floor(Math.random() * scales.length)];
    p.scale.set(s,s,s);
    p.position.set((Math.random()-0.5)*220, (Math.random()-0.5)*160, (Math.random()-0.5)*20);
    p.userData = { origin:p.position.clone(), v:new THREE.Vector3(), noise:Math.random()*100 };
    particles.add(p);
  }
  scene.add(particles);

  liquidWeb = new THREE.LineSegments(new THREE.BufferGeometry(), 
    new THREE.LineBasicMaterial({color:0x444444, transparent:true, opacity:0.07}));
  scene.add(liquidWeb);

  animate();
  setTimeout(triggerAI, 6000);
}

function animate(){
  requestAnimationFrame(animate);
  const t = Date.now() * 0.001;
  if(!shaderMat) return;

  shaderMat.uniforms.time.value = t;
  shaderMat.uniforms.chaos.value = chaos;
  vs.trans += (vs.tTrans - vs.trans) * 0.12;
  shaderMat.uniforms.transition.value = vs.trans;

  if(noisePhase!=='off') drawNoise();

  // 手勢追蹤
  const v = document.getElementById('video'), c = document.getElementById('mc');
  if(v && v.readyState >= 2 && !vs.interacting){
    const ctx = c.getContext('2d');
    ctx.drawImage(v, 0, 0, c.width, c.height);
    const curr = ctx.getImageData(0, 0, c.width, c.height);
    if(prevFrame){
      let tx=0, ty=0, count=0;
      for(let i=0; i<curr.data.length; i+=4){
        const d = (Math.abs(curr.data[i]-prevFrame.data[i]) + Math.abs(curr.data[i+1]-prevFrame.data[i+1]) + Math.abs(curr.data[i+2]-prevFrame.data[i+2]))/3;
        if(d > 26){ const idx = i/4; tx += idx % c.width; ty += Math.floor(idx / canvas.width); count++; }
      }
      if(count > 25){
        let nx = 1.0 - (tx/count/c.width);
        nx = Math.max(0, Math.min(1, (nx - 0.05) / 0.9));
        vs.tx = nx * window.innerWidth; vs.ty = (ty/count/c.height) * window.innerHeight;
        document.getElementById('cur').classList.add('on');
      } else { document.getElementById('cur').classList.remove('on'); }
    }
    if(!prevFrame) prevFrame = new ImageData(c.width, c.height);
    prevFrame.data.set(curr.data);
  }

  vs.cx += (vs.tx - vs.cx) * 0.15; vs.cy += (vs.ty - vs.cy) * 0.15;
  document.getElementById('cur').style.left = vs.cx + 'px';
  document.getElementById('cur').style.top = vs.cy + 'px';

  // 背景物理推擠
  const wm = new THREE.Vector3(((vs.cx/window.innerWidth)*2-1)*115, -((vs.cy/window.innerHeight)*2-1)*85, 10);
  if(mesh){
    const arr = mesh.geometry.attributes.position.array;
    for(let i=0; i<arr.length; i+=3){
      const dist = Math.sqrt((arr[i]-wm.x)**2 + (arr[i+1]-wm.y)**2);
      let z = Math.sin(t*1.2+(arr[i]+arr[i+1])*0.04)*(4.5+chaos*10.0);
      if(dist < 100) z += (100 - dist) * (0.6 + chaos * 2.5); 
      arr[i+2] = z;
    }
    mesh.geometry.attributes.position.needsUpdate = true;
  }

  particles.children.forEach(p => {
    const d = p.position.distanceTo(wm);
    if(d < 70) p.userData.v.add(new THREE.Vector3().subVectors(p.position, wm).normalize().multiplyScalar((1.0 - d/70) * (3.0 + chaos * 8.0)));
    p.position.add(p.userData.v); p.userData.v.multiplyScalar(0.85);
    p.position.lerp(p.userData.origin, 0.02);
  });

  const cycleTime = 8000 / (0.35 + entropy * 1.8);
  if(Date.now() - vs.lastSwitch > cycleTime){
    vs.tTrans = 0.1;
    setTimeout(() => {
      vs.modeCount = (vs.modeCount + 1) % 6; vs.subMode = vs.modeCount;
      shaderMat.uniforms.subMode.value = vs.subMode; vs.tTrans = 1.0;
    }, 400);
    vs.lastSwitch = Date.now();
  }
  renderer.render(scene, camera);
}

// 旋鈕邏輯
const mkKnob = (id, nid, set) => {
  const el = document.getElementById(id); let drag=false, ly=0;
  const start = y => { drag=true; ly=y; el.classList.add('drag'); };
  const move = y => { if(!drag) return; set((ly-y)*0.008); ly=y; };
  el.onmousedown = e => { e.stopPropagation(); start(e.clientY); };
  window.addEventListener('mousemove', e => move(e.clientY));
  window.addEventListener('mouseup', () => { drag=false; el.classList.remove('drag'); });
  el.ontouchstart = e => { e.stopPropagation(); start(e.touches[0].clientY); };
  window.addEventListener('touchmove', e => { if(drag) { e.preventDefault(); move(e.touches[0].clientY); } }, {passive:false});
  window.addEventListener('touchend', () => { drag=false; el.classList.remove('drag'); });
};
mkKnob('kc', 'nc', d => { chaos=Math.max(0,Math.min(1,chaos+d)); document.getElementById('nc').style.transform=`rotate(${chaos*280-140}deg)`; });
mkKnob('ke', 'ne', d => { entropy=Math.max(0,Math.min(1,entropy+d)); document.getElementById('ne').style.transform=`rotate(${entropy*280-140}deg)`; });

function onPointer(x, y){ vs.interacting=true; vs.tx=x; vs.ty=y; }
window.onmousedown = e => onPointer(e.clientX, e.clientY);
window.onmouseup = () => vs.interacting=false;
window.ontouchstart = e => onPointer(e.touches[0].clientX, e.touches[0].clientY);
window.ontouchend = () => vs.interacting=false;

document.getElementById('btn-ai').onclick = () => { if(loopTimer) clearTimeout(loopTimer); triggerAI(); };
window.onload = initEngine;
</script>
</body>
