<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>《自我觀測儀》系統實踐原型 v14.3 - 指尖感應增強版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Share Tech Mono', monospace;
            touch-action: none; 
        }

        .crt-overlay {
            pointer-events: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(255, 255, 255, 0.02) 50%), 
                        linear-gradient(90deg, rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.01));
            background-size: 100% 3px, 3px 100%;
            z-index: 200;
        }

        .main-viewport { width: 100vw; height: 100vh; position: relative; background: #000; cursor: none; }
        
        .knob-interface {
            position: absolute;
            right: 20px;
            bottom: 30px;
            display: flex;
            gap: 25px;
            z-index: 250;
            pointer-events: auto;
        }

        .circular-knob {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        
        @media (min-width: 768px) {
            .knob-interface { right: 50px; bottom: 50px; gap: 40px; }
            .circular-knob { width: 90px; height: 90px; }
        }

        .circular-knob:hover { border: 1px solid rgba(255, 255, 255, 0.6); background: rgba(255, 255, 255, 0.15); }

        .knob-label {
            position: absolute;
            top: -25px;
            width: 140%;
            left: -20%;
            text-align: center;
            font-size: 8px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .knob-hand {
            width: 2px;
            height: 35px;
            background: rgba(255, 255, 255, 0.8);
            transform-origin: bottom;
            position: absolute;
            bottom: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .custom-cursor {
            width: 44px; height: 44px; 
            border: 1px solid #FF3131;
            position: fixed; pointer-events: none; 
            z-index: 300; 
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
            border-radius: 50%;
            transition: border-width 0.2s, width 0.3s, height 0.3s;
        }
        
        .cursor-detecting {
            width: 60px; height: 60px;
            border-width: 3px;
            box-shadow: 0 0 20px rgba(255, 49, 49, 0.5);
            border-color: #FFFFFF;
        }

        #motion-canvas {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 90px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0.3;
            z-index: 50;
            background: #000;
        }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>
    <div id="cursor" class="custom-cursor"></div>

    <canvas id="motion-canvas" width="120" height="90"></canvas>

    <div class="knob-interface">
        <div class="circular-knob" id="knob-chaos">
            <div class="knob-label">CHAOS_MOD</div>
            <div class="knob-hand" id="hand-chaos"></div>
        </div>
        <div class="circular-knob" id="knob-entropy">
            <div class="knob-label">ENTROPY_MOD</div>
            <div class="knob-hand" id="hand-entropy"></div>
        </div>
    </div>

    <div class="main-viewport">
        <div id="three-container"></div>
    </div>

    <video id="video" autoplay playsinline style="display:none"></video>

    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        uniform float time;
        uniform float chaos;
        void main() {
            vUv = uv;
            vec3 pos = position;
            float wave = sin(time * 1.5 + (pos.x * 0.05 + pos.y * 0.05)) * (chaos * 15.0);
            pos.z += wave;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    </script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform sampler2D tDiffuse;
        uniform int phasePair;
        uniform int subMode;
        uniform float time;
        uniform float chaos;
        uniform float transition;
        varying vec2 vUv;
        void main() {
            vec2 uv = vUv;
            if(chaos > 0.1) {
                float d = distance(uv, vec2(0.5));
                uv.x += sin(d * 10.0 - time) * 0.02 * chaos;
                uv.y += cos(d * 10.0 - time) * 0.02 * chaos;
            }
            if(phasePair == 1 || phasePair == 3) {
                if(subMode == 3) uv.x = abs(uv.x - 0.5) + 0.25;
            }
            vec4 tex = texture2D(tDiffuse, uv);
            float luma = dot(tex.rgb, vec3(0.299, 0.587, 0.114));
            vec4 finalCol = tex;
            if(phasePair == 1 || phasePair == 2) {
                if(subMode % 5 == 0) {
                    vec3 col = mix(vec3(0.1), vec3(0.7, 0.8, 1.0), luma);
                    if(luma > 0.6) col = mix(col, vec3(1.0), (luma-0.6)*2.0);
                    finalCol = mix(finalCol, vec4(col, 1.0), 0.7 * transition);
                } else if (subMode % 5 == 1) {
                    float edge = fwidth(luma) * 22.0;
                    finalCol += vec4(vec3(edge), 0.0) * transition;
                }
            }
            gl_FragColor = finalCol * transition;
        }
    </script>

    <script>
        let state = {
            phasePair: 1, subMode: 0,
            chaos: 0.5, entropy: 0.4,
            lastSwitch: 0, transition: 0, targetTransition: 1,
            targetX: window.innerWidth / 2, targetY: window.innerHeight / 2,
            currentX: window.innerWidth / 2, currentY: window.innerHeight / 2,
            isMouseInteracting: false,
            isSwitching: false
        };

        let scene, camera, renderer, videoTexture, mesh, particles, liquidWeb;
        let shaderMat;
        const CYCLE_INTERVAL = 8000;

        function initKnobs() {
            const setupKnob = (id, key) => {
                const knob = document.getElementById(id);
                const hand = document.getElementById('hand-' + id.split('-')[1]);
                let isDragging = false;
                let lastY = 0;
                
                const updateHand = (val) => {
                    hand.style.transform = `translateX(-50%) rotate(${val * 280 - 140}deg)`;
                };

                const startDragging = (y, e) => {
                    isDragging = true;
                    state.isMouseInteracting = true;
                    lastY = y;
                    if(e.cancelable) e.preventDefault();
                };

                const moveDragging = (y) => {
                    if (!isDragging) return;
                    const delta = lastY - y;
                    // 微調旋鈕靈敏度
                    state[key] = Math.max(0, Math.min(1, state[key] + delta * 0.007));
                    updateHand(state[key]);
                    lastY = y;
                };

                const stopDragging = () => {
                    isDragging = false;
                    state.isMouseInteracting = false;
                };

                knob.onmousedown = (e) => startDragging(e.clientY, e);
                window.addEventListener('mousemove', (e) => moveDragging(e.clientY));
                window.addEventListener('mouseup', stopDragging);

                knob.ontouchstart = (e) => startDragging(e.touches[0].clientY, e);
                window.addEventListener('touchmove', (e) => moveDragging(e.touches[0].clientY), { passive: false });
                window.addEventListener('touchend', stopDragging);

                updateHand(state[key]);
            };
            setupKnob('knob-chaos', 'chaos');
            setupKnob('knob-entropy', 'entropy');
        }

        // --- 感應核心：優化右側響應與追蹤集中度 ---
        let prevFrame = null;
        const motionCanvas = document.getElementById('motion-canvas');
        const motionCtx = motionCanvas.getContext('2d');

        function updateMotionTracking() {
            if (state.isMouseInteracting) return;

            const v = document.getElementById('video');
            if (v.readyState !== v.HAVE_ENOUGH_DATA) return;

            motionCtx.drawImage(v, 0, 0, motionCanvas.width, motionCanvas.height);
            const currFrame = motionCtx.getImageData(0, 0, motionCanvas.width, motionCanvas.height);
            
            if (prevFrame) {
                let totalX = 0, totalY = 0, count = 0;
                const threshold = 25; // 提高靈敏度

                for (let i = 0; i < currFrame.data.length; i += 4) {
                    const diff = (Math.abs(currFrame.data[i] - prevFrame.data[i]) +
                                  Math.abs(currFrame.data[i+1] - prevFrame.data[i+1]) +
                                  Math.abs(currFrame.data[i+2] - prevFrame.data[i+2])) / 3;

                    if (diff > threshold) {
                        const idx = i / 4;
                        const px = idx % motionCanvas.width;
                        const py = Math.floor(idx / motionCanvas.width);
                        
                        // 加權邏輯：讓「中心化」的動作更有影響力
                        totalX += px;
                        totalY += py;
                        count++;
                        currFrame.data[i] = 255; 
                        currFrame.data[i+1] = 255; 
                        currFrame.data[i+2] = 255;
                    }
                }

                if (count > 30) { 
                    const avgX = totalX / count;
                    const avgY = totalY / count;
                    
                    // 修正映射：確保覆蓋 0 到 window.innerWidth
                    const padding = 0.05; // 邊緣緩衝區
                    let normalizedX = avgX / motionCanvas.width;
                    // 攝影機鏡像處理，並擴展感應邊界
                    normalizedX = 1.0 - normalizedX; 
                    normalizedX = (normalizedX - padding) / (1 - padding * 2);
                    normalizedX = Math.max(0, Math.min(1, normalizedX));

                    const nX = normalizedX * window.innerWidth;
                    const nY = (avgY / motionCanvas.height) * window.innerHeight;
                    
                    state.targetX += (nX - state.targetX) * 0.25;
                    state.targetY += (nY - state.targetY) * 0.25;
                    
                    document.getElementById('cursor').classList.add('cursor-detecting');
                } else {
                    document.getElementById('cursor').classList.remove('cursor-detecting');
                }
                motionCtx.putImageData(currFrame, 0, 0);
            }
            
            if (!prevFrame) prevFrame = new ImageData(currFrame.width, currFrame.height);
            prevFrame.data.set(currFrame.data);
        }

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" } 
                });
                document.getElementById('video').srcObject = stream;
                await document.getElementById('video').play();
            } catch(e) { console.error("Camera access failed"); }

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 110;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('three-container').appendChild(renderer.domElement);

            videoTexture = new THREE.VideoTexture(document.getElementById('video'));

            shaderMat = new THREE.ShaderMaterial({
                uniforms: { 
                    tDiffuse: { value: videoTexture }, 
                    phasePair: { value: 1 }, subMode: { value: 0 }, 
                    time: { value: 0 }, chaos: { value: 0.5 }, transition: { value: 1.0 }
                },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                transparent: true
            });

            mesh = new THREE.Mesh(new THREE.PlaneBufferGeometry(230, 170, 128, 128), shaderMat);
            scene.add(mesh);

            const lineMat = new THREE.LineBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.2 });
            liquidWeb = new THREE.LineSegments(new THREE.BufferGeometry(), lineMat);
            scene.add(liquidWeb);

            createFragments();
            initKnobs();
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function createFragments() {
            particles = new THREE.Group();
            const cols = 15, rows = 12;
            const w = 230/cols, h = 170/rows;
            const geometries = [
                new THREE.TorusKnotBufferGeometry(w/3.5, 0.1, 32, 8),
                new THREE.OctahedronBufferGeometry(w/2, 1),
                new THREE.CylinderBufferGeometry(w/4, w/4, h, 8, 1),
                new THREE.SphereBufferGeometry(w/2, 16, 12)
            ];

            for(let i=0; i<cols; i++) {
                for(let j=0; j<rows; j++) {
                    const geo = geometries[Math.floor(Math.random()*geometries.length)];
                    const p = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ 
                        map: videoTexture, transparent: true, opacity: 0.9, color: 0xEEEEEE
                    }));
                    const ox = i*w-115+w/2, oy = j*h-85+h/2;
                    p.position.set(ox, oy, (Math.random()-0.5)*20);
                    p.userData = { 
                        origin: p.position.clone(), v: new THREE.Vector3(), 
                        noise: Math.random()*100, viscosity: 0.85 + Math.random()*0.1, elasticity: 0.02
                    };
                    particles.add(p);
                }
            }
            scene.add(particles);
        }

        function randomize() {
            state.isSwitching = true;
            state.targetTransition = 0.1; 
            setTimeout(() => {
                state.phasePair = Math.floor(Math.random() * 3) + 1;
                state.subMode = Math.floor(Math.random() * 6);
                shaderMat.uniforms.phasePair.value = state.phasePair;
                shaderMat.uniforms.subMode.value = state.subMode;
                mesh.visible = (state.phasePair === 1 || state.phasePair === 3);
                particles.visible = (state.phasePair === 2 || state.phasePair === 3);
                state.targetTransition = 1.0;
                state.isSwitching = false;
            }, 500);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            shaderMat.uniforms.time.value = time;
            shaderMat.uniforms.chaos.value = state.chaos;

            updateMotionTracking();

            // 雙倍平滑追蹤
            state.currentX += (state.targetX - state.currentX) * 0.18;
            state.currentY += (state.targetY - state.currentY) * 0.18;
            const cursorEl = document.getElementById('cursor');
            cursorEl.style.left = state.currentX + 'px';
            cursorEl.style.top = state.currentY + 'px';

            state.transition += (state.targetTransition - state.transition) * 0.1;
            shaderMat.uniforms.transition.value = state.transition;

            if(Date.now() - state.lastSwitch > CYCLE_INTERVAL / (0.4 + state.entropy) && !state.isSwitching) {
                randomize(); state.lastSwitch = Date.now();
            }

            const wm = new THREE.Vector3(
                ((state.currentX / window.innerWidth) * 2 - 1) * 115,
                -((state.currentY / window.innerHeight) * 2 - 1) * 85, 10
            );

            if(particles.visible) {
                const points = [];
                particles.children.forEach((p) => {
                    const ud = p.userData;
                    let target = ud.origin.clone();
                    const t = time * (0.4 + state.chaos * 0.5);
                    target.x += Math.sin(t + ud.noise) * (40 * state.chaos);
                    target.y += Math.cos(t * 0.7 + ud.noise) * (40 * state.chaos);

                    const dist = p.position.distanceTo(wm);
                    if(dist < 80) {
                        const f = (1.0 - dist/80) * state.chaos * 6.0;
                        ud.v.add(new THREE.Vector3().subVectors(p.position, wm).normalize().multiplyScalar(f));
                        if(Math.random() > 0.5) points.push(p.position.x, p.position.y, p.position.z, wm.x, wm.y, wm.z);
                    }
                    ud.v.add(new THREE.Vector3().subVectors(target, p.position).multiplyScalar(ud.elasticity));
                    ud.v.multiplyScalar(ud.viscosity);
                    p.position.add(ud.v);
                    p.rotation.x += ud.v.length() * 0.05;
                });
                liquidWeb.geometry.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
                liquidWeb.geometry.attributes.position.needsUpdate = true;
            }

            if(mesh.visible) {
                const pos = mesh.geometry.attributes.position.array;
                for(let i=0; i<pos.length; i+=3) {
                    const vx = pos[i], vy = pos[i+1];
                    const d = Math.sqrt((vx-wm.x)**2 + (vy-wm.y)**2);
                    let z = Math.sin(time * 1.2 + (vx+vy)*0.04) * (4.0 + state.chaos * 7.0);
                    if(d < 90) z += (90-d) * state.chaos * 1.5;
                    pos[i+2] = z;
                }
                mesh.geometry.attributes.position.needsUpdate = true;
            }

            scene.rotation.y = ((state.currentX / window.innerWidth) - 0.5) * 0.08;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
