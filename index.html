<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>SELF_OBSERVER :: v34.0 NEURAL_INTERACTION</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:#000;overflow:hidden;font-family:'Share Tech Mono',monospace;color:#fff;user-select:none;touch-action:none;}

    /* CRT 掃描線特效 */
    #crt{pointer-events:none;position:fixed;inset:0;z-index:600;
         background:linear-gradient(rgba(18,16,16,0) 50%,rgba(255,255,255,.03) 50%),
                    linear-gradient(90deg,rgba(255,255,255,.01),rgba(255,255,255,.01));
         background-size:100% 3px,3px 100%;opacity:.8; mix-blend-mode: screen;}

    /* 動態感應游標 */
    #cur{position:fixed;width:60px;height:60px;border:1px solid rgba(255,255,255,0.4);border-radius:50%;
         z-index:700;pointer-events:none;transform:translate(-50%,-50%);
         mix-blend-mode:screen;transition:width .4s, height .4s, background .4s;}
    #cur.on{width:110px;height:110px;border-width:2px;border-color:#fff;background:rgba(255,255,255,0.2);box-shadow:0 0 50px rgba(255,255,255,0.7);}

    /* AI 影像展示層 */
    #ai-img{
      position:fixed;inset:0;z-index:36;
      width:100%;height:100%;object-fit:cover;
      opacity:0;pointer-events:none;
      filter:saturate(0.8) contrast(1.2) brightness(0.8);
      transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ══════════════════════════════════════════════
       左側面板 - 存檔紀錄
    ══════════════════════════════════════════════ */
    #sidebar{
      position:fixed;left:0;top:0;bottom:0;z-index:800;
      display:flex;align-items:stretch;pointer-events:auto;
    }
    #sidebar-panel{
      width:0;overflow:hidden;
      background:rgba(0,0,0,.97);
      border-right:1px solid rgba(255,255,255,.2);
      transition:width .5s cubic-bezier(.4,0,.2,1);
      display:flex;flex-direction:column;
    }
    #sidebar.open #sidebar-panel{width:320px;}

    #sidebar-header{
      padding:25px 20px 15px; font-size:10px; letter-spacing:.5em; color:rgba(255,255,255,.5);
      border-bottom:1px solid rgba(255,255,255,0.1); flex-shrink:0; text-transform: uppercase;
    }
    #sidebar-scroll{flex:1; overflow-y:auto; padding: 12px;}
    #sidebar-scroll::-webkit-scrollbar{width:2px;}
    #sidebar-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.4);}

    #history-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .rec{
      padding:8px; border:1px solid rgba(255,255,255,.05); cursor:pointer; 
      transition:all .3s; background: rgba(255,255,255,0.02);
    }
    .rec:hover{background:rgba(255,255,255,.1); border-color: rgba(255,255,255,0.3);}
    .rec-time{font-size:7px; color:rgba(255,255,255,.4); margin-bottom:6px; white-space: nowrap; overflow: hidden;}
    .rec-ai-img{width:100%; aspect-ratio:1; object-fit:cover; border:1px solid rgba(255,255,255,0.1); margin-bottom:6px;}

    #dbg-section{background:rgba(0,0,0,1); border-top:1px solid rgba(255,255,255,0.25);}
    #dbg{padding:14px 18px; font-size:9px; line-height:1.7; color:#0f0; max-height:140px; overflow-y:auto; font-family: monospace; opacity: 0.8;}

    #sidebar-toggle{
      width:32px; background:rgba(0,0,0,1); border-right:1px solid rgba(255,255,255,0.2); cursor:pointer;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    }
    .tdot{width:4px; height:4px; background:#555; border-radius:50%; transition: 0.4s;}
    #sidebar.open .tdot{background:#fff; box-shadow: 0 0 10px #fff;}

    /* 控制介面 */
    #controls{position:absolute;right:40px;bottom:40px;display:flex;flex-direction:column;align-items:flex-end;gap:30px;z-index:850;pointer-events:auto;}
    .knob-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;}
    .knob-label{font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:0.3em; text-transform: uppercase;}
    .knob{
      width:75px;height:75px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);
      display:flex;align-items:center;justify-content:center;position:relative;
      background:radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 75%);
      cursor:ns-resize;
    }
    .needle{position:absolute;width:2px;height:45%;background:#fff;box-shadow:0 0 12px #fff;
            transform-origin:bottom center;bottom:50%;left:calc(50% - 1px);pointer-events:none;}
    
    .ibtn{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.4);cursor:pointer;transition:0.4s; display: flex; align-items: center; justify-content: center; font-size: 8px;}
    .ibtn.pulse{animation:btnPulse 1s infinite; background:#fff; color: #000; border-color: transparent;}
    .ibtn.active{background: #0af; border-color: transparent; box-shadow: 0 0 15px #0af;}
    @keyframes btnPulse{0%,100%{transform: scale(1);} 50%{transform: scale(1.1); box-shadow: 0 0 20px #fff;}}

    /* 腦波 HUD */
    #eeg-hud{position:fixed;left:40px;bottom:40px;font-size:10px;color:rgba(255,255,255,0.35);line-height:2.2;z-index:500;}
    .eeg-line{display:inline-block; width: 50px; height: 10px; background: rgba(255,255,255,0.05); vertical-align: middle; margin-left: 10px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);}
    .eeg-bar{height: 100%; background: #fff; width: 0%; transition: width 0.15s cubic-bezier(0.1, 0.9, 0.2, 1); box-shadow: 0 0 5px #fff;}

    #uid-tag{position:fixed;top:40px;right:40px;font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:0.5em;z-index:500;}
    #video-canvas{position:fixed; left:40px; bottom:200px; width:150px; height:112px; border:1px solid rgba(255,255,255,0.2); opacity:0.4; z-index:100; filter: grayscale(1) contrast(1.5);}
  </style>
</head>
<body>

<div id="crt"></div>
<div id="cur"></div>
<div id="container" style="width:100vw;height:100vh;cursor:none;position:relative;z-index:10;"></div>

<video id="video" style="display:none;" playsinline muted autoplay></video>
<canvas id="analysis-cv" width="64" height="48" style="display:none;"></canvas>
<canvas id="video-canvas"></canvas>

<img id="ai-img" src="" alt=""/>

<div id="sidebar">
  <div id="sidebar-panel">
    <div id="sidebar-header">NEURAL_OBSERVATION_ARCHIVE</div>
    <div id="sidebar-scroll">
        <div id="history-grid"></div>
    </div>
    <div id="dbg-section">
      <div id="dbg">SYSTEM_V34: INTERACTION_SYNC...</div>
    </div>
  </div>
  <div id="sidebar-toggle" onclick="toggleSidebar()">
    <div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>
  </div>
</div>

<div id="uid-tag">LINK_STATUS // INTERACTIVE</div>
<div id="eeg-hud">
  DEVICE: <span id="eeg-device" style="color:#0af">DISCONNECTED</span><br/>
  SYNC_RATE: <span id="eeg-val" style="color:#fff; font-weight:bold;">IDLE</span><br/>
  ALPHA <div class="eeg-line"><div id="bar-a" class="eeg-bar"></div></div><br/>
  BETA  <div class="eeg-line"><div id="bar-b" class="eeg-bar"></div></div><br/>
  DELTA <div class="eeg-line"><div id="bar-d" class="eeg-bar"></div></div><br/>
  THETA <div class="eeg-line"><div id="bar-t" class="eeg-bar"></div></div>
</div>

<div id="controls">
  <div style="display:flex;gap:35px;">
    <div class="knob-wrap">
      <span class="knob-label">Chaos</span>
      <div class="knob" id="knob-chaos"><div class="needle" id="needle-chaos"></div></div>
    </div>
    <div class="knob-wrap">
      <span class="knob-label">Entropy</span>
      <div class="knob" id="knob-entropy"><div class="needle" id="needle-entropy"></div></div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:15px;margin-top:20px;">
    <div class="knob-wrap">
        <span class="knob-label" style="font-size:7px">EEG</span>
        <button id="btn-bt" class="ibtn" onclick="connectEEG()">BT</button>
    </div>
    <div class="knob-wrap">
        <span class="knob-label" style="font-size:7px">SYNC</span>
        <button id="btn-ai" class="ibtn" onclick="handleManualSync()">AI</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════
// 核心系統變數
// ════════════════════════════════
let chaos = 0.5, entropy = 0.4, generating = false, eegConnected = false;
let scene, camera, renderer, shaderMat, mesh, particles, videoTex;
let prevFrame = null, sidebarOpen = false, historyRecords = [];
let aiLoopTimer = null;
const MODE_NAMES = ['BIO', 'WIRE', 'INFRA', 'SYM', 'PIXEL', 'GLITCH'];

const vs = { tx: innerWidth/2, ty: innerHeight/2, cx: innerWidth/2, cy: innerHeight/2, lastSwitch: Date.now(), trans: 1, tTrans: 1, subMode: 0 };

function dbg(m, c = "#0f0") {
  const el = document.getElementById('dbg');
  if(!el) return;
  const d = document.createElement('div'); d.style.color = c;
  d.textContent = `> ${m}`;
  el.appendChild(d); el.scrollTop = el.scrollHeight;
  if (el.children.length > 25) el.removeChild(el.firstChild);
}

function toggleSidebar() { 
  sidebarOpen = !sidebarOpen; 
  document.getElementById('sidebar').classList.toggle('open', sidebarOpen); 
}

// ════════════════════════════════
// 腦波儀連接 (保留真實協議)
// ════════════════════════════════
async function connectEEG() {
  if (!navigator.bluetooth) { dbg("BT_NOT_SUPPORTED", "#f44"); return; }
  try {
    dbg("REQUESTING_NEURAL_DEVICE...", "#0af");
    const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
    dbg(`LINKED: ${device.name}`, "#fff");
    await device.gatt.connect();
    eegConnected = true;
    document.getElementById('btn-bt').classList.add('active');
    document.getElementById('eeg-device').textContent = device.name.toUpperCase();
    dbg("NEURAL_LINK_ESTABLISHED", "#0f0");
  } catch (e) { dbg(`BT_FAIL: ${e.message}`, "#f44"); }
}

// ════════════════════════════════
// AI 核心持續加載 (v28 穩定路徑)
// ════════════════════════════════
const PROMPTS = [
  "neon cybernetic biometric scan face, digital data veins, sci-fi masterpiece, hyperdetailed",
  "architectural wireframe consciousness blueprint, crystalline lines, tech geometry",
  "spectral thermal infrared phantom face, ethereal negative aura",
  "technological symmetry mandala robotic face structure, futurist fractal",
  "pixel archaeology fragments of cyber face, 8k data debris",
  "unstable chromatic aberration glitch, shattered holographic portrait"
];

function handleManualSync() {
  if(aiLoopTimer) clearTimeout(aiLoopTimer);
  triggerAI();
}

async function triggerAI() {
  if (generating) return;
  generating = true;
  const btn = document.getElementById('btn-ai');
  btn.classList.add('pulse');
  dbg("NEURAL_SYNC_STARTED...", "#fff");

  const s1 = renderer.domElement.toDataURL('image/jpeg', 0.5);
  const promptBase = PROMPTS[vs.subMode] || PROMPTS[0];
  const seed = Math.floor(Math.random() * 999999);
  
  const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(promptBase)}?width=1024&height=1024&nologo=true&seed=${seed}`;

  const scheduleNext = (delay = 25000) => {
    generating = false;
    btn.classList.remove('pulse');
    aiLoopTimer = setTimeout(triggerAI, delay);
  };

  try {
    const imgEl = document.getElementById('ai-img');
    const tempImg = new Image();
    const loadPromise = new Promise((resolve, reject) => {
      tempImg.onload = () => resolve(tempImg.src);
      tempImg.onerror = () => reject(new Error("IMAGE_SYNC_FAILED"));
      tempImg.src = url;
      setTimeout(() => reject(new Error("TIMEOUT")), 35000);
    });

    const finalSrc = await loadPromise;
    dbg("AI_VISION_SYNC_SUCCESS ✓", "#0f0");
    imgEl.src = finalSrc;
    imgEl.style.opacity = '0.9';
    addRecord(s1, finalSrc);
    setTimeout(() => { imgEl.style.opacity = '0'; scheduleNext(); }, 15000);
  } catch (e) {
    dbg(`SYNC_FAILED: FALLBACK_MODE`, "#ff0");
    const fb = `https://loremflickr.com/1024/1024/cyberpunk,technology?lock=${seed}`;
    const imgEl = document.getElementById('ai-img');
    imgEl.src = fb; imgEl.style.opacity = '0.85';
    addRecord(s1, fb);
    setTimeout(() => { imgEl.style.opacity = '0'; scheduleNext(10000); }, 10000);
  }
}

function addRecord(s1, s2) {
  historyRecords.unshift({ t: new Date().toLocaleTimeString(), s1, s2, mode: vs.subMode, c: chaos, e: entropy });
  if(historyRecords.length > 60) historyRecords.pop();
  renderHistory();
}

function renderHistory() {
  const grid = document.getElementById('history-grid');
  grid.innerHTML = '';
  historyRecords.forEach(rec => {
    const div = document.createElement('div');
    div.className = 'rec';
    div.innerHTML = `
      <div class="rec-time">${rec.t}</div>
      <img class="rec-ai-img" src="${rec.s2}"/>
    `;
    div.onclick = () => {
      const el = document.getElementById('ai-img');
      el.src = rec.s2; el.style.opacity = '0.92';
      setTimeout(() => el.style.opacity = '0', 8000);
    };
    grid.appendChild(div);
  });
}

// ════════════════════════════════
// 動態感應
// ════════════════════════════════
function processMotion() {
  const v = document.getElementById('video');
  const cv = document.getElementById('analysis-cv');
  const previewCv = document.getElementById('video-canvas');
  if (v.readyState < 2) return;
  const ctx = cv.getContext('2d');
  const pCtx = previewCv.getContext('2d');
  ctx.drawImage(v, 0, 0, cv.width, cv.height);
  pCtx.drawImage(v, 0, 0, previewCv.width, previewCv.height);
  const curr = ctx.getImageData(0, 0, cv.width, cv.height);
  if (prevFrame) {
    let tx = 0, ty = 0, count = 0;
    for (let i = 0; i < curr.data.length; i += 4) {
      const diff = (Math.abs(curr.data[i] - prevFrame.data[i]) + Math.abs(curr.data[i+1] - prevFrame.data[i+1]) + Math.abs(curr.data[i+2] - prevFrame.data[i+2])) / 3;
      if (diff > 25) { tx += (i/4) % cv.width; ty += Math.floor((i/4) / cv.width); count++; }
    }
    if (count > 25) { vs.tx = (1.0 - (tx/count/cv.width)) * innerWidth; vs.ty = (ty/count/cv.height) * innerHeight; document.getElementById('cur').classList.add('on'); }
    else { document.getElementById('cur').classList.remove('on'); }
  }
  prevFrame = curr;
}

// ════════════════════════════════
// Three.js 視覺共鳴 (球體互動背景)
// ════════════════════════════════
async function initEngine() {
  const v = document.getElementById('video');
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    v.srcObject = s; await v.play();
  } catch (e) { dbg("SENSOR_OFFLINE", "#f44"); }

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
  camera.position.z = 135;

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById('container').appendChild(renderer.domElement);

  videoTex = new THREE.VideoTexture(v);
  
  shaderMat = new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: videoTex }, subMode: { value: 0 }, time: { value: 0 }, chaos: { value: 0.5 }, transition: { value: 1.0 } },
    vertexShader: `
      varying vec2 vUv; varying float vZ; uniform float time, chaos;
      void main() {
        vUv = uv;
        vec3 p = position;
        // 背景基礎波動
        float w1 = sin(p.x * 0.05 + time * 1.8) * cos(p.y * 0.05 + time * 1.2);
        float w2 = cos(p.x * 0.03 - time) * sin(p.y * 0.04 + time * 0.9);
        p.z += (w1 + w2) * (5.0 + chaos * 25.0);
        vZ = p.z;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform int subMode;
      uniform float time, chaos, transition; varying vec2 vUv; varying float vZ;
      void main() {
        vec2 uv = vUv;
        if(chaos > 0.1) {
          float d = distance(uv, vec2(0.5));
          uv += sin(d * 20.0 - time * 4.0) * (0.02 * chaos);
        }
        if(subMode == 3) uv.x = abs(uv.x - 0.5) + 0.25; 
        if(subMode == 4) { float sz = 160.0 - (chaos * 120.0); uv = floor(uv * sz) / sz; } 
        vec4 fc = texture2D(tDiffuse, uv);
        float l = dot(fc.rgb, vec3(0.299, 0.587, 0.114));
        if(subMode == 0) fc.rgb = mix(vec3(0.0), vec3(0.2, 0.6, 1.0), l); 
        else if(subMode == 1) fc = vec4(vec3(fwidth(l) * (30.0 + chaos * 50.0)), 1.0); 
        else if(subMode == 2) { fc.rgb = 1.0 - fc.rgb; fc.rgb *= vec3(0.7, 0.85, 1.0); } 
        else if(subMode == 5) {
          float s = sin(time * 30.0) * 0.04 * chaos;
          fc.r = texture2D(tDiffuse, uv + vec2(s, 0.0)).r;
          fc.b = texture2D(tDiffuse, uv - vec2(s, 0.0)).b;
        }
        // 加入深度陰影效果讓互動更明顯
        gl_FragColor = fc * transition * (1.0 + vZ * 0.005);
      }
    `,
    transparent: true
  });

  // 使用 BufferGeometry 方便手動更新頂點位置實現球體互動
  const geom = new THREE.PlaneBufferGeometry(380, 280, 128, 128);
  mesh = new THREE.Mesh(geom, shaderMat);
  scene.add(mesh);

  particles = new THREE.Group();
  const geos = [new THREE.SphereGeometry(10, 24, 24), new THREE.TorusKnotGeometry(9, 0.5, 100, 16), new THREE.IcosahedronGeometry(12, 0)];
  for(let i=0; i<85; i++){
    const p = new THREE.Mesh(geos[i % 3], shaderMat);
    p.position.set((Math.random()-0.5)*380, (Math.random()-0.5)*280, (Math.random()-0.5)*100);
    p.userData = { origin: p.position.clone(), v: new THREE.Vector3(), size: 10 + Math.random() * 5 };
    particles.add(p);
  }
  scene.add(particles);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  const t = Date.now() * 0.001;
  processMotion();
  shaderMat.uniforms.time.value = t;
  shaderMat.uniforms.chaos.value = chaos;
  vs.trans += (vs.tTrans - vs.trans) * 0.1;
  shaderMat.uniforms.transition.value = vs.trans;

  // 游標與感應跟隨
  vs.cx += (vs.tx - vs.cx) * 0.2; vs.cy += (vs.ty - vs.cy) * 0.2;
  document.getElementById('cur').style.left = vs.cx + 'px';
  document.getElementById('cur').style.top = vs.cy + 'px';

  const observerPos = new THREE.Vector3(((vs.cx/innerWidth)*2-1)*170, -((vs.cy/innerHeight)*2-1)*130, 10);
  
  // 核心：背景頂點與球體的實體互動
  const posArr = mesh.geometry.attributes.position.array;
  for (let i = 0; i < posArr.length; i += 3) {
      let x = posArr[i];
      let y = posArr[i+1];
      let interactZ = 0;

      // 計算附近的球體對該頂點產生的「壓強」
      particles.children.forEach(p => {
          const dx = x - p.position.x;
          const dy = y - p.position.y;
          const distSq = dx*dx + dy*dy;
          const radius = p.userData.size * 3.5; 
          if (distSq < radius * radius) {
              const d = Math.sqrt(distSq);
              // 球體推擠背景產生下陷或隆起
              interactZ += (1.0 - d / radius) * (20.0 + chaos * 40.0);
          }
      });
      
      // 更新 Z 軸位置 (基礎波浪在 Shader 做，這裡處理互動形變)
      posArr[i+2] = interactZ;
  }
  mesh.geometry.attributes.position.needsUpdate = true;

  // 球體物理動態
  particles.children.forEach(p => {
    const d = p.position.distanceTo(observerPos);
    if(d < 110) p.userData.v.add(new THREE.Vector3().subVectors(p.position, observerPos).normalize().multiplyScalar((1.0 - d/110) * (20.0 + chaos * 30.0)));
    p.position.add(p.userData.v); p.userData.v.multiplyScalar(0.8); p.position.lerp(p.userData.origin, 0.03); 
    p.rotation.x += 0.02; p.rotation.y += 0.01;
  });

  // HUD 僅在藍芽連接時展現波動
  if(eegConnected) {
    const sync = (90 + Math.random() * 10).toFixed(1);
    document.getElementById('eeg-val').textContent = sync + "% (LIVE)";
    const updateB = (id, b) => { document.getElementById(id).style.width = Math.max(5, Math.min(100, b*100 + (Math.random()-0.5)*30)) + "%"; };
    updateB('bar-a', chaos); updateB('bar-b', entropy); updateB('bar-d', Math.random()); updateB('bar-t', Math.random());
  }

  const switchTime = 18000 / (0.6 + entropy * 4);
  if (Date.now() - vs.lastSwitch > switchTime) {
    vs.tTrans = 0;
    setTimeout(() => { vs.subMode = (vs.subMode + 1) % 6; shaderMat.uniforms.subMode.value = vs.subMode; vs.tTrans = 1.0; dbg(`CORE_SHIFT: ${MODE_NAMES[vs.subMode]}`, "#0af"); }, 800);
    vs.lastSwitch = Date.now();
  }
  renderer.render(scene, camera);
}

function initKnobs() {
  const mkKnob = (id, nid, set, val) => {
    const el = document.getElementById(id); const needle = document.getElementById(nid);
    let drag = false, lastY = 0;
    const updateN = (v) => { needle.style.transform = `rotate(${v * 280 - 140}deg)`; };
    updateN(val);
    const start = y => { drag = true; lastY = y; };
    const move = y => { if(!drag) return; set((lastY - y) * 0.008); lastY = y; };
    el.onmousedown = e => start(e.clientY);
    window.addEventListener('mousemove', e => { if(drag) move(e.clientY); });
    window.addEventListener('mouseup', () => drag = false);
    el.ontouchstart = e => start(e.touches[0].clientY);
    window.addEventListener('touchmove', e => { if(drag) move(e.touches[0].clientY); });
    window.addEventListener('touchend', () => drag = false);
    setInterval(() => { updateN(id.includes('chaos') ? chaos : entropy); }, 100);
  };
  mkKnob('knob-chaos', 'needle-chaos', d => chaos = Math.max(0, Math.min(1, chaos + d)), chaos);
  mkKnob('knob-entropy', 'needle-entropy', d => entropy = Math.max(0, Math.min(1, entropy + d)), entropy);
}
