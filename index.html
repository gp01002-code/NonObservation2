<script>

   STATE
════════════════════════════════ */
let chaos=.5, entropy=.4, eegActive=false, generating=false;
let scene, camera, renderer, shaderMat, mesh, particles, liquidWeb, videoTex, prevFrame=null;
const vs={
  tx:innerWidth/2,ty:innerHeight/2,cx:innerWidth/2,cy:innerHeight/2,
  lastSwitch:Date.now(),trans:1,tTrans:1,
  subMode:0,modeCount:0,interacting:false,

   SIDEBAR
════════════════════════════════ */
let sidebarOpen=false;
function toggleSidebar(){
  sidebarOpen=!sidebarOpen;
  document.getElementById('sidebar').classList.toggle('open',sidebarOpen);

/* ════════════════════════════════
   HISTORY
════════════════════════════════ */
const MODE_NAMES=['BIOMETRIC','WIREFRAME','NEGATIVE','SYMMETRY','PIXEL','CHROMA'];
let history=[];

function addRecord(s1url, s2url, mode, c, e){
  const ts=new Date();
  const t=`${ts.getHours().toString().padStart(2,'0')}:${ts.getMinutes().toString().padStart(2,'0')}:${ts.getSeconds().toString().padStart(2,'0')}`;
  history.unshift({t, s1:s1url, s2:s2url, mode, c, e});
  if(history.length>20) history.pop();
  renderHistory();
}

function renderHistory(){
  const list=document.getElementById('sidebar-scroll');
  list.innerHTML='';
  history.forEach(rec=>{
    const div=document.createElement('div');
    div.className='rec';
    const s1html = rec.s1
      ? `<img class="rec-thumb" src="${rec.s1}" alt=""/>`
      : `<div class="rec-thumb" style="background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:6px;color:rgba(255,255,255,.2)">S1</div>`;
    const s2html = rec.s2
      ? `<img class="rec-thumb ai" src="${rec.s2}" alt=""/>`
      : `<div class="rec-thumb ai" style="background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-size:6px;color:rgba(255,255,255,.2)">S2</div>`;
    div.innerHTML=`
      <div class="rec-time">${rec.t} · ${MODE_NAMES[rec.mode]||rec.mode}</div>
      <div class="rec-thumbs">
        ${s1html}
        <span class="rec-arrow">›</span>
        ${s2html}
      </div>
      <div class="rec-meta">C ${rec.c.toFixed(2)} · E ${rec.e.toFixed(2)}</div>
    `;
    if(rec.s2) div.addEventListener('click',()=>{
      const el=document.getElementById('ai-img');
      el.style.transition='opacity .5s';el.style.opacity='0';
      setTimeout(()=>{
        el.src=rec.s2;
        el.style.imageRendering='auto';
        el.style.filter='saturate(.72) contrast(1.02) brightness(.95)';
        el.style.transition='opacity 1s';el.style.opacity='.95';
      },300);
    });
    list.appendChild(div);
  });
}

/* ════════════════════════════════
   WHITE TV NOISE
════════════════════════════════ */
const noiseCv  = document.getElementById('noise-cv');
const noiseCtx = noiseCv.getContext('2d');
let noisePhase='off', noiseT=0, noiseBuildStart=0;

function resizeNoise(){ noiseCv.width=innerWidth; noiseCv.height=innerHeight; }
resizeNoise();

function drawNoise(){
  if(noisePhase==='off') return;
  const w=noiseCv.width, h=noiseCv.height;
  noiseCtx.clearRect(0,0,w,h);
  noiseT+=.055;   // 快速

  if(noisePhase==='loading'){
    // 細密白色雜訊
    const bsz=Math.random()<.55?2:5;
    const bw=Math.ceil(w/bsz), bh=Math.ceil(h/bsz);
    for(let x=0;x<bw;x++) for(let y=0;y<bh;y++){
      const v=Math.random();
      noiseCtx.fillStyle=`rgba(255,255,255,${v*.32})`;
      noiseCtx.fillRect(x*bsz,y*bsz,bsz,bsz);
    }
    // 白色掃描光條
    const sy=((noiseT*.4)%1)*h;
    const g=noiseCtx.createLinearGradient(0,sy-60,0,sy+60);
    g.addColorStop(0,'rgba(255,255,255,0)');
    g.addColorStop(.5,'rgba(255,255,255,.18)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    noiseCtx.fillStyle=g; noiseCtx.fillRect(0,sy-60,w,120);
    // 水平閃光條
    if(Math.random()<.1){
      noiseCtx.fillStyle=`rgba(255,255,255,${Math.random()*.22})`;
      noiseCtx.fillRect(0,Math.random()*h,w,Math.random()*4+1);
    }
    noiseCv.style.opacity='.9';

  } else if(noisePhase==='building'){
    // 快速消退（1800ms）
    const alpha=Math.max(0,1-(Date.now()-noiseBuildStart)/1800);
    if(alpha<=0){ noisePhase='off'; noiseCv.style.opacity='0'; return; }
    const bsz2=Math.floor(2+alpha*14);
    const bw2=Math.ceil(w/bsz2), bh2=Math.ceil(h/bsz2);
    for(let x=0;x<bw2;x++) for(let y=0;y<bh2;y++){
      const v=Math.random();
      noiseCtx.fillStyle=`rgba(255,255,255,${v*alpha*.22})`;
      noiseCtx.fillRect(x*bsz2,y*bsz2,bsz2,bsz2);
    }
    const sy2=((noiseT*.22)%1)*h;
    const g2=noiseCtx.createLinearGradient(0,sy2-35,0,sy2+35);
    g2.addColorStop(0,'rgba(255,255,255,0)');
    g2.addColorStop(.5,`rgba(255,255,255,${alpha*.12})`);
    g2.addColorStop(1,'rgba(255,255,255,0)');
    noiseCtx.fillStyle=g2; noiseCtx.fillRect(0,sy2-35,w,70);
    noiseCv.style.opacity=(alpha*.85).toFixed(3);
  }
}

/* ════════════════════════════════
   PROMPTS
════════════════════════════════ */
const STAGE2_PROMPTS=[
  "deepen into pure neural consciousness art, intensify bioluminescence, glowing circuit face, dark cosmos",
  "transform edge lines into architectural blueprint of a human soul, technical diagram, dark background, precise white ink",
  "push this inverted soul into surreal dreamscape, infrared spectral portrait, liminal space between existence and data",
  "amplify symmetry into sacred geometry mandala portrait, divine bilateral fractal, cosmic face from sacred mathematics",
  "reconstruct pixelated consciousness into neo-pointillist portrait, luminous particle face, impressionist data art",
  "intensify spectral split into pure prism art, light refraction human identity, spectrum dispersion portrait",
];
function buildPrompt(){
  const base=STAGE2_PROMPTS[vs.subMode]||STAGE2_PROMPTS[0];
  const cw=chaos>.7?'extreme chaotic fragmented,':chaos>.4?'organic motion,':'crystalline precise,';
  const ew=entropy>.7?'maximum entropy dissolution,':entropy>.4?'entropic flow,':'structured ordered,';
  return `${cw}${ew}${base}, dark background, no text no watermark, masterpiece 8k`;
}

/* ════════════════════════════════
   AI PIPELINE
════════════════════════════════ */
const aiImgEl = document.getElementById('ai-img');
let loopTimer=null;

async function triggerAI(){
  if(generating) return;
  generating=true;
  if(loopTimer){ clearTimeout(loopTimer); loopTimer=null; }

  document.getElementById('btn-ai').className='ibtn pulse';

  // 啟動全畫面白色雜訊
  noisePhase='loading';
  await tick(500);

  // 截 Three.js 畫面（含 shader 效果）
  await new Promise(r=>requestAnimationFrame(r));
  await new Promise(r=>requestAnimationFrame(r));
  const stage1Data=captureStage1();
  await tick(300);

  // 建構 prompt 並發送
  const prompt=buildPrompt();
  const seed=Math.floor(Math.random()*999999);
  // flux text-to-image (base64 as URL param exceeds browser limits → use text only)
  const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}`
    +`?width=768&height=768&nologo=true&seed=${seed}&model=flux`;

  let loadedSrc='';
  await new Promise((resolve,reject)=>{
    aiImgEl.onload=()=>{ loadedSrc=aiImgEl.src; resolve(); };
    aiImgEl.onerror=()=>reject(new Error('LOAD_FAIL'));
    aiImgEl.src=url;
    setTimeout(()=>reject(new Error('TIMEOUT')),42000);
  }).catch(async(e)=>{
    console.warn('AI fail:',e);
    noisePhase='off'; noiseCv.style.opacity='0';
    aiImgEl.src='';
    document.getElementById('btn-ai').className='ibtn';
    generating=false;
    loopTimer=setTimeout(triggerAI,10000);
    throw e;
  });

  // 圖像已載入 → 雜訊開始消退，圖像像素化浮現
  aiImgEl.style.imageRendering='pixelated';
  aiImgEl.style.filter='saturate(0.1) contrast(1.55) brightness(0.5)';
  aiImgEl.style.transition='opacity .5s';
  aiImgEl.style.opacity='0.55';
  noiseBuildStart=Date.now();
  noisePhase='building';
  await tick(400);

  // 5 步銳化
  const steps=[
    {sat:.18,con:1.42,br:.58,op:.65,dur:380},
    {sat:.30,con:1.30,br:.70,op:.72,dur:460},
    {sat:.44,con:1.18,br:.80,op:.78,dur:520},
    {sat:.58,con:1.09,br:.88,op:.85,dur:600},
    {sat:.70,con:1.02,br:.96,op:.95,dur:700},
  ];
  for(const s of steps){
    aiImgEl.style.imageRendering=s.sat>.35?'auto':'pixelated';
    aiImgEl.style.transition=`filter ${s.dur}ms ease, opacity ${s.dur}ms ease`;
    aiImgEl.style.filter=`saturate(${s.sat}) contrast(${s.con}) brightness(${s.br})`;
    aiImgEl.style.opacity=s.op.toString();
    await tick(s.dur);
  }
  aiImgEl.style.imageRendering='auto';

  document.getElementById('btn-ai').className='ibtn on';
  generating=false;

  // 記錄歷史（loadedSrc is the actual loaded URL）
  const recS2 = loadedSrc || aiImgEl.src || '';
  console.log('addRecord s2:', recS2.substring(0,80));
  addRecord(stage1Data||'', recS2, vs.subMode, chaos, entropy);

  // 自動循環
  const hold=Math.round(20000-entropy*8000);
  loopTimer=setTimeout(async()=>{
    aiImgEl.style.transition='opacity 1.8s ease, filter 1.8s ease';
    aiImgEl.style.opacity='0';
    aiImgEl.style.filter='saturate(0) brightness(.2)';
    await tick(2000);
    aiImgEl.src='';
    document.getElementById('btn-ai').className='ibtn';
    await tick(500);
    triggerAI();
  }, hold);
}

function tick(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ════════════════════════════════
   EEG
════════════════════════════════ */
const MS=0xfe8d,MC='273e0001-4c4d-454d-96be-f03bac821358',ME='273e0004-4c4d-454d-96be-f03bac821358';
let mg=null,eb=[];
function fft(re,im){
  const n=re.length;if(n<=1)return;
  const h=n>>1,rE=[],rO=[],iE=[],iO=[];
  for(let i=0;i<h;i++){rE[i]=re[i*2];iE[i]=im[i*2];rO[i]=re[i*2+1];iO[i]=im[i*2+1];}
  fft(rE,iE);fft(rO,iO);
  for(let k=0;k<h;k++){
    const a=-2*Math.PI*k/n,c=Math.cos(a),s=Math.sin(a);
    const tr=c*rO[k]-s*iO[k],ti=s*rO[k]+c*iO[k];
    re[k]=rE[k]+tr;im[k]=iE[k]+ti;re[k+h]=rE[k]-tr;im[k+h]=iE[k]-ti;
  }
}
function procEEG(v){
  const d=new DataView(v.buffer),dec=[];
  for(let i=2;i<d.byteLength-2;i+=3){
    dec.push(((d.getUint8(i)<<4)|(d.getUint8(i+1)>>4))-2048);
    dec.push((((d.getUint8(i+1)&0x0F)<<8)|d.getUint8(i+2))-2048);
  }
  eb.push(...dec);
  if(eb.length>256){
    const sig=eb.slice(-256),re=[...sig],im=new Array(256).fill(0);
    fft(re,im);let aP=0,bP=0;
    const b=hz=>Math.round(hz*256/256);
    for(let i=b(8);i<b(13);i++)aP+=re[i]*re[i]+im[i]*im[i];
    for(let i=b(13);i<b(30);i++)bP+=re[i]*re[i]+im[i]*im[i];
    const tot=aP+bP+1e-6,al=aP/tot,be=bP/tot;
    entropy=.1+al*.9;chaos=.1+be*.9;
    document.getElementById('nc').style.transform=`rotate(${chaos*280-140}deg)`;
    document.getElementById('ne').style.transform=`rotate(${entropy*280-140}deg)`;
    document.getElementById('eeg-hud').innerHTML=
      '<div style="color:rgba(255,255,255,.55);margin-bottom:2px;">&#x2B24; MUSE</div>'+
      '<div>&#945; '+(al*100).toFixed(0)+'%</div>'+
      '<div>&#946; '+(be*100).toFixed(0)+'%</div>';
    eb=eb.slice(-256);
  }
}
document.getElementById('btn-e').addEventListener('click',async()=>{

    const svc=await mg.getPrimaryService(MS),ch=await svc.getCharacteristic(ME);
    await ch.startNotifications();
    ch.addEventListener('characteristicvaluechanged',e=>procEEG(e.target.value));
    const ctrl=await svc.getCharacteristic(MC),enc=new TextEncoder();
    await ctrl.writeValue(enc.encode('v1\n'));await ctrl.writeValue(enc.encode('p21\n'));await ctrl.writeValue(enc.encode('d\n'));
    eegActive=true;document.getElementById('btn-e').className='ibtn slow';
    cw.classList.add('locked');ew.classList.add('locked');
    dev.addEventListener('gattserverdisconnected',()=>{
      eegActive=false;document.getElementById('btn-e').className='ibtn';
      cw.classList.remove('locked');ew.classList.remove('locked');
    });

/* ════════════════════════════════
   KNOBS
════════════════════════════════ */
function mkKnob(kid,nid,get,set){
  const k=document.getElementById(kid);let drag=false,ly=0;
  k.addEventListener('mousedown',e=>{e.stopPropagation();drag=true;ly=e.clientY;k.classList.add('drag');});
  window.addEventListener('mousemove',e=>{if(!drag)return;const v=Math.max(0,Math.min(1,get()+(ly-e.clientY)*.008));set(v);document.getElementById(nid).style.transform=`rotate(${v*280-140}deg)`;ly=e.clientY;});
  window.addEventListener('mouseup',()=>{drag=false;k.classList.remove('drag');});
  k.addEventListener('touchstart',e=>{e.stopPropagation();drag=true;ly=e.touches[0].clientY;k.classList.add('drag');},{passive:false});
  window.addEventListener('touchmove',e=>{if(!drag)return;e.preventDefault();const v=Math.max(0,Math.min(1,get()+(ly-e.touches[0].clientY)*.008));set(v);document.getElementById(nid).style.transform=`rotate(${v*280-140}deg)`;ly=e.touches[0].clientY;},{passive:false});
  window.addEventListener('touchend',()=>{drag=false;k.classList.remove('drag');});
}
mkKnob('kc','nc',()=>chaos,v=>chaos=v);
mkKnob('ke','ne',()=>entropy,v=>entropy=v);

/* ════════════════════════════════
   THREE.JS
════════════════════════════════ */
async function initThree(){
  const video=document.getElementById('video');
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:"user"}});
    video.srcObject=s;await video.play();
  }catch(e){console.warn('cam',e);}

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
  camera.position.z=110;
  // preserveDrawingBuffer 讓截圖可用
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  document.getElementById('container').appendChild(renderer.domElement);
  videoTex=new THREE.VideoTexture(video);

  shaderMat=new THREE.ShaderMaterial({
    uniforms:{tDiffuse:{value:videoTex},subMode:{value:0},time:{value:0},chaos:{value:.5},transition:{value:1.0}},
    vertexShader:`
      varying vec2 vUv;uniform float time,chaos;
      void main(){
        vUv=uv;vec3 p=position;
        p.z+=sin(time*1.1+(p.x+p.y)*.06)*(4.5+chaos*16.);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);
      }`,
    fragmentShader:`
      uniform sampler2D tDiffuse;uniform int subMode;
      uniform float time,chaos,transition;varying vec2 vUv;
      void main(){
        vec2 uv=vUv;
        if(chaos>.1){float d=distance(uv,vec2(.5));uv.x+=sin(d*12.-time*1.5)*.025*chaos;uv.y+=cos(d*12.-time*1.5)*.025*chaos;}
        if(subMode==3)uv.x=abs(uv.x-.5)+.25;
        if(subMode==4){float sz=65.-chaos*50.;uv=floor(uv*sz)/sz;}
        vec4 fc;
        if(subMode==5){float sh=.03*chaos;fc=vec4(texture2D(tDiffuse,uv+vec2(sh,0)).r,texture2D(tDiffuse,uv).g,texture2D(tDiffuse,uv-vec2(sh,0)).b,1.);}
        else fc=texture2D(tDiffuse,uv);
        float l=dot(fc.rgb,vec3(.299,.587,.114));
        if(subMode==0){fc.rgb=mix(vec3(.05),vec3(.7,.85,1.),l);if(l>.55)fc.rgb=mix(fc.rgb,vec3(1.),(l-.55)*2.5);}
        else if(subMode==1){fc=vec4(vec3(fwidth(l)*(18.+chaos*25.)),1.);}
        else if(subMode==2){fc.rgb=(vec3(1.)-fc.rgb)*vec3(.9,.95,1.);}
        gl_FragColor=fc*transition;
      }`,
    transparent:true
  });

  mesh=new THREE.Mesh(new THREE.PlaneBufferGeometry(235,175,128,128),shaderMat);
  scene.add(mesh);

  particles=new THREE.Group();
  const geos=[
    new THREE.TorusKnotBufferGeometry(5,.1,32,8),
    new THREE.OctahedronBufferGeometry(8,1),
    new THREE.SphereBufferGeometry(8,16,12),
    new THREE.CylinderBufferGeometry(4,4,12,8,1),
  ];
  const scales=[1.8,1.3,1.0,.5];
  for(let i=0;i<80;i++){
    const p=new THREE.Mesh(geos[i%geos.length],shaderMat);
    const s=scales[Math.floor(Math.random()*scales.length)];
    p.scale.set(s,s,s);
    p.position.set((Math.random()-.5)*220,(Math.random()-.5)*160,(Math.random()-.5)*20);
    p.userData={origin:p.position.clone(),v:new THREE.Vector3(),noise:Math.random()*100};
    particles.add(p);
  }
  scene.add(particles);
  liquidWeb=new THREE.LineSegments(new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({color:0x555555,transparent:true,opacity:.07}));
  scene.add(liquidWeb);

  setTimeout(triggerAI,6000);
  animate();
}

/* ════════════════════════════════
   MOTION TRACKING
════════════════════════════════ */
let tf=0;
function updateTracking(){
  tf++;if(tf%8!==0||vs.interacting)return;
  const v=document.getElementById('video'),c=document.getElementById('mc');
  if(!v||v.readyState<2)return;
  const ctx=c.getContext('2d');
  ctx.drawImage(v,0,0,c.width,c.height);
  const curr=ctx.getImageData(0,0,c.width,c.height);
  if(prevFrame){
    let tx=0,ty=0,cnt=0;
    for(let i=0;i<curr.data.length;i+=4){
      const d=(Math.abs(curr.data[i]-prevFrame.data[i])+Math.abs(curr.data[i+1]-prevFrame.data[i+1])+Math.abs(curr.data[i+2]-prevFrame.data[i+2]))/3;
      if(d>26){const idx=i/4;tx+=idx%c.width;ty+=Math.floor(idx/c.width);cnt++;}
    }
    if(cnt>25){
      let nx=1-(tx/cnt/c.width);nx=Math.max(0,Math.min(1,(nx-.05)/.9));
      vs.tx=nx*innerWidth;vs.ty=(ty/cnt/c.height)*innerHeight;
      document.getElementById('cur').classList.add('on');
    }else document.getElementById('cur').classList.remove('on');
  }
  if(!prevFrame)prevFrame=new ImageData(curr.width,curr.height);
  prevFrame.data.set(curr.data);
}

/* ════════════════════════════════
   MAIN LOOP
════════════════════════════════ */
function animate(){
  requestAnimationFrame(animate);
  const t=Date.now()*.001;
  if(!shaderMat)return;

  shaderMat.uniforms.time.value=t;
  shaderMat.uniforms.chaos.value=chaos;
  vs.trans+=(vs.tTrans-vs.trans)*.12;
  shaderMat.uniforms.transition.value=vs.trans;

  if(noisePhase!=='off') drawNoise();
  updateTracking();

  vs.cx+=(vs.tx-vs.cx)*.15;vs.cy+=(vs.ty-vs.cy)*.15;
  document.getElementById('cur').style.left=vs.cx+'px';
  document.getElementById('cur').style.top=vs.cy+'px';

  const wm=new THREE.Vector3(((vs.cx/innerWidth)*2-1)*115,-((vs.cy/innerHeight)*2-1)*85,10);
  if(mesh){
    const arr=mesh.geometry.attributes.position.array;
    for(let i=0;i<arr.length;i+=3){
      const dist=Math.sqrt((arr[i]-wm.x)**2+(arr[i+1]-wm.y)**2);
      let z=Math.sin(t*1.2+(arr[i]+arr[i+1])*.04)*(4.5+chaos*10);
      if(dist<100)z+=(100-dist)*(.6+chaos*2.5);
      arr[i+2]=z;
    }
    mesh.geometry.attributes.position.needsUpdate=true;
  }
  const pts=[];
  particles.children.forEach(p=>{
    const ud=p.userData,tg=ud.origin.clone();
    tg.x+=Math.sin(t*(.35+chaos*1.3)+ud.noise)*(42*chaos);
    tg.y+=Math.cos(t*.85*(.35+chaos*1.3)+ud.noise)*(42*chaos);
    const dist=p.position.distanceTo(wm);
    if(dist<88){
      ud.v.add(new THREE.Vector3().subVectors(p.position,wm).normalize().multiplyScalar((1-dist/88)*(3.5+chaos*9)));
      if(Math.random()>.85)pts.push(p.position.x,p.position.y,p.position.z,wm.x,wm.y,wm.z);
    }
    ud.v.add(new THREE.Vector3().subVectors(tg,p.position).multiplyScalar(.025));
    ud.v.multiplyScalar(.86-chaos*.12);
    p.position.add(ud.v);p.rotation.x+=ud.v.length()*.07;
  });
  liquidWeb.geometry.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  liquidWeb.geometry.attributes.position.needsUpdate=true;

  const ct=8000/(.35+entropy*1.8);
  if(Date.now()-vs.lastSwitch>ct){
    vs.tTrans=.1;
    setTimeout(()=>{
      vs.modeCount=(vs.modeCount+1)%6;vs.subMode=vs.modeCount;
      shaderMat.uniforms.subMode.value=vs.subMode;vs.tTrans=1.0;
    },400);
    vs.lastSwitch=Date.now();
  }
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  if(camera&&renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
  resizeNoise();
});
function onP(x,y){vs.interacting=true;vs.tx=x;vs.ty=y;}
const cont=document.getElementById('container');
cont.addEventListener('mousedown',e=>onP(e.clientX,e.clientY));
cont.addEventListener('mousemove',e=>{if(e.buttons>0)onP(e.clientX,e.clientY);});
cont.addEventListener('mouseup',()=>vs.interacting=false);
cont.addEventListener('touchstart',e=>onP(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
cont.addEventListener('touchmove', e=>onP(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
cont.addEventListener('touchend',()=>vs.interacting=false);

window.onload=initThree;
</script>
