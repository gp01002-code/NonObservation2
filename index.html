<script>
let chaos = 0.5, entropy = 0.4;
let eegActive = false;
let scene, camera, renderer, shaderMat, mesh, particles, liquidWeb, videoTexture;
let prevFrame = null;

const state = {
  targetX: window.innerWidth/2, targetY: window.innerHeight/2,
  currentX: window.innerWidth/2, currentY: window.innerHeight/2,
  lastSwitch: Date.now(), transition: 1, targetTransition: 1,
  isInteracting: false, subMode: 0, modeCounter: 0, phasePair: 1,
};

// ── Firebase（try/catch：未填設定時不阻斷畫面）──────────────

try {
  firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  auth.onAuthStateChanged(user => {

      tag.textContent = '數據持續標記: ' + user.uid.substring(0,14).toUpperCase();

      btn.classList.remove('active-blue');
      tag.style.display = 'none';
    }
  });
} catch(e) { console.warn('Firebase 未設定，略過登入功能', e); }

document.getElementById('btn-google').addEventListener('click', async () => {
  if (!auth) return;
  try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); } catch(e) {}
});

// ── EEG ──────────────────────────────────────────────────────
const MUSE_SERVICE      = 0xfe8d;
const MUSE_CONTROL_CHAR = '273e0001-4c4d-454d-96be-f03bac821358';
const MUSE_EEG_CH_AF7   = '273e0004-4c4d-454d-96be-f03bac821358';
let museGatt = null, eegBuf = [];

function fft(re, im) {
  const n = re.length; if (n <= 1) return;
  const h = n >> 1;
  const reE=[],reO=[],imE=[],imO=[];
  for(let i=0;i<h;i++){ reE[i]=re[i*2]; imE[i]=im[i*2]; reO[i]=re[i*2+1]; imO[i]=im[i*2+1]; }
  fft(reE,imE); fft(reO,imO);
  for(let k=0;k<h;k++){
    const a=-2*Math.PI*k/n, c=Math.cos(a), s=Math.sin(a);
    const tr=c*reO[k]-s*imO[k], ti=s*reO[k]+c*imO[k];
    re[k]=reE[k]+tr; im[k]=imE[k]+ti; re[k+h]=reE[k]-tr; im[k+h]=imE[k]-ti;
  }
}

function processEEG(value) {
  const data = new DataView(value.buffer);
  const decoded = [];
  for(let i=2; i<data.byteLength-2; i+=3){
    decoded.push(((data.getUint8(i)<<4)|(data.getUint8(i+1)>>4))-2048);
    decoded.push((((data.getUint8(i+1)&0x0F)<<8)|data.getUint8(i+2))-2048);
  }
  eegBuf.push(...decoded);
  if(eegBuf.length > 256){
    const sig = eegBuf.slice(-256);
    const re = [...sig], im = new Array(256).fill(0);
    fft(re, im);
    let aP=0, bP=0;
    const hzToBin = hz => Math.round(hz*256/256);
    for(let i=hzToBin(8);  i<hzToBin(13); i++) aP += re[i]*re[i]+im[i]*im[i];
    for(let i=hzToBin(13); i<hzToBin(30); i++) bP += re[i]*re[i]+im[i]*im[i];
    const tot = aP+bP+1e-6;
    const alpha = aP/tot, beta = bP/tot;
    entropy = 0.1+alpha*0.9; chaos = 0.1+beta*0.9;
    updateNeedle('needle-entropy', entropy);
    updateNeedle('needle-chaos', chaos);
    document.getElementById('eeg-hud').innerHTML =
      '<div style="color:#4ade80;margin-bottom:2px;">&#x2B24; MUSE LIVE</div>'+
      '<div>&#945;_RELAX: '+(alpha*100).toFixed(0)+'%</div>'+
      '<div>&#946;_FOCUS : '+(beta*100).toFixed(0)+'%</div>';
    eegBuf = eegBuf.slice(-256);
  }
}

document.getElementById('btn-eeg').addEventListener('click', async () => {
  const cw = document.getElementById('wrap-chaos');
  const ew = document.getElementById('wrap-entropy');
  if(eegActive){
    if(museGatt) museGatt.disconnect();
    eegActive = false;
    document.getElementById('btn-eeg').classList.remove('active-green');
    document.getElementById('eeg-hud').textContent = '— 未連線';
    cw.classList.remove('locked'); ew.classList.remove('locked');
    return;
  }
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters:[{services:[MUSE_SERVICE]}], optionalServices:[MUSE_SERVICE]
    });
    museGatt = await device.gatt.connect();
    const svc  = await museGatt.getPrimaryService(MUSE_SERVICE);
    const char = await svc.getCharacteristic(MUSE_EEG_CH_AF7);
    await char.startNotifications();
    char.addEventListener('characteristicvaluechanged', e => processEEG(e.target.value));
    const ctrl = await svc.getCharacteristic(MUSE_CONTROL_CHAR);
    const enc  = new TextEncoder();
    await ctrl.writeValue(enc.encode('v1\n'));
    await ctrl.writeValue(enc.encode('p21\n'));
    await ctrl.writeValue(enc.encode('d\n'));
    eegActive = true;
    document.getElementById('btn-eeg').classList.add('active-green');
    cw.classList.add('locked'); ew.classList.add('locked');
    device.addEventListener('gattserverdisconnected', () => {
      eegActive = false;
      document.getElementById('btn-eeg').classList.remove('active-green');
      cw.classList.remove('locked'); ew.classList.remove('locked');
    });
  } catch(e){ console.error("EEG Link Fail", e); }
});

// ── 旋鈕 ──────────────────────────────────────────────────────
function updateNeedle(id, val){
  const el = document.getElementById(id);
  if(el) el.style.transform = 'rotate('+(val*280-140)+'deg)';
}
function makeKnob(knobId, needleId, getter, setter){
  const knob = document.getElementById(knobId);
  let dragging=false, lastY=0;
  const start = y => { if(eegActive) return; dragging=true; lastY=y; knob.classList.add('dragging'); };
  const move  = y => {
    if(!dragging||eegActive) return;
    const nv = Math.max(0,Math.min(1, getter()+(lastY-y)*0.008));
    setter(nv); updateNeedle(needleId,nv); lastY=y;
  };
  const end = () => { dragging=false; knob.classList.remove('dragging'); };
  knob.addEventListener('mousedown',  e => { e.stopPropagation(); start(e.clientY); });
  window.addEventListener('mousemove', e => move(e.clientY));
  window.addEventListener('mouseup',   end);
  knob.addEventListener('touchstart',  e => { e.stopPropagation(); start(e.touches[0].clientY); }, {passive:false});
  window.addEventListener('touchmove', e => { if(dragging){ e.preventDefault(); move(e.touches[0].clientY); } }, {passive:false});
  window.addEventListener('touchend',  end);
}
makeKnob('knob-chaos',   'needle-chaos',   () => chaos,   v => chaos=v);
makeKnob('knob-entropy', 'needle-entropy', () => entropy, v => entropy=v);

// ── Three.js ──────────────────────────────────────────────────
async function initThree(){
  const video = document.getElementById('video');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ width:640, height:480, facingMode:"user" } });
    video.srcObject = stream;
    await video.play();
  } catch(e){ console.error("Camera fail", e); }

  scene  = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 110;
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('container').appendChild(renderer.domElement);

  videoTexture = new THREE.VideoTexture(video);

  // 背景與粒子共用 shaderMat → 粒子映照自動與背景濾鏡同步
  shaderMat = new THREE.ShaderMaterial({
    uniforms:{
      tDiffuse:{value:videoTexture}, phasePair:{value:1},
      subMode:{value:0}, time:{value:0}, chaos:{value:0.5}, transition:{value:1.0}
    },
    vertexShader:`
      varying vec2 vUv; uniform float time; uniform float chaos;
      void main(){
        vUv = uv; vec3 pos = position;
        float wave = sin(time*(1.1+chaos*1.5)+(pos.x*0.06+pos.y*0.06))*(chaos*20.0);
        pos.z += wave;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
      }
    `,
    fragmentShader:`
      uniform sampler2D tDiffuse; uniform int phasePair; uniform int subMode;
      uniform float time; uniform float chaos; uniform float transition;
      varying vec2 vUv;
      void main(){
        vec2 uv = vUv;
        if(chaos>0.1){
          float d = distance(uv,vec2(0.5));
          uv.x += sin(d*12.0-time*1.5)*0.025*chaos;
          uv.y += cos(d*12.0-time*1.5)*0.025*chaos;
        }
        vec4 finalCol;
        if(subMode==3) uv.x = abs(uv.x-0.5)+0.25;
        if(subMode==4){ float size=60.0-(chaos*50.0); uv=floor(uv*size)/size; }
        if(subMode==5){
          float shift=0.03*chaos;
          finalCol=vec4(texture2D(tDiffuse,uv+vec2(shift,0.0)).r,
                        texture2D(tDiffuse,uv).g,
                        texture2D(tDiffuse,uv-vec2(shift,0.0)).b,1.0);
        } else finalCol=texture2D(tDiffuse,uv);
        float luma=dot(finalCol.rgb,vec3(0.299,0.587,0.114));
        if(subMode==0){
          vec3 col=mix(vec3(0.05),vec3(0.7,0.85,1.0),luma);
          if(luma>0.55) col=mix(col,vec3(1.0),(luma-0.55)*2.5);
          finalCol=vec4(col,1.0);
        } else if(subMode==1)
          finalCol=vec4(vec3(fwidth(luma)*(18.0+chaos*25.0)),1.0);
        else if(subMode==2){
          finalCol.rgb=vec3(1.0)-finalCol.rgb;
          finalCol.rgb*=vec3(0.9,0.95,1.0);
        }
        gl_FragColor=finalCol*transition;
      }
    `,
    transparent:true
  });

  mesh = new THREE.Mesh(new THREE.PlaneBufferGeometry(235,175,128,128), shaderMat);
  scene.add(mesh);

  particles = new THREE.Group();
  const cols=15, rows=12, pw=230/cols, ph=170/rows;
  const geos = [
    new THREE.TorusKnotBufferGeometry(pw/3.6, 0.1, 32, 8),
    new THREE.OctahedronBufferGeometry(pw/2.1, 1),
    new THREE.CylinderBufferGeometry(pw/4.5, pw/4.5, ph*0.8, 8, 1),
    new THREE.SphereBufferGeometry(pw/2.2, 16, 12),
  ];
  const sizeScales = [1.8, 1.3, 1.0, 0.5];
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    const geo   = geos[Math.floor(Math.random()*geos.length)];
    const p     = new THREE.Mesh(geo, shaderMat);
    const scale = sizeScales[Math.floor(Math.random()*sizeScales.length)];
    p.scale.set(scale,scale,scale);
    p.position.set(i*pw-115+pw/2, j*ph-85+ph/2, (Math.random()-.5)*20);
    p.userData = { origin:p.position.clone(), v:new THREE.Vector3(), noise:Math.random()*100 };
    particles.add(p);
  }
  scene.add(particles);

  liquidWeb = new THREE.LineSegments(
    new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ color:0x444444, transparent:true, opacity:0.08 })
  );
  scene.add(liquidWeb);
  animate();
}

function updateTracking(){
  if(state.isInteracting) return;
  const video=document.getElementById('video'), canvas=document.getElementById('motion-canvas');
  if(!video||video.readyState<2) return;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const curr=ctx.getImageData(0,0,canvas.width,canvas.height);
  if(prevFrame){
    let tx=0,ty=0,count=0;
    for(let i=0;i<curr.data.length;i+=4){
      const diff=(Math.abs(curr.data[i]-prevFrame.data[i])+Math.abs(curr.data[i+1]-prevFrame.data[i+1])+Math.abs(curr.data[i+2]-prevFrame.data[i+2]))/3;
      if(diff>26){ const idx=i/4; tx+=idx%canvas.width; ty+=Math.floor(idx/canvas.width); count++; }
    }
    if(count>25){
      let nx=1.0-(tx/count/canvas.width);
      nx=Math.max(0,Math.min(1,(nx-0.05)/0.9));
      state.targetX=nx*window.innerWidth;
      state.targetY=(ty/count/canvas.height)*window.innerHeight;
      document.getElementById('cursor-el').classList.add('detecting');
    } else { document.getElementById('cursor-el').classList.remove('detecting'); }
  }
  if(!prevFrame) prevFrame=new ImageData(curr.width,curr.height);
  prevFrame.data.set(curr.data);
}

function animate(){
  requestAnimationFrame(animate);
  const time=Date.now()*0.001;
  if(!shaderMat) return;

  shaderMat.uniforms.time.value=time;
  shaderMat.uniforms.chaos.value=chaos;
  state.transition+=(state.targetTransition-state.transition)*0.12;
  shaderMat.uniforms.transition.value=state.transition;

  updateTracking();

  const crt=document.getElementById('crt-overlay');
  if(crt) crt.style.opacity=(0.7+Math.sin(time*50)*0.02*entropy).toString();

  state.currentX+=(state.targetX-state.currentX)*0.22;
  state.currentY+=(state.targetY-state.currentY)*0.22;
  document.getElementById('cursor-el').style.left=state.currentX+'px';
  document.getElementById('cursor-el').style.top=state.currentY+'px';

  const cycleTime=8000/(0.35+entropy*1.8);
  if(Date.now()-state.lastSwitch>cycleTime){
    state.targetTransition=0.1;
    setTimeout(()=>{
      state.modeCounter=(state.modeCounter+1)%6; state.subMode=state.modeCounter;
      state.phasePair=Math.floor(Math.random()*3)+1;
      shaderMat.uniforms.subMode.value=state.subMode;
      shaderMat.uniforms.phasePair.value=state.phasePair;
      mesh.visible=(state.phasePair===1||state.phasePair===3);
      particles.visible=(state.phasePair===2||state.phasePair===3);
      state.targetTransition=1.0;
    },400);
    state.lastSwitch=Date.now();
  }

  const wm=new THREE.Vector3(
    ((state.currentX/window.innerWidth)*2-1)*115,
    -((state.currentY/window.innerHeight)*2-1)*85, 10
  );

  if(mesh.visible){
    const arr=mesh.geometry.attributes.position.array;
    for(let i=0;i<arr.length;i+=3){
      const dist=Math.sqrt((arr[i]-wm.x)**2+(arr[i+1]-wm.y)**2);
      const jitter=(Math.random()-0.5)*entropy*2.0;
      let z=Math.sin(time*1.2+(arr[i]+arr[i+1])*0.04)*(4.5+chaos*8.0)+jitter;
      if(dist<100) z+=(100-dist)*(0.6+chaos*1.8);
      arr[i+2]=z;
    }
    mesh.geometry.attributes.position.needsUpdate=true;
  }

  if(particles.visible){
    const pts=[];
    particles.children.forEach(p=>{
      const ud=p.userData;
      let target=ud.origin.clone();
      target.x+=Math.sin(time*(0.35+chaos*1.3)+ud.noise)*(42*chaos);
      target.y+=Math.cos(time*0.85*(0.35+chaos*1.3)+ud.noise)*(42*chaos);
      const dist=p.position.distanceTo(wm);
      if(dist<88){
        ud.v.add(new THREE.Vector3().subVectors(p.position,wm).normalize().multiplyScalar((1-dist/88)*(3.5+chaos*9.0)));
        if(Math.random()>0.85) pts.push(p.position.x,p.position.y,p.position.z,wm.x,wm.y,wm.z);
      }
      ud.v.add(new THREE.Vector3().subVectors(target,p.position).multiplyScalar(0.025));
      ud.v.multiplyScalar(0.86-chaos*0.12);
      p.position.add(ud.v);
      p.rotation.x+=ud.v.length()*0.07;
    });
    liquidWeb.geometry.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
    liquidWeb.geometry.attributes.position.needsUpdate=true;
  }
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  if(camera&&renderer){
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  }
});

function onInteract(cx,cy){ state.isInteracting=true; state.targetX=cx; state.targetY=cy; }
const container=document.getElementById('container');
container.addEventListener('mousedown',  e=>onInteract(e.clientX,e.clientY));
container.addEventListener('mousemove',  e=>{ if(e.buttons>0) onInteract(e.clientX,e.clientY); });
container.addEventListener('mouseup',    ()=>state.isInteracting=false);
container.addEventListener('touchstart', e=>onInteract(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
