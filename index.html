// ══════════════════════════════════════════════════════════════
//  EEG 真實連線 — Muse 2 / Muse S (Web Bluetooth)
//  Alpha (8-13Hz) 高 → 放鬆 → entropy ↑
//  Beta  (13-30Hz) 高 → 緊繃 → chaos  ↑
// ══════════════════════════════════════════════════════════════

// ── Muse BLE 常數 ─────────────────────────────────────────────
const MUSE_SERVICE      = 0xfe8d;
const MUSE_CONTROL_CHAR = '273e0001-4c4d-454d-96be-f03bac821358';
const MUSE_EEG_CHARS    = [
  '273e0003-4c4d-454d-96be-f03bac821358', // TP9
  '273e0004-4c4d-454d-96be-f03bac821358', // AF7  ← 主分析通道
  '273e0005-4c4d-454d-96be-f03bac821358', // AF8
  '273e0006-4c4d-454d-96be-f03bac821358', // TP10
];

// ── DSP 參數 ──────────────────────────────────────────────────
const EEG_SR   = 256;   // 取樣率 Hz
const FFT_N    = 256;   // FFT 窗口大小
const SMOOTH   = 0.88;  // 平滑係數

function hzBin(hz){ return Math.round(hz * FFT_N / EEG_SR); }
const A_LO = hzBin(8),  A_HI = hzBin(13);  // Alpha
const B_LO = hzBin(13), B_HI = hzBin(30);  // Beta

// ── 狀態 ─────────────────────────────────────────────────────
let museGatt   = null;
let eegBufs    = [[],[],[],[]];
let sAlpha     = 0.5, sBeta = 0.5;
let eegStatus  = '未連線';

// ── 簡易 Cooley–Tukey FFT ─────────────────────────────────────
function fft(re, im) {
  const n = re.length;
  if (n <= 1) return;
  const h = n >> 1;
  const reE=[],reO=[],imE=[],imO=[];
  for(let i=0;i<h;i++){
    reE[i]=re[i*2]; imE[i]=im[i*2];
    reO[i]=re[i*2+1]; imO[i]=im[i*2+1];
  }
  fft(reE,imE); fft(reO,imO);
  for(let k=0;k<h;k++){
    const a=-2*Math.PI*k/n;
    const c=Math.cos(a), s=Math.sin(a);
    const tr=c*reO[k]-s*imO[k], ti=s*reO[k]+c*imO[k];
    re[k]=reE[k]+tr; im[k]=imE[k]+ti;
    re[k+h]=reE[k]-tr; im[k+h]=imE[k]-ti;
  }
}

function bandPower(sig, lo, hi) {
  const re=new Array(FFT_N).fill(0), im=new Array(FFT_N).fill(0);
  const st=Math.max(0,sig.length-FFT_N);
  for(let i=0;i<FFT_N&&i<sig.length-st;i++) re[i]=sig[st+i];
  fft(re,im);
  let p=0;
  for(let i=lo;i<hi;i++) p+=re[i]*re[i]+im[i]*im[i];
  return p/(hi-lo);
}

// ── 解碼 Muse 12-bit EEG 封包 ────────────────────────────────
function decodeMuseEEG(data) {
  const out=[];
  let i=2;
  while(i+2<data.byteLength){
    const b0=data.getUint8(i),b1=data.getUint8(i+1),b2=data.getUint8(i+2);
    out.push(((b0<<4)|(b1>>4))-2048);
    out.push((((b1&0x0F)<<8)|b2)-2048);
    i+=3;
  }
  return out;
}

// ── 處理每幀 EEG 數據 ─────────────────────────────────────────
function processEEG(ch, data) {
  const s = decodeMuseEEG(data);
  eegBufs[ch].push(...s);
  const MAX = FFT_N * 4;
  if(eegBufs[ch].length > MAX) eegBufs[ch].splice(0, eegBufs[ch].length-MAX);

  // 僅用 AF7 (ch=1) 做頻帶分析
  if(ch!==1 || eegBufs[1].length<FFT_N) return;

  const alpha = bandPower(eegBufs[1], A_LO, A_HI);
  const beta  = bandPower(eegBufs[1], B_LO, B_HI);
  const tot   = alpha + beta + 1e-9;

  sAlpha = sAlpha*SMOOTH + (alpha/tot)*(1-SMOOTH);
  sBeta  = sBeta *SMOOTH + (beta /tot)*(1-SMOOTH);

  // 映射 → chaos / entropy（連線中停用手動旋鈕覆蓋）
  entropy = Math.max(0.1, Math.min(1, sAlpha * 2.5));
  chaos   = Math.max(0.1, Math.min(1, sBeta  * 3.0));
  updateNeedle('needle-entropy', entropy);
  updateNeedle('needle-chaos',   chaos);

  // 更新 HUD
  updateEEGHud();
}

// ── HUD 更新 ─────────────────────────────────────────────────
function updateEEGHud() {
  const el = document.getElementById('eeg-hud');
  if(!el) return;
  el.innerHTML =
    `<div style="color:rgba(74,222,128,.9);margin-bottom:4px;">⬤ MUSE LIVE</div>` +
    `<div>α ${(sAlpha*100).toFixed(0).padStart(3)} %  <span style="color:#60a5fa">→ entropy</span></div>` +
    `<div>β ${(sBeta *100).toFixed(0).padStart(3)} %  <span style="color:#f87171">→ chaos</span></div>`;
}

// ── 啟動 Muse 串流指令 ────────────────────────────────────────
async function startMuseStream(svc) {
  const ctrl = await svc.getCharacteristic(MUSE_CONTROL_CHAR);
  const enc  = new TextEncoder();
  await ctrl.writeValue(enc.encode('v1\n'));
  await new Promise(r=>setTimeout(r,200));
  await ctrl.writeValue(enc.encode('p21\n'));
  await new Promise(r=>setTimeout(r,200));
  await ctrl.writeValue(enc.encode('d\n'));
}

// ── 主連線 ────────────────────────────────────────────────────
async function connectMuse() {
  const btn = document.getElementById('btn-eeg');
  const hud = document.getElementById('eeg-hud');
  if(hud) hud.innerHTML = `<div style="color:#facc15;">⏳ 搜尋中…</div>`;

  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [MUSE_SERVICE] }],
      optionalServices: [MUSE_SERVICE],
    });

    device.addEventListener('gattserverdisconnected', () => {
      eegActive = false;
      museGatt  = null;
      eegBufs   = [[],[],[],[]];
      btn.classList.remove('active-green');
      const h = document.getElementById('eeg-hud');
      if(h) h.innerHTML = `<div style="color:#f87171;">✕ 已斷線</div>`;
      console.log('Muse 斷線');
    });

    museGatt = await device.gatt.connect();
    const svc = await museGatt.getPrimaryService(MUSE_SERVICE);

    for(let ch=0; ch<MUSE_EEG_CHARS.length; ch++){
      const c = await svc.getCharacteristic(MUSE_EEG_CHARS[ch]);
      await c.startNotifications();
      c.addEventListener('characteristicvaluechanged', e => processEEG(ch, e.target.value));
    }

    await startMuseStream(svc);

    eegActive = true;
    btn.classList.add('active-green');
    console.log('✓ Muse 連線成功');
    updateEEGHud();

  } catch(err) {
    eegActive = false;
    museGatt  = null;
    btn.classList.remove('active-green');
    const h = document.getElementById('eeg-hud');
    if(h) h.innerHTML = `<div style="color:#f87171;">✕ ${err.message}</div>`;
    console.error('EEG 連線失敗:', err.message);
  }
}

// ── 斷線 ─────────────────────────────────────────────────────
function disconnectMuse() {
  if(museGatt?.connected) museGatt.disconnect();
  eegActive = false; museGatt = null; eegBufs = [[],[],[],[]];
  document.getElementById('btn-eeg').classList.remove('active-green');
  const h = document.getElementById('eeg-hud');
  if(h) h.innerHTML = `<div style="color:rgba(255,255,255,.3);">— 未連線</div>`;
}

// ── 按鈕事件 ─────────────────────────────────────────────────
document.getElementById('btn-eeg').addEventListener('click', () => {
  if (!navigator.bluetooth) {
    alert('此瀏覽器不支援 Web Bluetooth\n請使用 Chrome（桌面版）');
    return;
  }
  eegActive ? disconnectMuse() : connectMuse();
});

// ══════════════════════════════════════════════════════════════
//  旋鈕邏輯
// ══════════════════════════════════════════════════════════════
function updateNeedle(id, val) {
  document.getElementById(id).style.transform = `rotate(${val*280-140}deg)`;
}
updateNeedle('needle-chaos',   chaos);
updateNeedle('needle-entropy', entropy);

function makeKnob(knobId, needleId, getter, setter) {
  const knob = document.getElementById(knobId);
  let dragging = false, lastY = 0;

  const start = y => { dragging = true; lastY = y; knob.classList.add('dragging'); };
  const move  = y => {
    if (!dragging) return;
    const delta = lastY - y;
    const nv = Math.max(0, Math.min(1, getter() + delta * 0.008));
    setter(nv);
    updateNeedle(needleId, nv);
    lastY = y;
  };
  const end = () => { dragging = false; knob.classList.remove('dragging'); };

  knob.addEventListener('mousedown',  e => start(e.clientY));
  knob.addEventListener('touchstart', e => start(e.touches[0].clientY), {passive:true});
  window.addEventListener('mousemove',  e => move(e.clientY));
  window.addEventListener('touchmove',  e => move(e.touches[0].clientY), {passive:true});
  window.addEventListener('mouseup',  end);
  window.addEventListener('touchend', end);
}

makeKnob('knob-chaos',   'needle-chaos',   () => chaos,   v => chaos   = v);
makeKnob('knob-entropy', 'needle-entropy', () => entropy, v => entropy = v);

// ══════════════════════════════════════════════════════════════
//  Three.js 引擎
// ══════════════════════════════════════════════════════════════
const container    = document.getElementById('container');
const video        = document.getElementById('video');
const motionCanvas = document.getElementById('motion-canvas');
const cursorEl     = document.getElementById('cursor-el');
let prevFrame = null;

// 鏡頭
(async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width:640, height:480, facingMode:"user" }
    });
    video.srcObject = stream;
    await video.play();
  } catch(e) { console.error("Camera fail", e); }
})();

// Scene
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.z = 110;

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const videoTexture = new THREE.VideoTexture(video);

// Shader 材質
const shaderMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse:  { value: videoTexture },
    phasePair: { value: 1 },
    subMode:   { value: 0 },
    time:      { value: 0 },
    chaos:     { value: 0.5 },
    transition:{ value: 1.0 },
  },
  vertexShader: `
    varying vec2 vUv;
    uniform float time;
    uniform float chaos;
    void main() {
      vUv = uv;
      vec3 pos = position;
      float wave = sin(time*(1.1+chaos*1.5)+(pos.x*0.06+pos.y*0.06))*(chaos*20.0);
      pos.z += wave;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos,1.0);
    }
  `,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform int phasePair;
    uniform int subMode;
    uniform float time;
    uniform float chaos;
    uniform float transition;
    varying vec2 vUv;
    void main() {
      vec2 uv = vUv;
      if(chaos>0.1){
        float d = distance(uv,vec2(0.5));
        uv.x += sin(d*12.0-time*1.5)*0.025*chaos;
        uv.y += cos(d*12.0-time*1.5)*0.025*chaos;
      }
      vec4 finalCol;
      if(subMode==3) uv.x = abs(uv.x-0.5)+0.25;
      if(subMode==4){
        float size = 60.0-(chaos*50.0);
        uv = floor(uv*size)/size;
      }
      if(subMode==5){
        float shift = 0.03*chaos;
        float r = texture2D(tDiffuse,uv+vec2(shift,0.0)).r;
        float g = texture2D(tDiffuse,uv).g;
        float b = texture2D(tDiffuse,uv-vec2(shift,0.0)).b;
        finalCol = vec4(r,g,b,1.0);
      } else {
        finalCol = texture2D(tDiffuse,uv);
      }
      float luma = dot(finalCol.rgb,vec3(0.299,0.587,0.114));
      if(subMode==0){
        vec3 col = mix(vec3(0.05),vec3(0.7,0.85,1.0),luma);
        if(luma>0.55) col = mix(col,vec3(1.0),(luma-0.55)*2.5);
        finalCol = vec4(col,1.0);
      } else if(subMode==1){
        float edge = fwidth(luma)*(18.0+chaos*25.0);
        finalCol = vec4(vec3(edge),1.0);
      } else if(subMode==2){
        finalCol.rgb = vec3(1.0)-finalCol.rgb;
        finalCol.rgb *= vec3(0.9,0.95,1.0);
      }
      gl_FragColor = finalCol*transition;
    }
  `,
  transparent: true
});

// 背景平面
const mesh = new THREE.Mesh(
  new THREE.PlaneBufferGeometry(235, 175, 128, 128),
  shaderMat
);
scene.add(mesh);

// 粒子幾何群
const particles = new THREE.Group();
const cols=15, rows=12, pw=230/cols, ph=170/rows;
const geos = [
  new THREE.TorusKnotBufferGeometry(pw/3.6,0.1,32,8),
  new THREE.OctahedronBufferGeometry(pw/2.1,1),
  new THREE.CylinderBufferGeometry(pw/4.5,pw/4.5,ph*0.8,8,1),
  new THREE.SphereBufferGeometry(pw/2.2,16,12),
];
for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
  const p = new THREE.Mesh(
    geos[Math.floor(Math.random()*geos.length)],
    new THREE.MeshBasicMaterial({ map:videoTexture, transparent:true, opacity:0.92, color:0xFFFFFF })
  );
  p.position.set(i*pw-115+pw/2, j*ph-85+ph/2, (Math.random()-.5)*20);
  p.userData = { origin:p.position.clone(), v:new THREE.Vector3(), noise:Math.random()*100 };
  particles.add(p);
}
scene.add(particles);

// 液態連線
const liquidWeb = new THREE.LineSegments(
  new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({ color:0xFFFFFF, transparent:true, opacity:0.22 })
);
scene.add(liquidWeb);

// ── 動態偵測 ─────────────────────────────────────────────────
function updateTracking() {
  if (state.isInteracting) return;
  if (!video || video.readyState < 2) return;
  const ctx = motionCanvas.getContext('2d');
  ctx.drawImage(video, 0, 0, motionCanvas.width, motionCanvas.height);
  const curr = ctx.getImageData(0, 0, motionCanvas.width, motionCanvas.height);
  if (prevFrame) {
    let tx=0,ty=0,count=0;
    for(let i=0;i<curr.data.length;i+=4){
      const diff=(Math.abs(curr.data[i]-prevFrame.data[i])+
                  Math.abs(curr.data[i+1]-prevFrame.data[i+1])+
                  Math.abs(curr.data[i+2]-prevFrame.data[i+2]))/3;
      if(diff>26){
        const idx=i/4;
        tx+=idx%motionCanvas.width;
        ty+=Math.floor(idx/motionCanvas.width);
        count++;
      }
    }
    if(count>25){
      let nx=1.0-(tx/count/motionCanvas.width);
      nx=Math.max(0,Math.min(1,(nx-0.05)/0.9));
      state.targetX=nx*innerWidth;
      state.targetY=(ty/count/motionCanvas.height)*innerHeight;
      cursorEl.classList.add('detecting');
    } else {
      cursorEl.classList.remove('detecting');
    }
  }
  if(!prevFrame) prevFrame=new ImageData(curr.width,curr.height);
  prevFrame.data.set(curr.data);
}

// ── 動畫迴圈 ─────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const time = Date.now()*0.001;

  shaderMat.uniforms.time.value   = time;
  shaderMat.uniforms.chaos.value  = chaos;
  state.transition += (state.targetTransition - state.transition)*0.12;
  shaderMat.uniforms.transition.value = state.transition;

  updateTracking();

  state.currentX += (state.targetX - state.currentX)*0.22;
  state.currentY += (state.targetY - state.currentY)*0.22;
  cursorEl.style.left = state.currentX+'px';
  cursorEl.style.top  = state.currentY+'px';

  // 模式切換
  const cycleTime = 8000/(0.35+entropy*1.6);
  if(Date.now()-state.lastSwitch > cycleTime){
    state.targetTransition = 0.1;
    setTimeout(()=>{
      state.modeCounter=(state.modeCounter+1)%6;
      state.subMode=state.modeCounter;
      state.phasePair=Math.floor(Math.random()*3)+1;
      shaderMat.uniforms.subMode.value   = state.subMode;
      shaderMat.uniforms.phasePair.value = state.phasePair;
      mesh.visible      = (state.phasePair===1||state.phasePair===3);
      particles.visible = (state.phasePair===2||state.phasePair===3);
      state.targetTransition=1.0;
    }, 400);
    state.lastSwitch=Date.now();
  }

  const wm = new THREE.Vector3(
    ((state.currentX/innerWidth)*2-1)*115,
    -((state.currentY/innerHeight)*2-1)*85, 10
  );

  // 背景平面頂點抖動
  if(mesh.visible){
    const arr=mesh.geometry.attributes.position.array;
    for(let i=0;i<arr.length;i+=3){
      const vx=arr[i],vy=arr[i+1];
      const dist=Math.sqrt((vx-wm.x)**2+(vy-wm.y)**2);
      let z=Math.sin(time*1.2+(vx+vy)*0.04)*(4.5+chaos*8.0);
      if(dist<100) z+=(100-dist)*(0.6+chaos*1.8);
      arr[i+2]=z;
    }
    mesh.geometry.attributes.position.needsUpdate=true;
  }

  // 幾何粒子物理
  if(particles.visible){
    const pts=[];
    particles.children.forEach(p=>{
      const ud=p.userData;
      let target=ud.origin.clone();
      const t=time*(0.35+chaos*1.3);
      target.x+=Math.sin(t+ud.noise)*(42*chaos);
      target.y+=Math.cos(t*0.85+ud.noise)*(42*chaos);
      const dist=p.position.distanceTo(wm);
      if(dist<88){
        const f=(1.0-dist/88)*(3.5+chaos*9.0);
        ud.v.add(new THREE.Vector3().subVectors(p.position,wm).normalize().multiplyScalar(f));
        if(Math.random()>0.45) pts.push(p.position.x,p.position.y,p.position.z,wm.x,wm.y,wm.z);
      }
      ud.v.add(new THREE.Vector3().subVectors(target,p.position).multiplyScalar(0.025));
      ud.v.multiplyScalar(0.86-chaos*0.12);
      p.position.add(ud.v);
      p.rotation.x+=ud.v.length()*0.07;
    });
    liquidWeb.geometry.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
    liquidWeb.geometry.attributes.position.needsUpdate=true;
  }

  renderer.render(scene,camera);
}
animate();

// ── resize ───────────────────────────────────────────────────
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ── 互動事件 ─────────────────────────────────────────────────
function onInteract(cx,cy){
  state.isInteracting=true;
  state.targetX=cx; state.targetY=cy;
}
container.addEventListener('mousedown', e=>onInteract(e.clientX,e.clientY));
container.addEventListener('mousemove', e=>{ if(e.buttons>0) onInteract(e.clientX,e.clientY); });
container.addEventListener('mouseup',   ()=>state.isInteracting=false);
container.addEventListener('touchstart',e=>onInteract(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
container.addEventListener('touchmove', e=>onInteract(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
container.addEventListener('touchend',  ()=>state.isInteracting=false);
</script>
