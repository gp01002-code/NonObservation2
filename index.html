<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《自我觀測儀》系統實踐原型 v14.1 - 幾何體修復與感應優化版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
            height: 100vh;
            font-family: 'Share Tech Mono', monospace;
        }

        /* CRT 濾鏡：純白感性 */
        .crt-overlay {
            pointer-events: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(255, 255, 255, 0.02) 50%), 
                        linear-gradient(90deg, rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.01));
            background-size: 100% 3px, 3px 100%;
            z-index: 200;
        }

        .main-viewport { width: 100vw; height: 100vh; position: relative; background: #000; cursor: none; }
        
        /* 純白懸浮旋鈕介面 */
        .knob-interface {
            position: absolute;
            right: 40px;
            bottom: 40px;
            display: flex;
            gap: 30px;
            z-index: 250;
            pointer-events: auto;
        }

        .circular-knob {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }
        .circular-knob:hover { border: 1px solid rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.1); }

        .knob-label {
            position: absolute;
            top: -22px;
            width: 100%;
            text-align: center;
            font-size: 7px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .knob-hand {
            width: 1px;
            height: 30px;
            background: rgba(255, 255, 255, 0.7);
            transform-origin: bottom;
            position: absolute;
            bottom: 50%;
        }

        /* 感應游標：紅色標誌，但操作時會變白 */
        .custom-cursor {
            width: 40px; height: 40px; 
            border: 2px solid #FF3131;
            position: fixed; pointer-events: none; 
            z-index: 300; 
            transform: translate(-50%, -50%);
            mix-blend-mode: screen;
            border-radius: 50%;
            transition: border-width 0.2s, transform 0.1s ease-out;
        }
        
        .cursor-detecting {
            box-shadow: 0 0 15px rgba(255, 49, 49, 0.3);
        }

        #motion-canvas {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 100px;
            height: 75px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            opacity: 0.2;
            z-index: 50;
        }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>
    <div id="cursor" class="custom-cursor"></div>

    <!-- 輔助感應視窗 -->
    <canvas id="motion-canvas"></canvas>

    <div class="knob-interface">
        <div class="circular-knob" id="knob-chaos">
            <div class="knob-label">CHAOS_MOD</div>
            <div class="knob-hand" id="hand-chaos"></div>
        </div>
        <div class="circular-knob" id="knob-entropy">
            <div class="knob-label">ENTROPY_MOD</div>
            <div class="knob-hand" id="hand-entropy"></div>
        </div>
    </div>

    <div class="main-viewport">
        <div id="three-container"></div>
    </div>

    <video id="video" autoplay playsinline style="display:none"></video>

    <!-- Shader：維持黏滯感的視覺分析 -->
    <script id="vertexShader" type="x-shader/x-vertex">
        varying vec2 vUv;
        uniform float time;
        uniform float chaos;

        void main() {
            vUv = uv;
            vec3 pos = position;
            // 受 Chaos 旋鈕影響的波浪位移
            float wave = sin(time * 1.5 + (pos.x * 0.05 + pos.y * 0.05)) * (chaos * 15.0);
            pos.z += wave;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    </script>
    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform sampler2D tDiffuse;
        uniform int phasePair;
        uniform int subMode;
        uniform float time;
        uniform float chaos;
        uniform float transition;
        varying vec2 vUv;

        void main() {
            vec2 uv = vUv;
            
            // 數位液化扭曲
            if(chaos > 0.1) {
                float d = distance(uv, vec2(0.5));
                uv.x += sin(d * 10.0 - time) * 0.02 * chaos;
                uv.y += cos(d * 10.0 - time) * 0.02 * chaos;
            }

            // 隨機鏡像邏輯 (Lacanian Split)
            if(phasePair == 1 || phasePair == 3) {
                if(subMode == 3) uv.x = abs(uv.x - 0.5) + 0.25;
            }

            vec4 tex = texture2D(tDiffuse, uv);
            float luma = dot(tex.rgb, vec3(0.299, 0.587, 0.114));
            vec4 finalCol = tex;

            // 白色美學分析濾鏡
            if(phasePair == 1 || phasePair == 2) {
                if(subMode % 5 == 0) { // White High-Key Thermal
                    vec3 col = mix(vec3(0.1), vec3(0.7, 0.8, 1.0), luma);
                    if(luma > 0.6) col = mix(col, vec3(1.0), (luma-0.6)*2.0);
                    finalCol = mix(finalCol, vec4(col, 1.0), 0.7 * transition);
                } else if (subMode % 5 == 1) { // Ghostly Edges
                    float edge = fwidth(luma) * 22.0;
                    finalCol += vec4(vec3(edge), 0.0) * transition;
                }
            }

            gl_FragColor = finalCol * transition;
        }
    </script>

    <script>
        let state = {
            phasePair: 1, subMode: 0,
            chaos: 0.5, entropy: 0.4,
            lastSwitch: 0, transition: 0, targetTransition: 1,
            // 坐標系統
            targetX: window.innerWidth / 2, targetY: window.innerHeight / 2,
            currentX: window.innerWidth / 2, currentY: window.innerHeight / 2,
            // 狀態鎖定
            isMouseInteracting: false,
            isSwitching: false
        };

        let scene, camera, renderer, videoTexture, mesh, particles, liquidWeb;
        let shaderMat, lagBuffer = [];
        const MAX_LAG = 45; 
        const CYCLE_INTERVAL = 8000;

        // --- 旋鈕控制修復：加入優先權鎖定 ---
        function initKnobs() {
            const setupKnob = (id, key) => {
                const knob = document.getElementById(id);
                const hand = document.getElementById('hand-' + id.split('-')[1]);
                let isDragging = false;
                
                const updateHand = (val) => {
                    hand.style.transform = `translateX(-50%) rotate(${val * 280 - 140}deg)`;
                };

                knob.onmousedown = (e) => {
                    isDragging = true;
                    state.isMouseInteracting = true; // 鎖定感應器，優先滑鼠操作
                    e.stopPropagation();
                };

                window.addEventListener('mouseup', () => {
                    if(isDragging) {
                        isDragging = false;
                        state.isMouseInteracting = false; // 解放感應器
                    }
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    state[key] = Math.max(0, Math.min(1, state[key] - e.movementY * 0.01));
                    updateHand(state[key]);
                    // 手動操作時同步更新 target 座標到旋鈕位置，避免游標亂跳
                    state.targetX = e.clientX;
                    state.targetY = e.clientY;
                });

                updateHand(state[key]);
            };
            setupKnob('knob-chaos', 'chaos');
            setupKnob('knob-entropy', 'entropy');
        }

        // --- 動態感應優化：修復重複偵測與位移累積問題 ---
        let prevFrame = null;
        const motionCanvas = document.getElementById('motion-canvas');
        const motionCtx = motionCanvas.getContext('2d');

        function updateMotionTracking() {
            if (state.isMouseInteracting) return; // 滑鼠操作時跳過感應

            const v = document.getElementById('video');
            if (v.readyState !== v.HAVE_ENOUGH_DATA) return;

            // 繪製當前影格到隱藏 Canvas
            motionCtx.drawImage(v, 0, 0, motionCanvas.width, motionCanvas.height);
            const currFrame = motionCtx.getImageData(0, 0, motionCanvas.width, motionCanvas.height);
            
            if (prevFrame) {
                let totalX = 0, totalY = 0, count = 0;
                const threshold = 35; // 靈敏度門檻

                for (let i = 0; i < currFrame.data.length; i += 4) {
                    // 計算影格差分
                    const rD = Math.abs(currFrame.data[i] - prevFrame.data[i]);
                    const gD = Math.abs(currFrame.data[i+1] - prevFrame.data[i+1]);
                    const bD = Math.abs(currFrame.data[i+2] - prevFrame.data[i+2]);
                    const diff = (rD + gD + bD) / 3;

                    if (diff > threshold) {
                        const idx = i / 4;
                        totalX += idx % motionCanvas.width;
                        totalY += Math.floor(idx / motionCanvas.width);
                        count++;
                        // 視覺回饋
                        currFrame.data[i] = 255; currFrame.data[i+1] = 255; currFrame.data[i+2] = 255;
                    }
                }

                if (count > 40) { 
                    const avgX = totalX / count;
                    const avgY = totalY / count;
                    // 映射並處理攝影機鏡像
                    state.targetX = (1 - (avgX / motionCanvas.width)) * window.innerWidth;
                    state.targetY = (avgY / motionCanvas.height) * window.innerHeight;
                    document.getElementById('cursor').classList.add('cursor-detecting');
                } else {
                    document.getElementById('cursor').classList.remove('cursor-detecting');
                }
                motionCtx.putImageData(currFrame, 0, 0);
            }
            // 關鍵：將當前影格克隆後存為 prevFrame，確保下一影格計算的是「淨變動」
            prevFrame = new ImageData(new Uint8ClampedArray(currFrame.data), currFrame.width, currFrame.height);
        }

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                document.getElementById('video').srcObject = stream;
                await document.getElementById('video').play();
            } catch(e) { console.error("無法開啟攝影機"); }

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 110;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 1);
            document.getElementById('three-container').appendChild(renderer.domElement);

            videoTexture = new THREE.VideoTexture(document.getElementById('video'));

            shaderMat = new THREE.ShaderMaterial({
                uniforms: { 
                    tDiffuse: { value: videoTexture }, 
                    phasePair: { value: 1 }, subMode: { value: 0 }, 
                    time: { value: 0 }, chaos: { value: 0.5 }, transition: { value: 1.0 }
                },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                transparent: true
            });

            mesh = new THREE.Mesh(new THREE.PlaneBufferGeometry(230, 170, 128, 128), shaderMat);
            scene.add(mesh);

            // 白色黏液連結網
            const lineMat = new THREE.LineBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.15 });
            liquidWeb = new THREE.LineSegments(new THREE.BufferGeometry(), lineMat);
            scene.add(liquidWeb);

            createFragments();
            initKnobs();
            animate();
        }

        function createFragments() {
            particles = new THREE.Group();
            const cols = 15, rows = 12;
            const w = 230/cols, h = 170/rows;
            
            // 定義受支援的幾何體（移除不支援的 CapsuleBufferGeometry）
            const geometries = [
                new THREE.TorusKnotBufferGeometry(w/3.5, 0.1, 32, 8),
                new THREE.OctahedronBufferGeometry(w/2, 1),
                new THREE.CylinderBufferGeometry(w/4, w/4, h, 8, 1), // 用圓柱體代替膠囊
                new THREE.SphereBufferGeometry(w/2, 16, 12)
            ];

            for(let i=0; i<cols; i++) {
                for(let j=0; j<rows; j++) {
                    const geo = geometries[Math.floor(Math.random()*geometries.length)];
                    const p = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ 
                        map: videoTexture, transparent: true, opacity: 0.92, color: 0xDDDDDD
                    }));
                    const ox = i*w-115+w/2, oy = j*h-85+h/2;
                    p.position.set(ox, oy, (Math.random()-0.5)*20);
                    p.userData = { 
                        origin: p.position.clone(), v: new THREE.Vector3(), 
                        noise: Math.random()*100, viscosity: 0.88 + Math.random()*0.1, elasticity: 0.015
                    };
                    particles.add(p);
                }
            }
            scene.add(particles);
        }

        function randomize() {
            state.isSwitching = true;
            state.targetTransition = 0.2; 
            setTimeout(() => {
                state.phasePair = Math.floor(Math.random() * 3) + 1;
                state.subMode = Math.floor(Math.random() * 6);
                shaderMat.uniforms.phasePair.value = state.phasePair;
                shaderMat.uniforms.subMode.value = state.subMode;
                mesh.visible = (state.phasePair === 1 || state.phasePair === 3);
                particles.visible = (state.phasePair === 2 || state.phasePair === 3);
                state.targetTransition = 1.0;
                state.isSwitching = false;
            }, 600);
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            shaderMat.uniforms.time.value = time;
            shaderMat.uniforms.chaos.value = state.chaos;

            updateMotionTracking();

            // 游標與感應點平滑 Lerp
            state.currentX += (state.targetX - state.currentX) * 0.12;
            state.currentY += (state.targetY - state.currentY) * 0.12;
            const cursorEl = document.getElementById('cursor');
            cursorEl.style.left = state.currentX + 'px';
            cursorEl.style.top = state.currentY + 'px';

            state.transition += (state.targetTransition - state.transition) * 0.08;
            shaderMat.uniforms.transition.value = state.transition;

            if(Date.now() - state.lastSwitch > CYCLE_INTERVAL / (0.4 + state.entropy) && !state.isSwitching) {
                randomize(); state.lastSwitch = Date.now();
            }

            // 將游標座標轉換為 3D 世界座標
            const wm = new THREE.Vector3(
                ((state.currentX / window.innerWidth) * 2 - 1) * 115,
                -((state.currentY / window.innerHeight) * 2 - 1) * 85, 10
            );

            if(particles.visible) {
                const points = [];
                particles.children.forEach((p, i) => {
                    const ud = p.userData;
                    let target = ud.origin.clone();
                    const t = time * (0.3 + state.chaos * 0.4);
                    target.x += Math.sin(t + ud.noise) * (45 * state.chaos);
                    target.y += Math.cos(t * 0.8 + ud.noise) * (45 * state.chaos);

                    const dist = p.position.distanceTo(wm);
                    if(dist < 75) {
                        const f = (1.0 - dist/75) * state.chaos * 5.5;
                        ud.v.add(new THREE.Vector3().subVectors(p.position, wm).normalize().multiplyScalar(f));
                        if(Math.random() > 0.6) points.push(p.position.x, p.position.y, p.position.z, wm.x, wm.y, wm.z);
                    }
                    ud.v.add(new THREE.Vector3().subVectors(target, p.position).multiplyScalar(ud.elasticity));
                    ud.v.multiplyScalar(ud.viscosity);
                    p.position.add(ud.v);
                    p.rotation.x += ud.v.length() * 0.04;
                });
                liquidWeb.geometry.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
                liquidWeb.geometry.attributes.position.needsUpdate = true;
            }

            if(mesh.visible) {
                const pos = mesh.geometry.attributes.position.array;
                for(let i=0; i<pos.length; i+=3) {
                    const vx = pos[i], vy = pos[i+1];
                    const d = Math.sqrt((vx-wm.x)**2 + (vy-wm.y)**2);
                    let z = Math.sin(time * 1.1 + (vx+vy)*0.035) * (3.0 + state.chaos * 6.0);
                    if(d < 100) z += (100-d) * state.chaos * 1.3;
                    pos[i+2] = z;
                }
                mesh.geometry.attributes.position.needsUpdate = true;
            }

            scene.rotation.y = ((state.currentX / window.innerWidth) - 0.5) * 0.05;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
